<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- 甲骨文风：扁平 U 外框，内部 >< 符号标志整体上移，居于 U 框上部敞口处 -->
  <defs>
    <!-- 朱砂金石渐变 -->
    <linearGradient id="oracleRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="60%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- 金石立体阴影 -->
    <filter id="inkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4C0519" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <g filter="url(#inkShadow)">
    <!-- 1. 外部扁平 U 字形甲骨器皿外框 -->
    <path d="M 105 140
             L 90 295
             L 250 370
             L 410 295
             L 395 140"
          fill="none"
          stroke="url(#oracleRedGrad)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- 2. 内部左折笔（> 符号，已上移至 y=155~280，中心交折于 y=218） -->
    <path d="M 165 155
             L 230 218
             L 165 280"
          fill="none"
          stroke="url(#oracleRedGrad)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- 3. 内部右折笔（< 符号，已上移并与左侧留出 40px 间距） -->
    <path d="M 335 155
             L 270 218
             L 335 280"
          fill="none"
          stroke="url(#oracleRedGrad)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
