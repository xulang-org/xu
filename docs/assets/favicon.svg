<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- Xu Web Favicon 专用规格 (32x32 极限清晰度优化) -->
  <defs>
    <linearGradient id="favRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>
  <!-- 外部扁平 U 框 -->
  <path d="M 6.5 9 L 5.5 19 L 16 24 L 26.5 19 L 25.5 9"
        fill="none" stroke="url(#favRed)" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 内部左折笔 -->
  <path d="M 10.5 10 L 14.5 14 L 10.5 18"
        fill="none" stroke="url(#favRed)" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 内部右折笔 -->
  <path d="M 21.5 10 L 17.5 14 L 21.5 18"
        fill="none" stroke="url(#favRed)" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
