<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"><style>html,body{margin:0;height:100%;overflow:hidden;background:#f6f3ef}@media(prefers-color-scheme:dark){html,body{background:#100e12}}canvas{width:100%;height:100%;touch-action:none;display:block}</style></head><body><canvas id="canvas"></canvas><script>
'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const imgCache=new Map();
function cacheImg(id,off){
 if(imgCache.has(id))imgCache.delete(id);
 while(imgCache.size>=256){imgCache.delete(imgCache.keys().next().value);}
 imgCache.set(id,off);
}
let last=[],pointer=null,lastTap={time:0,x:0,y:0,button:0,clicks:0},activeClicks=1;
const send=(kind,x=0,y=0,buttons=0,extra=null)=>{
 const msg=extra?[kind,x,y,buttons,innerWidth,innerHeight,devicePixelRatio,...extra]:[kind,x,y,buttons,innerWidth,innerHeight,devicePixelRatio];
 const payload=JSON.stringify(msg);
 if(window.webkit)window.webkit.messageHandlers.xu.postMessage(payload);
 else if(window.XuPhone)window.XuPhone.send(payload);
};
const color=n=>`rgba(${n>>>24},${n>>>16&255},${n>>>8&255},${(n&255)/255})`;
const segmenter=typeof Intl.Segmenter==='function'?new Intl.Segmenter(undefined,{granularity:'grapheme'}):null;
const graphemes=text=>segmenter?Array.from(segmenter.segment(text),s=>s.segment):Array.from(text);
function fitText(text,width){
 if(width<=0||ctx.measureText(text).width<=width)return text;
 if(ctx.measureText('…').width>width)return '';
 const chars=graphemes(text);
 let lo=0,hi=chars.length;
 while(lo<hi){const mid=Math.ceil((lo+hi)/2);if(ctx.measureText(chars.slice(0,mid).join('')+'…').width<=width)lo=mid;else hi=mid-1;}
 return chars.slice(0,lo).join('')+'…';
}
function isBreakable(ch){
 const cp=ch.codePointAt(0)||0;
 return ch===' '||ch==='\t'||cp>=0x2e80;
}
function wrapLines(text,width){
 const out=[];
 for(const para of String(text).replace(/\r\n?/g,'\n').split('\n')){
  if(width<=0||para===''||ctx.measureText(para).width<=width){out.push(para);continue;}
  const chars=graphemes(para);
  let start=0,lastBreak=-1;
  for(let i=0;i<chars.length;i++){
   const slice=chars.slice(start,i+1).join('');
   if(i>start&&ctx.measureText(slice).width>width){
    let cut=i;
    if(lastBreak>=start){cut=lastBreak+1;}
    let line=chars.slice(start,cut).join('');
    out.push(line.replace(/[ \t]+$/,''));
    start=cut;
    while(start<chars.length&&(chars[start]===' '||chars[start]==='\t'))start++;
    lastBreak=-1;
    i=start-1;
    continue;
   }
   if(isBreakable(chars[i]))lastBreak=i;
  }
  if(start<=chars.length)out.push(chars.slice(start).join(''));
 }
 return out.length?out:[''];
}
function draw(ops,depth=0){
 if(depth>16)return;
 let fill='#000',stroke='#000',width=1,stack=[];
 const pen=()=>{ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=width;};
 for(const c of ops){const op=c[0],rgba=c[1],v=c.slice(2,10);switch(op){
 case 1:ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=color(rgba);ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore();break;
 case 2:fill=stroke=color(rgba);break;case 3:fill=color(rgba);break;case 4:stroke=color(rgba);break;case 5:width=v[0];break;
 case 6:ctx.save();stack.push([fill,stroke,width]);break;
 case 7:ctx.restore();[fill,stroke,width]=stack.pop();break;
 case 8:ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);break;
 case 9:ctx.translate(v[0],v[1]);break;case 10:ctx.rotate(v[0]*Math.PI/180);break;case 11:ctx.scale(v[0],v[1]);break;
 case 12:ctx.beginPath();ctx.rect(...v.slice(0,4));ctx.clip();break;
 case 13:pen();ctx.fillRect(...v.slice(0,4));break;case 14:pen();ctx.strokeRect(...v.slice(0,4));break;
 case 15:ctx.fillStyle=color(rgba);ctx.fillRect(...v.slice(0,4));break;
 case 16:ctx.strokeStyle=color(rgba);ctx.lineWidth=v[4];ctx.strokeRect(...v.slice(0,4));break;
 case 17:ctx.strokeStyle=color(rgba);ctx.lineWidth=v[4];ctx.beginPath();ctx.moveTo(v[0],v[1]);ctx.lineTo(v[2],v[3]);ctx.stroke();break;
 case 18:ctx.fillStyle=color(rgba);ctx.font=`${v[2]}px system-ui`;ctx.textBaseline='top';ctx.fillText(c[10],v[0],v[1]);break;
 case 19:case 20:pen();ctx.beginPath();if(op===19)ctx.arc(v[0],v[1],v[2],0,2*Math.PI);else ctx.ellipse(v[0]+v[2]/2,v[1]+v[3]/2,v[2]/2,v[3]/2,0,0,2*Math.PI);ctx.fill();break;
 case 21:pen();ctx.beginPath();ctx.moveTo(v[0],v[1]);ctx.lineTo(v[2],v[3]);ctx.lineTo(v[4],v[5]);ctx.closePath();ctx.fill();break;
 case 22:{const arr=c[10];const w=arr[0],h=arr[1];let off=null;if(arr.length>=4){const id=arr[2],p=arr[3];const image=new ImageData(w,h);if(typeof p==='string'){const bin=atob(p);for(let i=0;i<bin.length;i++)image.data[i]=bin.charCodeAt(i);}off=document.createElement('canvas');off.width=w;off.height=h;off.getContext('2d').putImageData(image,0,0);cacheImg(id,off);}else if(typeof arr[2]==='number'){off=imgCache.get(arr[2])||null;if(!off)break;}else{const p=arr[2];const image=new ImageData(w,h);if(typeof p==='string'){const bin=atob(p);for(let i=0;i<bin.length;i++)image.data[i]=bin.charCodeAt(i);}else{for(let i=0;i<p.length;i+=4){const a=p[i+3];image.data[i]=a?Math.min(255,p[i+2]*255/a):0;image.data[i+1]=a?Math.min(255,p[i+1]*255/a):0;image.data[i+2]=a?Math.min(255,p[i]*255/a):0;image.data[i+3]=a;}}off=document.createElement('canvas');off.width=w;off.height=h;off.getContext('2d').putImageData(image,0,0);}ctx.save();ctx.globalAlpha=(rgba&65535)/65535;ctx.imageSmoothingEnabled=!(rgba&65536);ctx.drawImage(off,...v);ctx.restore();break;}
 case 23:{const [width,weight,italic,align,family,lineHeight=0,multi=0]=c[12]||[0,400,0,0,'',0,0];ctx.save();ctx.fillStyle=color(rgba);ctx.font=`${italic?'italic ':''}${weight} ${c[11]}px ${family?JSON.stringify(family):'system-ui'}`;ctx.textBaseline='top';const a=width>0?(['left','center','right'][align]||'left'):'left';ctx.textAlign=a;const dx=width>0?(align===1?width/2:align===2?width:0):0;if(multi||/[\r\n]/.test(c[10])){const lh=lineHeight>0?lineHeight:c[11]*1.4;const lines=wrapLines(c[10],width);for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],v[0]+dx,v[1]+i*lh);}else{ctx.fillText(fitText(c[10],width),v[0]+dx,v[1]);}ctx.restore();break;}
 case 24:{const [flags,line,miter,phase,dashes,segments]=c[10],p=new Path2D();for(const s of segments){if(s[0]===1)p.moveTo(s[1],s[2]);if(s[0]===2)p.lineTo(s[1],s[2]);if(s[0]===3)p.quadraticCurveTo(...s.slice(1));if(s[0]===4)p.bezierCurveTo(...s.slice(1));if(s[0]===5)p.closePath();}ctx.save();ctx.fillStyle=ctx.strokeStyle=color(rgba);ctx.lineWidth=line;ctx.miterLimit=miter;ctx.lineDashOffset=phase;ctx.setLineDash(dashes);ctx.lineCap=['butt','round','square'][(flags>>2)&3];ctx.lineJoin=['miter','round','bevel'][(flags>>4)&3];if(flags&1)ctx.stroke(p);else ctx.fill(p,flags&2?'evenodd':'nonzero');ctx.restore();break;}
 case 25:ctx.save();draw(c[10],depth+1);ctx.restore();break;
 case 26:{if(Array.isArray(c[10]))for(const id of c[10])imgCache.delete(id);break;}
 }}
}
window.xuFrame=ops=>{last=ops;if(canvas.width===0||canvas.height===0)return;ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.scale(devicePixelRatio,devicePixelRatio);draw(ops);ctx.restore();};
function resize(){canvas.width=Math.ceil(innerWidth*devicePixelRatio);canvas.height=Math.ceil(innerHeight*devicePixelRatio);xuFrame(last);send(0);}
const mapKey=k=>({Escape:256,Tab:257,Enter:258,Backspace:259,Delete:260,ArrowLeft:261,ArrowRight:262,ArrowUp:263,ArrowDown:264,Home:265,End:266,PageUp:267,PageDown:268,Insert:269,F1:288,F2:289,F3:290,F4:291,F5:292,F6:293,F7:294,F8:295,F9:296,F10:297,F11:298,F12:299,Shift:304,Control:305,Alt:306,Meta:307,CapsLock:308}[k]||(k&&k.length===1&&k.toUpperCase().codePointAt(0)<128?k.toUpperCase().codePointAt(0):0));
const eventMods=e=>(e.shiftKey?1:0)|(e.ctrlKey?2:0)|(e.altKey?4:0)|(e.metaKey?8:0);
for(const [type,kind] of [['pointerdown',72],['pointerup',73],['pointermove',74],['pointercancel',77]])canvas.addEventListener(type,e=>{
 if(type==='pointerdown'){
  if(pointer!==null)return;
  pointer=e.pointerId;
  canvas.setPointerCapture(pointer);
  const btn=e.button===2?2:(e.button===1?3:1);
  const now=performance.now();
  let clicks=1;
  if(btn===1&&lastTap.button===1&&now-lastTap.time<=450&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<=24)clicks=(lastTap.clicks%3)+1;
  lastTap={time:now,x:e.clientX,y:e.clientY,button:btn,clicks};
  activeClicks=clicks;
 }
 if(pointer!==e.pointerId)return;
 const btn=e.button===2?2:(e.button===1?3:1);
 const clicks=type==='pointerdown'||type==='pointerup'?Math.max(1,activeClicks):activeClicks;
 send(kind,e.clientX,e.clientY,e.buttons,[btn,eventMods(e),clicks]);
 if(type==='pointerup'||type==='pointercancel')pointer=null;
 e.preventDefault();
});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('lostpointercapture',e=>{if(pointer===e.pointerId){send(77,0,0,0,[1,0,0]);pointer=null;}});
addEventListener('blur',()=>{if(pointer!==null){send(77,0,0,0,[1,0,0]);pointer=null;}});
for(const [type,kind] of [['keydown',78],['keyup',79]])addEventListener(type,e=>{
 const code=mapKey(e.key),mods=eventMods(e);
 if(!code)return;
 send(kind,0,0,0,[code,mods,e.repeat?1:0]);
 if((mods&10)||code>=256&&code<=269)e.preventDefault();
});
addEventListener('resize',resize);resize();send(1);
</script></body></html>
