<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"><style>html,body{margin:0;height:100%;overflow:hidden;background:#f6f3ef}@media(prefers-color-scheme:dark){html,body{background:#100e12}}canvas{width:100%;height:100%;touch-action:none;display:block}</style></head><body><canvas id="canvas"></canvas><script>
'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let last=[],pointer=null;
const send=(kind,x=0,y=0,buttons=0)=>{
 const payload=JSON.stringify([kind,x,y,buttons,innerWidth,innerHeight,devicePixelRatio]);
 if(window.webkit)window.webkit.messageHandlers.xu.postMessage(payload);
 else if(window.XuPhone)window.XuPhone.send(payload);
};
const color=n=>`rgba(${n>>>24},${n>>>16&255},${n>>>8&255},${(n&255)/255})`;
const segmenter=typeof Intl.Segmenter==='function'?new Intl.Segmenter(undefined,{granularity:'grapheme'}):null;
function fitText(text,width){
 if(width<=0||ctx.measureText(text).width<=width)return text;
 if(ctx.measureText('…').width>width)return '';
 const chars=segmenter?Array.from(segmenter.segment(text),s=>s.segment):Array.from(text);
 let lo=0,hi=chars.length;
 while(lo<hi){const mid=Math.ceil((lo+hi)/2);if(ctx.measureText(chars.slice(0,mid).join('')+'…').width<=width)lo=mid;else hi=mid-1;}
 return chars.slice(0,lo).join('')+'…';
}
function draw(ops,depth=0){
 if(depth>16)return;
 let fill='#000',stroke='#000',width=1,stack=[];
 const pen=()=>{ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=width;};
 for(const c of ops){const op=c[0],rgba=c[1],v=c.slice(2,10);switch(op){
 case 1:ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=color(rgba);ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore();break;
 case 2:fill=stroke=color(rgba);break;case 3:fill=color(rgba);break;case 4:stroke=color(rgba);break;case 5:width=v[0];break;
 case 6:ctx.save();stack.push([fill,stroke,width]);break;
 case 7:ctx.restore();[fill,stroke,width]=stack.pop();break;
 case 8:ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);break;
 case 9:ctx.translate(v[0],v[1]);break;case 10:ctx.rotate(v[0]*Math.PI/180);break;case 11:ctx.scale(v[0],v[1]);break;
 case 12:ctx.beginPath();ctx.rect(...v.slice(0,4));ctx.clip();break;
 case 13:pen();ctx.fillRect(...v.slice(0,4));break;case 14:pen();ctx.strokeRect(...v.slice(0,4));break;
 case 15:ctx.fillStyle=color(rgba);ctx.fillRect(...v.slice(0,4));break;
 case 16:ctx.strokeStyle=color(rgba);ctx.lineWidth=v[4];ctx.strokeRect(...v.slice(0,4));break;
 case 17:ctx.strokeStyle=color(rgba);ctx.lineWidth=v[4];ctx.beginPath();ctx.moveTo(v[0],v[1]);ctx.lineTo(v[2],v[3]);ctx.stroke();break;
 case 18:ctx.fillStyle=color(rgba);ctx.font=`${v[2]}px system-ui`;ctx.textBaseline='top';ctx.fillText(c[10],v[0],v[1]);break;
 case 19:case 20:pen();ctx.beginPath();if(op===19)ctx.arc(v[0],v[1],v[2],0,2*Math.PI);else ctx.ellipse(v[0]+v[2]/2,v[1]+v[3]/2,v[2]/2,v[3]/2,0,0,2*Math.PI);ctx.fill();break;
 case 21:pen();ctx.beginPath();ctx.moveTo(v[0],v[1]);ctx.lineTo(v[2],v[3]);ctx.lineTo(v[4],v[5]);ctx.closePath();ctx.fill();break;
 case 22:{const [w,h,p]=c[10],image=new ImageData(w,h);for(let i=0;i<p.length;i+=4){const a=p[i+3];image.data[i]=a?Math.min(255,p[i+2]*255/a):0;image.data[i+1]=a?Math.min(255,p[i+1]*255/a):0;image.data[i+2]=a?Math.min(255,p[i]*255/a):0;image.data[i+3]=a;}const off=document.createElement('canvas');off.width=w;off.height=h;off.getContext('2d').putImageData(image,0,0);ctx.save();ctx.globalAlpha=(rgba&65535)/65535;ctx.imageSmoothingEnabled=!(rgba&65536);ctx.drawImage(off,...v);ctx.restore();break;}
 case 23:{const [width,weight,italic,align,family]=c[12]||[0,400,0,0,''];ctx.save();ctx.fillStyle=color(rgba);ctx.font=`${italic?'italic ':''}${weight} ${c[11]}px ${family?JSON.stringify(family):'system-ui'}`;ctx.textBaseline='top';ctx.textAlign=['left','center','right'][align]||'left';ctx.fillText(fitText(c[10],width),v[0]+(align===1?width/2:align===2?width:0),v[1]);ctx.restore();break;}
 case 24:{const [flags,line,miter,phase,dashes,segments]=c[10],p=new Path2D();for(const s of segments){if(s[0]===1)p.moveTo(s[1],s[2]);if(s[0]===2)p.lineTo(s[1],s[2]);if(s[0]===3)p.quadraticCurveTo(...s.slice(1));if(s[0]===4)p.bezierCurveTo(...s.slice(1));if(s[0]===5)p.closePath();}ctx.save();ctx.fillStyle=ctx.strokeStyle=color(rgba);ctx.lineWidth=line;ctx.miterLimit=miter;ctx.lineDashOffset=phase;ctx.setLineDash(dashes);ctx.lineCap=['butt','round','square'][(flags>>2)&3];ctx.lineJoin=['miter','round','bevel'][(flags>>4)&3];if(flags&1)ctx.stroke(p);else ctx.fill(p,flags&2?'evenodd':'nonzero');ctx.restore();break;}
 case 25:ctx.save();draw(c[10],depth+1);ctx.restore();break;
 }}
}
window.xuFrame=ops=>{last=ops;ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.scale(devicePixelRatio,devicePixelRatio);draw(ops);ctx.restore();};
function resize(){canvas.width=Math.ceil(innerWidth*devicePixelRatio);canvas.height=Math.ceil(innerHeight*devicePixelRatio);xuFrame(last);send(0);}
for(const [type,kind] of [['pointerdown',72],['pointerup',73],['pointermove',74],['pointercancel',77]])canvas.addEventListener(type,e=>{
 if(type==='pointerdown'){if(pointer!==null)return;pointer=e.pointerId;canvas.setPointerCapture(pointer);}
 if(pointer!==e.pointerId)return;
 send(kind,e.clientX,e.clientY,e.buttons);
 if(type==='pointerup'||type==='pointercancel')pointer=null;
 e.preventDefault();
});
addEventListener('resize',resize);resize();send(1);
</script></body></html>
