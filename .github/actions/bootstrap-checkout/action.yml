name: Frozen bootstrap checkout
description: Check out the independent primer without copying local development docs
inputs:
  bootstrap_ssh_key:
    description: Optional read-only SSH deploy key for xulang-org/bootstrap
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: xulang-org/bootstrap
        ref: ef96a61efeb32a0b217a301a779aa30937233813
        path: .ci/bootstrap
        ssh-key: ${{ inputs.bootstrap_ssh_key }}
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: xulang-org/packages
        path: .ci/packages
        persist-credentials: false
    - shell: bash
      run: |
        echo "XU_PACKAGES_ROOT=$GITHUB_WORKSPACE/.ci/packages" >> "$GITHUB_ENV"
        echo "XU_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        echo "XUPATH=$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"
        echo "XU_BOOTSTRAP_ROOT=$GITHUB_WORKSPACE/.ci/bootstrap" >> "$GITHUB_ENV"
        echo "XU_BOUNDARY_CI=1" >> "$GITHUB_ENV"
        git -C .ci/bootstrap rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
