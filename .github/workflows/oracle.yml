name: oracle

# Frozen primer as behavior oracle (bootstrap/FROZEN.md stage 2).
# Not on the product `make xu` path. Not every PR.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  oracle:
    name: make oracle (primer gen1_test)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap-checkout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ci/bootstrap
      - name: oracle
        # Keep the lane visible in the command itself; this workflow is never
        # product/self-host evidence.
        run: XU_CI_LANE=oracle make oracle
