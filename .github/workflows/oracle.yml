name: oracle

# Frozen primer as behavior oracle (bootstrap/FROZEN.md stage 2).
# Not on the product `make xu` path. Not every PR.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  oracle:
    name: oracle native fixed point
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap-checkout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ci/bootstrap
      - name: oracle
        # Keep the lane visible in the command itself; this workflow is never
        # product/self-host evidence.
        run: |
          cargo build --manifest-path .ci/bootstrap/Cargo.toml -p xu --bin xu
          XU_CI_LANE=oracle ./scripts/oracle_platform_chain.sh "$RUNNER_TEMP/xu-oracle" --keep
          cat "$RUNNER_TEMP/xu-oracle/chain.env" >> "$GITHUB_STEP_SUMMARY"
