name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

env:
  XU_CI_LANE: oracle

jobs:
  fast:
    name: fast (source contracts + primer libraries)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      XU_CI_LANE: oracle
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap-checkout
      - name: module versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE=HEAD
          else
            BASE=$(git merge-base "$BASE_SHA" HEAD)
          fi
          python3 scripts/module_versions.py --check --base "$BASE"
          if ! git diff --quiet "$BASE" -- VERSION; then
            python3 scripts/module_versions.py --check-release
          fi
      - uses: actions/checkout@v4
        with:
          repository: xulang-org/bench
          path: .ci/bench
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xulang-org/examples
          path: .ci/examples
          persist-credentials: false
      - name: companion source roots
        run: |
          echo "XU_BENCH_ROOT=$GITHUB_WORKSPACE/.ci/bench" >> "$GITHUB_ENV"
          echo "XU_EXAMPLES_ROOT=$GITHUB_WORKSPACE/.ci/examples" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ci/bootstrap
      - name: bootstrap/Xu boundary contract
        run: python3 scripts/check_bootstrap_xu_boundary.py
      - name: frozen primer registration (strict)
        # This checks that any new bootstrap Rust/Cargo implementation is
        # explicitly classified as oracle/auxiliary and cannot masquerade as
        # product self-host evidence.
        run: python3 scripts/check_bootstrap_xu_boundary.py --strict-freeze
      - name: bootstrap unit tests
        # Rust tests are oracle evidence only; they do not certify bin/xu.
        run: |
          # xuemit library tests include private Xu fixtures and run locally.
          # Build the complete emitter through the xu binary below.
          cargo test --manifest-path .ci/bootstrap/Cargo.toml --workspace --exclude xuemit --lib
          cargo build --manifest-path .ci/bootstrap/Cargo.toml -p xu --bin xu
      - name: oracle HTTP server local lifecycle smoke
        # CI fast has no hosted bin/xu seed yet.  Keep this an explicit
        # primer/oracle smoke; it must never be mistaken for product evidence.
        run: XU_COMPILER="$PWD/.ci/bootstrap/target/debug/xu" ./scripts/deploy_xu_server.sh smoke-local --oracle --opt O1
      - name: oracle HTTP server Linux x64 artifact check
        # Same oracle lane, with the lane visible in the command itself.
        run: XU_COMPILER="$PWD/.ci/bootstrap/target/debug/xu" ./scripts/deploy_xu_server.sh check-linux --oracle --opt O1 --output /tmp/xu-server-linux-x64.xin
      - name: ncall registry
        run: python3 scripts/check_ncall_registry.py
      - name: standard-library source/API matrix
        run: python3 scripts/generate_stdlib_matrix.py --output "$RUNNER_TEMP/stdlib-matrix.json"
      - name: public source safety contracts
        run: python3 scripts/check_crypto_constant_time.py
      - name: repository upload scope
        run: python3 scripts/check_git_hygiene.py --staged

  opt-oracle:
    name: oracle O0/O3 differential
    runs-on: macos-latest
    timeout-minutes: 45
    needs: fast
    env:
      XU_CI_LANE: oracle
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap-checkout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ci/bootstrap
      - name: build frozen primer
        run: cargo build --manifest-path .ci/bootstrap/Cargo.toml -p xu --bin xu
      - name: paired O0-O3 stdout vs clang (explicit oracle lane)
        run: |
          XU="$PWD/.ci/bootstrap/target/debug/xu"
          printf '%s\n' '@main' 'fn main() int {' '    mut s := 0' '    mut i := 0' '    while i < 100 {' '        s = s + i' '        i = i + 1' '    }' '    println(s)' '    << 0' '}' > /tmp/late_loop.xu
          printf '%s\n' '#include <stdio.h>' '#include <stdint.h>' 'int main(void) {' '    int64_t s = 0, i = 0;' '    while (i < 100) { s += i; i += 1; }' '    printf("%lld\n", (long long)s);' '    return 0;' '}' > /tmp/late_loop.c
          XUPATH="$PWD/src"
          export XUPATH
          for n in 0 1 2 3; do
            "$XU" /tmp/late_loop.xu -o "/tmp/late-xu-O$n.xin" "-O$n"
            clang "-O$n" -o "/tmp/late-clang-O$n" /tmp/late_loop.c
            "/tmp/late-xu-O$n.xin" > "/tmp/late-xu-O$n.out"
            "/tmp/late-clang-O$n" > "/tmp/late-clang-O$n.out"
            diff -u "/tmp/late-clang-O$n.out" "/tmp/late-xu-O$n.out"
          done
          echo "XU_CI_LANE=oracle paired O0-O3 stdout ok"

  product-gate:
    name: product SDK delivery (explicit)
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      XU_CI_LANE: product
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap-checkout
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: restore configured hosted seed
        if: vars.XU_PRODUCT_SEED_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: xu-product-seed
          path: bin
          github-token: ${{ github.token }}
          run-id: ${{ vars.XU_PRODUCT_SEED_RUN_ID || github.run_id }}
      - name: restore seed from a published product SDK
        if: vars.XU_PRODUCT_SEED_RUN_ID == ''
        env:
          GH_TOKEN: ${{ github.token }}
          XU_SDK_SEED_VERSION: ${{ vars.XU_SDK_SEED_VERSION }}
        run: python3 scripts/restore_product_seed.py --target macos-arm64 --destination bin/xu
      - name: product gate or fail closed
        run: |
          if [ -f bin/xu ]; then
            chmod +x bin/xu
            echo "XU_CI_LANE=product seed present" | tee -a "$GITHUB_STEP_SUMMARY"
            XU_SKIP_CROSS=1 ./scripts/build_hosted_chain.sh bin/xu bin/xu
            python3 scripts/check_release_identity.py --require-cli
            python3 scripts/pack_release_bundle.py --target host --out-dir "$RUNNER_TEMP/product-sdk"
            version=$(cat VERSION)
            python3 scripts/test_installed_sdk.py --archive "$RUNNER_TEMP/product-sdk/xu-v$version-macos-arm64.tar.gz"
          else
            echo "product-pr: BLOCKED — hosted seed missing; not product evidence" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "Set repository variable XU_PRODUCT_SEED_RUN_ID to a run containing xu-product-seed (xu + provenance)." >&2
            exit 1
          fi
