name: ci

on:
  push:
    branches: [main]
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  XU_CI_LANE: product
  XU_BOUNDARY_CI: "1"

jobs:
  contracts:
    name: fast (source & boundary contracts)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: module versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE=HEAD
          else
            BASE=$(git merge-base "$BASE_SHA" HEAD)
          fi
          RECOVERY_ARGS=()
          if [ "$(cat VERSION)" = "0.11.2" ]; then
            RECOVERY_ARGS+=(--unpublished-release 0.11.2)
          fi
          python3 scripts/module_versions.py --check --base "$BASE" "${RECOVERY_ARGS[@]}"
          if ! git diff --quiet "$BASE" -- VERSION; then
            python3 scripts/module_versions.py --check-release
          fi
      - uses: actions/checkout@v4
        with:
          repository: xulang-org/bench
          path: .ci/bench
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xulang-org/examples
          ref: 2da227ae61a90e1dfe73f4fc7989e6e5f5bdadd8
          path: .ci/examples
          persist-credentials: false
      - name: companion source roots
        run: |
          echo "XU_BENCH_ROOT=$GITHUB_WORKSPACE/.ci/bench" >> "$GITHUB_ENV"
          echo "XU_EXAMPLES_ROOT=$GITHUB_WORKSPACE/.ci/examples" >> "$GITHUB_ENV"
      - name: boundary contract (strict)
        run: python3 scripts/check_bootstrap_xu_boundary.py --strict-freeze
      - name: ncall registry
        run: python3 scripts/check_ncall_registry.py
      - name: standard-library source/API matrix
        run: python3 scripts/generate_stdlib_matrix.py --output "$RUNNER_TEMP/stdlib-matrix.json"
      - name: public source safety contracts
        run: python3 scripts/check_crypto_constant_time.py
      - name: repository upload scope
        run: python3 scripts/check_git_hygiene.py --staged

  product-gate:
    name: product compiler (hosted build + tests)
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      XU_CI_LANE: product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: xulang-org/examples
          ref: 2da227ae61a90e1dfe73f4fc7989e6e5f5bdadd8
          path: .ci/examples
          persist-credentials: false
      - name: companion source roots
        run: |
          echo "XU_EXAMPLES_ROOT=$GITHUB_WORKSPACE/.ci/examples" >> "$GITHUB_ENV"
      - name: restore hosted seed cache
        id: seed-cache
        uses: actions/cache/restore@v4
        with:
          path: bin/xu
          key: hosted-seed-macos-x64-${{ hashFiles('VERSION') }}
          restore-keys: |
            hosted-seed-macos-x64-
      - name: restore configured hosted seed artifact
        if: steps.seed-cache.outputs.cache-hit != 'true' && vars.XU_PRODUCT_SEED_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: xu-product-seed
          path: bin
          github-token: ${{ github.token }}
          run-id: ${{ vars.XU_PRODUCT_SEED_RUN_ID || github.run_id }}
      - name: restore seed from a published product SDK
        if: steps.seed-cache.outputs.cache-hit != 'true' && vars.XU_PRODUCT_SEED_RUN_ID == ''
        env:
          GH_TOKEN: ${{ github.token }}
          XU_SDK_SEED_VERSION: ${{ vars.XU_SDK_SEED_VERSION || '0.12.0-dev.1' }}
        run: python3 scripts/restore_product_seed.py --target macos-x64 --destination bin/xu --replace-existing
      - name: compile new xu compiler using seed
        run: |
          if [ -f bin/xu ]; then
            chmod +x bin/xu
            echo "XU_CI_LANE=product seed present: $(./bin/xu --version | head -n 2 | tail -n 1)" | tee -a "$GITHUB_STEP_SUMMARY"
            XU_SKIP_CROSS=1 ./scripts/build_hosted_chain.sh bin/xu bin/xu
            python3 scripts/check_release_identity.py --require-cli
            make tools
          else
            echo "product-pr: BLOCKED — hosted seed missing; cannot compile without seed" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: XACP discovery and launcher smoke
        run: make xacp-test
      - name: product HTTP server local lifecycle smoke
        run: XU_COMPILER="$PWD/bin/xu" ./scripts/deploy_xu_server.sh smoke-local
      - name: product HTTP server Linux x64 artifact check
        run: XU_COMPILER="$PWD/bin/xu" ./scripts/deploy_xu_server.sh check-linux --output /tmp/xu-server-linux-x64.xin
      - name: Compare default and unoptimized stdout with Clang
        run: |
          XU="$PWD/bin/xu"
          printf '%s\n' '@main' 'fn main() int {' '    $s := 0' '    $i := 0' '    while i < 100 {' '        s = s + i' '        i = i + 1' '    }' '    println(s)' '    << 0' '}' > /tmp/late_loop.xu
          printf '%s\n' '#include <stdio.h>' '#include <stdint.h>' 'int main(void) {' '    int64_t s = 0, i = 0;' '    while (i < 100) { s += i; i += 1; }' '    printf("%lld\n", (long long)s);' '    return 0;' '}' > /tmp/late_loop.c
          XUPATH="$PWD/src"
          export XUPATH
          for mode in default no-opt; do
            xu_flags=()
            clang_opt=-O2
            if [ "$mode" = no-opt ]; then
              xu_flags=(--no-opt)
              clang_opt=-O0
            fi
            "$XU" build /tmp/late_loop.xu -o "/tmp/late-xu-$mode.xin" "${xu_flags[@]}"
            clang "$clang_opt" -o "/tmp/late-clang-$mode" /tmp/late_loop.c
            "/tmp/late-xu-$mode.xin" > "/tmp/late-xu-$mode.out"
            "/tmp/late-clang-$mode" > "/tmp/late-clang-$mode.out"
            diff -u "/tmp/late-clang-$mode.out" "/tmp/late-xu-$mode.out"
          done
      - name: package and test installed SDK
        run: |
          python3 scripts/pack_release_bundle.py --target host --out-dir "$RUNNER_TEMP/product-sdk"
          version=$(cat VERSION)
          python3 scripts/test_installed_sdk.py --archive "$RUNNER_TEMP/product-sdk/xu-v$version-macos-x64.tar.gz"
          python3 scripts/check_sdk_reinstall.py --archive "$RUNNER_TEMP/product-sdk/xu-v$version-macos-x64.tar.gz"
      - name: save hosted seed cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: bin/xu
          key: hosted-seed-macos-x64-${{ github.sha }}
      - name: upload refreshed seed artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xu-product-seed
          if-no-files-found: warn
          path: |
            bin/xu
            bin/xu.provenance
      - name: upload product-gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-gate-ci
          path: ${{ runner.temp }}/product-gate/
          if-no-files-found: ignore
