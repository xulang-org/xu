name: platforms

# Cross-platform *run* evidence for the hosted compiler
# (docs/audit/OVERALL_OPTIMIZATION_PLAN_2026-09.md, A1 / §5.3).
#
# Evidence lane: PRODUCT (pure self-host). Every job restores the hosted product seed
# from published releases, self-hosts on the job's own OS/ISA (Gen1 -> Gen2 -> Gen3),
# and verifies an installed SDK package.
#
# Not a PR gate: nightly / push to main / dispatch so the platform matrix
# accumulates evidence before it becomes required.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

env:
  XU_CI_LANE: product

jobs:
  hosted:
    name: hosted chain + installed SDK (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            # GitHub-hosted arm64 runner (public repos; needs a plan on private
            # repos).  The qemu job below is the fallback evidence path.
            os: ubuntu-24.04-arm
          - name: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python3 shim (Git Bash on Windows only ships `python`)
        if: runner.os == 'Windows'
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            PYTHON_BIN=$(command -v python)
            cp "$PYTHON_BIN" "$(dirname "$PYTHON_BIN")/python3.exe"
          fi
      - name: temp dir in POSIX form
        # $RUNNER_TEMP is D:\a\_temp on Windows; the scripts want a POSIX path.
        run: |
          T=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")
          echo "T=$T" >> "$GITHUB_ENV"
      - name: boundary contract (strict)
        run: python3 scripts/check_bootstrap_xu_boundary.py --strict-freeze
      - name: restore product seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEST=bin/xu
          case "${{ matrix.name }}" in windows-*) DEST=bin/xu.exe ;; esac
          python3 scripts/restore_product_seed.py --target "${{ matrix.name }}" --destination "$DEST" --replace-existing
      - name: hosted chain on this platform (Gen1 -> Gen3, cmp Gen2 Gen3)
        run: |
          DEST="$T/xu-product/xu"
          SEED=bin/xu
          case "${{ matrix.name }}" in windows-*) DEST="$T/xu-product/xu.exe"; SEED=bin/xu.exe ;; esac
          ./scripts/build_hosted_chain.sh "$SEED" "$DEST"
      - name: package and run an installed product SDK
        run: |
          XU="$T/xu-product/xu"
          case "${{ matrix.name }}" in windows-*) XU="$XU.exe" ;; esac
          python3 scripts/pack_release_bundle.py --compiler "$XU" --target "${{ matrix.name }}" --lane product --out-dir "$T/product-sdk"
          version=$(cat VERSION)
          ext=tar.gz
          case "${{ matrix.name }}" in windows-*) ext=zip ;; esac
          python3 scripts/test_installed_sdk.py --archive "$T/product-sdk/xu-v$version-${{ matrix.name }}.$ext"
          python3 scripts/check_sdk_reinstall.py --archive "$T/product-sdk/xu-v$version-${{ matrix.name }}.$ext"
      - name: upload platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xu-product-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/xu-product/xu
            ${{ runner.temp }}/xu-product/xu.exe
            ${{ runner.temp }}/xu-product/xu.provenance
            ${{ runner.temp }}/xu-product/xu.exe.provenance
            ${{ runner.temp }}/product-sdk/SHA256SUMS
            ${{ runner.temp }}/product-sdk/RELEASE_MANIFEST.md

  qemu-user:
    # Loong64 / RISC-V 64 (and arm64 as a fallback when the arm64 runner is
    # unavailable): Xu emits fully static ELF, so qemu-user-static runs the
    # temporary user programs directly.  Compile-only was the previous evidence level
    # for these targets; this is the first run-level evidence.
    name: qemu-user program (${{ matrix.target }})
    needs: hosted
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-riscv64
            runner: qemu-riscv64-static
          - target: linux-loongarch64
            runner: qemu-loongarch64-static
          - target: linux-arm64
            runner: qemu-aarch64-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xu-product-linux-x64
          path: ${{ runner.temp }}
      - name: install qemu-user-static
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          "${{ matrix.runner }}" --version | head -1
      - name: cross-compile and run a user program
        run: |
          XU="$RUNNER_TEMP/xu-product/xu"
          chmod +x "$XU"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' '@main' 'fn main() int {' '    println("Hello, Xu!")' '    << 0' '}' > "$work/main.xu"
          "$XU" build "$work/main.xu" --target "${{ matrix.target }}" -o "$work/hello"
          "${{ matrix.runner }}" "$work/hello" > "$RUNNER_TEMP/program.log"
          printf '%s\n' 'Hello, Xu!' > "$work/expected.txt"
          diff -u "$work/expected.txt" "$RUNNER_TEMP/program.log"
          echo "Product user program passed under ${{ matrix.runner }}" >> "$GITHUB_STEP_SUMMARY"
      - name: upload qemu evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xu-qemu-${{ matrix.target }}
          path: ${{ runner.temp }}/program.log

  determinism:
    # A2 (cross determinism) needs a hosted seed on two platforms; until then
    # this job checks the weaker, single-host property the 2026-09-10 audit
    # found broken on macOS: the compiler unit's bytes must not depend on the
    # size of the process environment.
    name: build determinism (linux-x64)
    needs: hosted
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xu-product-linux-x64
          path: ${{ runner.temp }}
      - name: compiler unit, two environment sizes
        run: |
          XU="$RUNNER_TEMP/xu-product/xu"
          chmod +x "$XU"
          ./scripts/build_determinism.sh --xu="$XU" --pads=0,2000 2>&1 | tee "$RUNNER_TEMP/determinism.log"
          grep -E '^build_determinism: (PASS|FAIL|DIFF)' "$RUNNER_TEMP/determinism.log" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: upload determinism evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xu-determinism-linux-x64
          path: ${{ runner.temp }}/determinism.log
