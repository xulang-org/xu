name: windows

on:
  push:
    branches: [main]
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [main]

concurrency:
  group: windows-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  XU_CI_LANE: product

jobs:
  windows-build-and-check:
    name: windows (hosted product build + check)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python3 shim (Git Bash on Windows only ships `python`)
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            PYTHON_BIN=$(command -v python)
            cp "$PYTHON_BIN" "$(dirname "$PYTHON_BIN")/python3.exe"
          fi
      - name: restore hosted seed cache
        id: seed-cache
        uses: actions/cache/restore@v4
        with:
          path: bin/xu.exe
          key: hosted-seed-windows-x64-${{ hashFiles('VERSION') }}
          restore-keys: |
            hosted-seed-windows-x64-
      - name: restore seed from a published product SDK
        if: steps.seed-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          XU_SDK_SEED_VERSION: ${{ vars.XU_SDK_SEED_VERSION || '0.14.0' }}
        run: python3 scripts/restore_product_seed.py --target windows-x64 --destination bin/xu.exe --replace-existing
      - name: compile new xu compiler using seed
        run: |
          chmod +x bin/xu.exe
          ./scripts/build_hosted_chain.sh bin/xu.exe bin/xu.exe
      - name: compile and validate a Windows PE artifact
        run: |
          XU=./bin/xu.exe
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' '@main' 'fn main() int {' '    println("Hello, Xu!")' '    << 0' '}' > "$work/main.xu"
          "$XU" build --target windows-x64 "$work/main.xu" -o "$work/hello.exe"
          python -c 'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); from pack_release_bundle import validate_binary; validate_binary(Path(sys.argv[1]), "windows-x64")' "$work/hello.exe"
          "$work/hello.exe"
      - name: run Windows compiler & runtime regression suite
        env:
          XU: ${{ github.workspace }}/bin/xu.exe
          XU_ROOT: ${{ github.workspace }}
          XUPATH: ${{ github.workspace }}/src
          XU_STDLIB_ROOT: ${{ github.workspace }}/src
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          python3 scripts/check_const_casing.py --all
          python3 scripts/check_module_paths.py
          python3 scripts/check_ncall_registry.py
          python3 scripts/check_crypto_constant_time_codegen.py --xu bin/xu.exe
          python3 scripts/test_memory_safety.py --xu bin/xu.exe
          python3 scripts/test_gvn_frame_ranges.py bin/xu.exe
          python3 scripts/test_tensor_opt.py --compiler bin/xu.exe
          python3 scripts/test_tensor_types.py --compiler bin/xu.exe
          python3 scripts/test_tensor_simd.py --compiler bin/xu.exe
          python3 scripts/test_tensor_gemm.py --compiler bin/xu.exe
          python3 scripts/test_tensor_quant.py --compiler bin/xu.exe
          python3 scripts/test_tensor_gemv.py --compiler bin/xu.exe
          python3 scripts/test_windows_pe_wx.py --compiler bin/xu.exe
          python3 scripts/test_windows_pe_unwind.py --compiler bin/xu.exe
          python3 scripts/test_windows_workers.py --compiler bin/xu.exe
          python3 scripts/test_windows_socket_poll.py --compiler bin/xu.exe --target windows-x64
          python3 scripts/test_poller_step.py
          python3 scripts/test_crypto_cipher_modes.py
          python3 scripts/memsafe_multi_test.py --xu bin/xu.exe
          python3 scripts/test_checker_multi_error.py --compiler bin/xu.exe
          python3 scripts/test_compiler_p1.py --xu bin/xu.exe --front-only
          python3 scripts/test_http_step.py
      - name: save hosted seed cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: bin/xu.exe
          key: hosted-seed-windows-x64-${{ github.sha }}
