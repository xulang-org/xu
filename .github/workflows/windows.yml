name: windows

on:
  push:
  pull_request:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    # Check frozen primer compilation and PE identity here. Installed SDK
    # executes the hosted Windows product on both x64 and ARM64.
    name: windows (bootstrap oracle build + check)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap-checkout
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ci/bootstrap
      - name: bootstrap build
        run: cargo build -p xu --manifest-path .ci/bootstrap/Cargo.toml
      - name: oracle compile and validate a Windows PE artifact
        shell: bash
        run: |
          XU=./.ci/bootstrap/target/debug/xu.exe
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' '@main' 'fn main() int {' '    println("Hello, Xu!")' '    << 0' '}' > "$work/main.xu"
          "$XU" --target windows-x64 "$work/main.xu" -o "$work/hello.exe"
          python -c 'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); from pack_release_bundle import validate_binary; validate_binary(Path(sys.argv[1]), "windows-x64")' "$work/hello.exe"
