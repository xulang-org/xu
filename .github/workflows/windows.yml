name: windows

on:
  push:
  pull_request:

jobs:
  windows-smoke:
    # This workflow is an explicit primer/oracle check until a hosted Windows
    # product seed is available; it is not product self-host evidence.
    name: windows (bootstrap oracle build + check)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap-checkout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ci/bootstrap
      - name: bootstrap build
        run: cargo build -p xu --manifest-path .ci/bootstrap/Cargo.toml
      - name: oracle check hello fixture (windows-x64 cross from host)
        shell: bash
        run: |
          # Explicit oracle lane: the Rust primer is never the product seed.
          XU=./.ci/bootstrap/target/debug/xu.exe
          $XU --target windows-x64 tests/fixtures/hello/main.xu -o /tmp/hello.exe || \
          $XU tests/fixtures/hello/main.xu -o hello.exe
      - name: oracle net module compiles (check only)
        shell: bash
        run: |
          # Explicit oracle lane: product consumers use scripts/run_product_compiler.sh.
          XU=./.ci/bootstrap/target/debug/xu.exe
          $XU --check tests/fixtures/net_tcp_echo/main.xu
