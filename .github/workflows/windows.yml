name: windows

on:
  push:
  pull_request:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    # This workflow is an explicit primer/oracle check until a hosted Windows
    # product seed is available; it is not product self-host evidence.
    name: windows (bootstrap oracle build + check)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap-checkout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ci/bootstrap
      - name: bootstrap build
        run: cargo build -p xu --manifest-path .ci/bootstrap/Cargo.toml
      - name: oracle compile and run a Windows user program
        shell: bash
        run: |
          XU=./.ci/bootstrap/target/debug/xu.exe
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' '@main' 'fn main() int {' '    println("Hello, Xu!")' '    << 0' '}' > "$work/main.xu"
          "$XU" --target windows-x64 "$work/main.xu" -o "$work/hello.exe"
          "$work/hello.exe" > "$work/actual.txt"
          printf '%s\n' 'Hello, Xu!' > "$work/expected.txt"
          diff -u "$work/expected.txt" "$work/actual.txt"
