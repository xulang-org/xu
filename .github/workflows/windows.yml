name: windows

on:
  push:
  pull_request:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  XU_CI_LANE: product

jobs:
  windows-build-and-check:
    name: windows (hosted product build + check)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python3 shim (Git Bash on Windows only ships `python`)
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            PYTHON_BIN=$(command -v python)
            cp "$PYTHON_BIN" "$(dirname "$PYTHON_BIN")/python3.exe"
          fi
      - name: restore hosted seed cache
        id: seed-cache
        uses: actions/cache/restore@v4
        with:
          path: bin/xu.exe
          key: hosted-seed-windows-x64-${{ hashFiles('VERSION') }}
          restore-keys: |
            hosted-seed-windows-x64-
      - name: restore seed from a published product SDK
        if: steps.seed-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          XU_SDK_SEED_VERSION: ${{ vars.XU_SDK_SEED_VERSION }}
        run: python3 scripts/restore_product_seed.py --target windows-x64 --destination bin/xu.exe
      - name: compile new xu compiler using seed
        run: |
          chmod +x bin/xu.exe
          ./scripts/build_hosted_chain.sh bin/xu.exe bin/xu.exe
      - name: compile and validate a Windows PE artifact
        run: |
          XU=./bin/xu.exe
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' '@main' 'fn main() int {' '    println("Hello, Xu!")' '    << 0' '}' > "$work/main.xu"
          "$XU" build --target windows-x64 "$work/main.xu" -o "$work/hello.exe"
          python -c 'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); from pack_release_bundle import validate_binary; validate_binary(Path(sys.argv[1]), "windows-x64")' "$work/hello.exe"
          "$work/hello.exe"
      - name: save hosted seed cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: bin/xu.exe
          key: hosted-seed-windows-x64-${{ github.sha }}
