name: product-nightly

# Nightly product self-host and SDK delivery evidence.
# The complete Xu tests/ corpus is local and is not uploaded to CI.
# Requires a hosted seed (bin/xu restored from a previous artifact, a
# developer/bin snapshot, or XU_SEED).  Without a seed the job fails closed
# so a missing seed cannot be mistaken for product evidence.
#
# Complements platforms.yml (cross-platform product
# chain).  This workflow is the only nightly that is allowed to claim
# product SDK delivery evidence. The full Xu regression corpus stays local.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      seed_run_id:
        description: "Workflow run containing a macOS arm64 xu-product-seed artifact"
        required: false
        type: string
      profile:
        description: "product gate profile"
        required: false
        default: full
        type: choice
        options:
          - full
          - quick
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/pack_release_bundle.py"
      - "scripts/test_installed_sdk.py"
      - "scripts/check_sdk_reinstall.py"
      - "scripts/check_release_identity.py"
      - "Makefile"
      - "VERSION"
      - ".github/workflows/product-nightly.yml"

env:
  XU_CI_LANE: product

permissions:
  contents: read
  actions: read

jobs:
  product-gate:
    name: product SDK delivery (${{ inputs.profile || 'full' }})
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: restore configured hosted seed
        if: inputs.seed_run_id != '' || vars.XU_PRODUCT_SEED_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: xu-product-seed
          path: bin
          github-token: ${{ github.token }}
          run-id: ${{ inputs.seed_run_id || vars.XU_PRODUCT_SEED_RUN_ID || github.run_id }}
      - name: restore seed from a published product SDK
        if: inputs.seed_run_id == '' && vars.XU_PRODUCT_SEED_RUN_ID == ''
        env:
          GH_TOKEN: ${{ github.token }}
          XU_SDK_SEED_VERSION: ${{ vars.XU_SDK_SEED_VERSION }}
        run: python3 scripts/restore_product_seed.py --target macos-x64 --destination bin/xu --replace-existing
      - name: seed present?
        id: seed
        run: |
          if [ -f bin/xu ]; then
            chmod +x bin/xu
            echo "present=1" >> "$GITHUB_OUTPUT"
            shasum -a 256 bin/xu
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
            echo "No hosted seed (bin/xu). Product gate cannot run as product evidence." >&2
            echo "Set XU_PRODUCT_SEED_RUN_ID or dispatch seed_run_id to a run containing xu-product-seed." >&2
          fi
      - name: product SDK delivery
        if: steps.seed.outputs.present == '1'
        run: |
          XU_SKIP_CROSS=1 ./scripts/build_hosted_chain.sh bin/xu bin/xu
          profile="${{ inputs.profile || 'full' }}"
          if [ "$profile" = "quick" ]; then
            python3 scripts/pack_release_bundle.py --target host --out-dir "$RUNNER_TEMP/product-sdk"
          else
            python3 scripts/pack_release_bundle.py --all --out-dir "$RUNNER_TEMP/product-sdk"
          fi
          version=$(cat VERSION)
          python3 scripts/test_installed_sdk.py --archive "$RUNNER_TEMP/product-sdk/xu-v$version-macos-x64.tar.gz"
          python3 scripts/check_sdk_reinstall.py --archive "$RUNNER_TEMP/product-sdk/xu-v$version-macos-x64.tar.gz"
      - name: release identity
        if: steps.seed.outputs.present == '1'
        run: python3 scripts/check_release_identity.py --require-cli
      - name: upload SDK delivery metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-gate-nightly
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/product-sdk/SHA256SUMS
            ${{ runner.temp }}/product-sdk/RELEASE_MANIFEST.md
      - name: upload refreshed seed
        if: steps.seed.outputs.present == '1' && success()
        uses: actions/upload-artifact@v4
        with:
          name: xu-product-seed
          if-no-files-found: warn
          path: |
            bin/xu
            bin/xu.provenance
      - name: fail closed when seed missing
        if: steps.seed.outputs.present != '1'
        run: |
          echo "product-nightly: BLOCKED — hosted seed missing; not product evidence" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Set XU_PRODUCT_SEED_RUN_ID or dispatch seed_run_id to a run containing xu-product-seed (xu + provenance)." >&2
          # Fail closed: a green nightly without a seed must not count as
          # product-lane evidence (OPEN_ADVANCED... §4 P0.2).
          exit 1
