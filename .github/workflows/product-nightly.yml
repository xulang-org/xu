name: product-nightly

# P0.2 nightly product-lane evidence.
# Requires a hosted seed (bin/xu restored from a previous artifact, a
# developer/bin snapshot, or XU_SEED).  Without a seed the job fails closed
# with an explicit skip so it cannot be mistaken for product evidence.
#
# Distinct from oracle.yml (primer) and platforms.yml (oracle platform
# chain).  This workflow is the only nightly that is allowed to claim
# product-gate evidence.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      seed_run_id:
        description: "Workflow run containing a macOS arm64 xu-product-seed artifact"
        required: false
        type: string
      profile:
        description: "product gate profile"
        required: false
        default: full
        type: choice
        options:
          - full
          - quick
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/product_gate.sh"
      - "scripts/check_release_identity.py"
      - "Makefile"
      - "VERSION"
      - ".github/workflows/product-nightly.yml"

env:
  XU_CI_LANE: product

permissions:
  contents: read
  actions: read

jobs:
  product-gate:
    name: product-gate (${{ inputs.profile || 'full' }})
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap-checkout
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: restore hosted seed from previous successful gate (if any)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: xu-product-seed
          path: bin
          github-token: ${{ github.token }}
          run-id: ${{ inputs.seed_run_id || vars.XU_PRODUCT_SEED_RUN_ID || github.run_id }}
      - name: seed present?
        id: seed
        run: |
          if [ -f bin/xu ]; then
            chmod +x bin/xu
            echo "present=1" >> "$GITHUB_OUTPUT"
            shasum -a 256 bin/xu
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
            echo "No hosted seed (bin/xu). Product gate cannot run as product evidence." >&2
            echo "Set XU_PRODUCT_SEED_RUN_ID or dispatch seed_run_id to a run containing xu-product-seed." >&2
          fi
      - name: product-gate
        if: steps.seed.outputs.present == '1'
        run: |
          profile="${{ inputs.profile || 'full' }}"
          if [ "$profile" = "quick" ]; then
            ./scripts/product_gate.sh --quick --out="$RUNNER_TEMP/product-gate"
          else
            ./scripts/product_gate.sh --out="$RUNNER_TEMP/product-gate"
          fi
      - name: release identity
        if: steps.seed.outputs.present == '1'
        run: python3 scripts/check_release_identity.py --require-cli
      - name: upload product-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-gate-nightly
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/product-gate/product_gate.latest.txt
            ${{ runner.temp }}/product-gate/product_gate.latest.json
            ${{ runner.temp }}/product-gate/product_gate-logs/
      - name: upload refreshed seed
        if: steps.seed.outputs.present == '1' && success()
        uses: actions/upload-artifact@v4
        with:
          name: xu-product-seed
          if-no-files-found: warn
          path: |
            bin/xu
            bin/xu.provenance
      - name: fail closed when seed missing
        if: steps.seed.outputs.present != '1'
        run: |
          echo "product-nightly: BLOCKED — hosted seed missing; not product evidence" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Set XU_PRODUCT_SEED_RUN_ID or dispatch seed_run_id to a run containing xu-product-seed (xu + provenance)." >&2
          # Fail closed: a green nightly without a seed must not count as
          # product-lane evidence (OPEN_ADVANCED... §4 P0.2).
          exit 1
