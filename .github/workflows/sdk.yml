name: Installed SDK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      seed_run_id:
        description: "Previous SDK run containing xu-sdk-product-<target> artifacts"
        required: false
        type: string
      seed_version:
        description: "Published SDK seed release (default: current VERSION)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XU_CI_LANE: product
  XU_BOUNDARY_CI: "1"

jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_sdk_distribution.py

  native:
    name: Install and run (${{ matrix.target }}, product)
    needs: contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            arch: x64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
          - target: macos-x64
            os: macos-15-intel
            arch: x64
          - target: macos-arm64
            os: macos-15
            arch: arm64
          - target: windows-x64
            os: windows-2025
            arch: x64
          - target: windows-arm64
            os: windows-11-arm
            arch: arm64
    defaults:
      run:
        shell: bash
        working-directory: xu
    steps:
      - uses: actions/checkout@v4
        with:
          path: xu
      - uses: actions/checkout@v4
        with:
          repository: xulang-org/bootstrap
          path: bootstrap
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xulang-org/packages
          path: packages
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xulang-org/examples
          path: examples
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - name: Python command in Git Bash
        if: runner.os == 'Windows'
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            PYTHON_BIN=$(command -v python)
            cp "$PYTHON_BIN" "$(dirname "$PYTHON_BIN")/python3.exe"
          fi
      - name: Source contract (local docs stay local)
        run: python3 scripts/check_bootstrap_xu_boundary.py --ci --strict-freeze
      - name: Restore hosted SDK seeds
        if: inputs.seed_run_id != '' || vars.XU_SDK_SEED_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: xu-sdk-product-${{ matrix.target }}
          path: seed
          github-token: ${{ github.token }}
          run-id: ${{ inputs.seed_run_id || vars.XU_SDK_SEED_RUN_ID || github.run_id }}
      - name: Download published SDK seed
        if: inputs.seed_run_id == '' && vars.XU_SDK_SEED_RUN_ID == ''
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_VERSION: ${{ inputs.seed_version || vars.XU_SDK_SEED_VERSION }}
        run: |
          VERSION=${SEED_VERSION:-$(cat VERSION)}
          EXT=tar.gz
          case "${{ matrix.target }}" in windows-*) EXT=zip ;; esac
          gh release download "v$VERSION" --repo xulang-org/xu --pattern "xu-v$VERSION-${{ matrix.target }}.$EXT" --dir ../seed
      - name: Extract seed and rebuild native product chain
        run: |
          TEMP_POSIX=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")
          python3 scripts/sdk_seed.py --archives ../seed --target "${{ matrix.target }}" --destination "$TEMP_POSIX/sdk-seed" --output "$TEMP_POSIX/sdk-seed.compiler"
          SEED=$(cat "$TEMP_POSIX/sdk-seed.compiler")
          SEED=$(cygpath -u "$SEED" 2>/dev/null || printf '%s' "$SEED")
          XU=bin/xu
          case "${{ matrix.target }}" in windows-*) XU=bin/xu.exe ;; esac
          XU_SKIP_CROSS=1 ./scripts/build_hosted_chain.sh "$SEED" "$XU"
      - name: Package and test the installed SDK
        run: |
          TEMP_POSIX=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")
          XU=bin/xu
          case "${{ matrix.target }}" in windows-*) XU=bin/xu.exe ;; esac
          python3 scripts/pack_release_bundle.py --compiler "$XU" --target "${{ matrix.target }}" --lane product --out-dir dist/sdk-ci
          VERSION=$(cat VERSION)
          EXT=tar.gz
          case "${{ matrix.target }}" in windows-*) EXT=zip ;; esac
          python3 scripts/test_installed_sdk.py --archive "dist/sdk-ci/xu-v$VERSION-${{ matrix.target }}.$EXT"
          echo "Native product chain and SDK installation passed." >> "$GITHUB_STEP_SUMMARY"
          for repo in ../bootstrap ../packages ../examples; do git -C "$repo" rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"; done
      - name: Save diagnostic archives and chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xu-sdk-product-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            xu/dist/sdk-ci/
            xu/bin/xu.provenance
            xu/bin/xu.exe.provenance
