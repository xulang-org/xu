name: Installed SDK

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      seed_run_id:
        description: "Previous SDK run containing xu-sdk-product-<target> artifacts"
        required: false
        type: string
      seed_version:
        description: "Published SDK seed release (default: latest published release)"
        required: false
        type: string

      cross_seed_run_id:
        description: "Previous recovery run containing xu-regenerated-sdk-seeds"
        required: false
        type: string
      native_target:
        description: "Native target to validate"
        required: false
        default: all
        type: choice
        options:
          - all
          - macos-x64
          - windows-x64
          - windows-arm64
          - macos-arm64
          - linux-x64
          - linux-arm64
      rebuild_seed:
        description: "Regenerate SDK seeds on macOS ARM64 to recover broken cross-platform seeds"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: sdk-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'ci' }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  XU_CI_LANE: product
  XU_BOUNDARY_CI: "1"
  PYTHONUTF8: "1"

jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q scripts
      - run: python scripts/check_module_paths.py
      - run: python scripts/check_git_hygiene.py --staged

  cross-seeds:
    name: Native macOS Intel SDK and platform seeds
    if: inputs.rebuild_seed == true || github.event_name != 'workflow_dispatch'
    needs: contracts
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xulang-org/examples
          ref: d23e09363c34bebf5a4b71560ae04d79384bdd76
          path: .ci/examples
          persist-credentials: false
      - name: bundled examples root
        run: echo "XU_EXAMPLES_ROOT=$GITHUB_WORKSPACE/.ci/examples" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native Windows draw packaging dependencies
        run: |
          brew install mingw-w64
          python3 -m pip install Pillow
      - name: Restore a verified native hosted seed
        env:
          GH_TOKEN: ${{ github.token }}
          XU_SDK_SEED_VERSION: ${{ inputs.seed_version || vars.XU_SDK_SEED_VERSION }}
        run: python3 scripts/restore_product_seed.py --artifact-run-id 40694305016 --target macos-x64 --destination bin/xu --replace-existing
      - name: Build current product compiler and platform SDK seeds
        run: |
          XU_SKIP_CROSS=1 ./scripts/build_hosted_chain.sh bin/xu bin/xu
          python3 scripts/pack_release_bundle.py --all --out-dir dist/sdk-seeds
      - name: Native macOS Intel installed SDK
        env:
          XU: ${{ github.workspace }}/bin/xu
        run: |
          set -euo pipefail
          mkdir -p dist/sdk-debug
          python3 scripts/pack_release_bundle.py --target macos-x64 --out-dir dist/sdk-ci
          VERSION=$(cat VERSION)
          python3 scripts/test_installed_sdk.py --archive "dist/sdk-ci/xu-v$VERSION-macos-x64.tar.gz" --native-setup 2>&1 | tee dist/sdk-debug/macos-x64-installed.log
          python3 scripts/check_sdk_reinstall.py --archive "dist/sdk-ci/xu-v$VERSION-macos-x64.tar.gz" 2>&1 | tee dist/sdk-debug/macos-x64-reinstall.log
      - name: Save native macOS Intel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xu-sdk-product-macos-x64
          path: |
            dist/sdk-ci/
            dist/sdk-debug/
            bin/xu.provenance
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: xu-regenerated-sdk-seeds
          path: |
            dist/sdk-seeds/
            bin/xu.provenance
          if-no-files-found: error

  native:
    name: Install and run (${{ matrix.target }}, product)
    needs: [contracts, cross-seeds]
    if: always() && needs.contracts.result == 'success' && (needs.cross-seeds.result == 'skipped' || needs.cross-seeds.result == 'success') && (needs.cross-seeds.result != 'success' || inputs.native_target != 'macos-x64')
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","macos-x64":"macos-15-intel","macos-arm64":"macos-15","windows-x64":"windows-2025","windows-arm64":"windows-11-arm"}')[matrix.target] }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Seed regeneration already runs the full native x64 checks on its
        # allocated Mac. Manual seed reuse still schedules all six targets.
        target: ${{ inputs.native_target != '' && inputs.native_target != 'all' && fromJSON(format('["{0}"]', inputs.native_target)) || fromJSON(needs.cross-seeds.result == 'success' && '["linux-x64","linux-arm64","macos-arm64","windows-x64","windows-arm64"]' || '["linux-x64","linux-arm64","macos-x64","macos-arm64","windows-x64","windows-arm64"]') }}
    defaults:
      run:
        shell: bash
        working-directory: xu
    steps:
      - uses: actions/checkout@v4
        with:
          path: xu
      - uses: actions/checkout@v4
        with:
          repository: xulang-org/packages
          path: packages
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xulang-org/examples
          ref: d23e09363c34bebf5a4b71560ae04d79384bdd76
          path: examples
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ endsWith(matrix.target, '-arm64') && 'arm64' || 'x64' }}
      - name: Python command in Git Bash
        if: runner.os == 'Windows'
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            PYTHON_BIN=$(command -v python)
            cp "$PYTHON_BIN" "$(dirname "$PYTHON_BIN")/python3.exe"
          fi
      - name: Install packaging dependencies
        run: |
          python3 -m pip install Pillow || python -m pip install Pillow || true
      - name: Source contract (local docs stay local)
        run: python3 scripts/check_bootstrap_xu_boundary.py --ci --strict-freeze
      - name: Restore regenerated hosted SDK seeds
        if: needs.cross-seeds.result == 'success' || inputs.cross_seed_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: xu-regenerated-sdk-seeds
          path: seed
          github-token: ${{ github.token }}
          run-id: ${{ needs.cross-seeds.result == 'success' && github.run_id || inputs.cross_seed_run_id || github.run_id }}
      - name: Restore hosted SDK seeds
        if: needs.cross-seeds.result == 'skipped' && inputs.cross_seed_run_id == '' && (inputs.seed_run_id != '' || vars.XU_SDK_SEED_RUN_ID != '')
        uses: actions/download-artifact@v4
        with:
          name: xu-sdk-product-${{ matrix.target }}
          path: seed
          github-token: ${{ github.token }}
          run-id: ${{ inputs.seed_run_id || vars.XU_SDK_SEED_RUN_ID || github.run_id }}
      - name: Download published SDK seed
        if: needs.cross-seeds.result == 'skipped' && inputs.cross_seed_run_id == '' && inputs.seed_run_id == '' && vars.XU_SDK_SEED_RUN_ID == ''
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_VERSION: ${{ inputs.seed_version || vars.XU_SDK_SEED_VERSION }}
        run: |
          python3 scripts/restore_product_seed.py --artifact-run-id 40694305016 --target "${{ matrix.target }}" --version "$SEED_VERSION" --archives ../seed
      - name: Extract seed and rebuild native product chain
        run: |
          TEMP_POSIX=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")
          python3 scripts/sdk_seed.py --archives ../seed --target "${{ matrix.target }}" --destination "$TEMP_POSIX/sdk-seed" --output "$TEMP_POSIX/sdk-seed.compiler"
          SEED=$(cat "$TEMP_POSIX/sdk-seed.compiler")
          SEED=$(cygpath -u "$SEED" 2>/dev/null || printf '%s' "$SEED")
          XU=bin/xu
          case "${{ matrix.target }}" in windows-*) XU=bin/xu.exe ;; esac
          mkdir -p dist/sdk-debug
          if XU_SKIP_CROSS=1 HOSTED_CHAIN_KEEP_FAILURES=1 ./scripts/build_hosted_chain.sh "$SEED" "$XU" 2>&1 | tee dist/sdk-debug/chain.log; then
            echo "Native hosted chain passed."
          else
            if [ "${{ matrix.target }}" = macos-x64 ]; then
              . ./scripts/gen1_sources.sh
              XUPATH="" XU_STDLIB_ROOT="$PWD/src" lldb --batch -o run -o 'thread backtrace all' -o 'register read' -o 'disassemble --pc --count 16' -- "$SEED" build $GEN1_SRCS -o "$RUNNER_TEMP/sdk-debug.xin" > dist/sdk-debug/lldb.log 2>&1 || true
              cat dist/sdk-debug/lldb.log
            fi
            exit 1
          fi
      - name: Package and test the installed SDK
        run: |
          TEMP_POSIX=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")
          XU=bin/xu
          case "${{ matrix.target }}" in windows-*) XU=bin/xu.exe ;; esac
          python3 scripts/pack_release_bundle.py --compiler "$XU" --target "${{ matrix.target }}" --lane product --out-dir dist/sdk-ci
          VERSION=$(cat VERSION)
          EXT=tar.gz
          case "${{ matrix.target }}" in windows-*) EXT=zip ;; esac
          python3 scripts/test_installed_sdk.py --archive "dist/sdk-ci/xu-v$VERSION-${{ matrix.target }}.$EXT" --native-setup
          python3 scripts/check_sdk_reinstall.py --archive "dist/sdk-ci/xu-v$VERSION-${{ matrix.target }}.$EXT"
          INSTALLER="dist/sdk-ci/xu-setup-${{ matrix.target }}"
          case "${{ matrix.target }}" in windows-*) INSTALLER="dist/sdk-ci/xu-setup-${{ matrix.target }}.exe" ;; esac
          if [ -f "$INSTALLER" ]; then
            python3 scripts/test_installed_sdk.py --installer "$INSTALLER"
          fi
          echo "Native product chain and SDK installation passed." >> "$GITHUB_STEP_SUMMARY"
          for repo in ../packages ../examples; do [ -d "$repo" ] && git -C "$repo" rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"; done
      - name: Save diagnostic archives and chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xu-sdk-product-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            xu/dist/sdk-ci/
            xu/dist/sdk-debug/
            xu/bin/xu.provenance
            xu/bin/xu.exe.provenance
