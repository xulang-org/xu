name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.8.9). Default: v + VERSION"
        required: false
        type: string
      custom_notes:
        description: "Optional custom notes or announcement highlights (Markdown)"
        required: false
        type: string
      previous_tag:
        description: "Previous release tag for the changelog (e.g. v0.8.12)"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release (auto: true if tag contains -dev/-rc/-alpha/-beta)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - true
          - false
      draft:
        description: "Create as draft"
        required: false
        default: false
        type: boolean
      build_only:
        description: "Build and validate artifacts without creating a tag or GitHub Release"
        required: false
        default: false
        type: boolean
      artifact_run_id:
        description: "Reuse a verified release bundle from an accepted main release run; do not rebuild"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  XU_CI_LANE: product
  XU_BOUNDARY_CI: "1"

jobs:
  release-policy:
    name: Check release publication state
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      published: ${{ steps.policy.outputs.published }}
      tag: ${{ steps.policy.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check requested tag and existing publication
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          EXPECTED_TAG="v$(cat VERSION)"
          TAG="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != tag && -z "$REQUESTED_TAG" ]]; then
            TAG="$EXPECTED_TAG"
          fi
          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $TAG does not match VERSION ($EXPECTED_TAG)" >&2
            exit 1
          fi
          ERROR_FILE="$RUNNER_TEMP/release-publication-error.txt"
          if PUBLISHED=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq '.draft == false and .published_at != null' 2>"$ERROR_FILE"); then
            case "$PUBLISHED" in
              true|false) ;;
              *) echo "Invalid release publication response" >&2; exit 1 ;;
            esac
          elif grep -q 'HTTP 404' "$ERROR_FILE"; then
            PUBLISHED=false
          else
            cat "$ERROR_FILE" >&2
            exit 1
          fi
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISHED" == true ]]; then
            echo "Release $TAG is already published; leaving its tag and assets intact."
          fi

  runtime-validation:
    name: Six-platform runtime and package protocols
    needs: release-policy
    if: needs.release-policy.outputs.published == 'false'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/sdk.yml

  reuse-release:
    name: Validate an existing CI release bundle
    needs: [release-policy, runtime-validation]
    if: needs.release-policy.outputs.published == 'false' && inputs.artifact_run_id != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.source.outputs.artifact_id }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Require a successful build from accepted main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.artifact_run_id }}
          EXPECTED_TAG: ${{ needs.release-policy.outputs.tag }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, re, subprocess
          repo, run_id, tag = (os.environ[k] for k in ("GH_REPO", "SOURCE_RUN", "EXPECTED_TAG"))
          assert run_id.isdecimal()
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/{path}"], text=True))
          run = api(f"actions/runs/{run_id}")
          assert run["workflow_id"] == api("actions/workflows/release.yml")["id"]
          assert run["head_branch"] == "main" and run["status"] == "completed"
          jobs = api(f"actions/runs/{run_id}/jobs?per_page=100")["jobs"]
          assert any(j["name"] == "Build and validate release SDKs" and j["conclusion"] == "success" for j in jobs)
          sha = run["head_sha"]
          assert re.fullmatch(r"[0-9a-f]{40}", sha)
          comparison = api(f"compare/{sha}...main")
          assert comparison["status"] in ("ahead", "identical"), "source is not accepted main history"
          # Only publication-workflow repairs may differ from the frozen SDK.
          assert comparison["total_commits"] <= 100 and len(comparison["files"]) < 300
          assert all(f["filename"].startswith(".github/workflows/") for f in comparison["files"]), "SDK source changed; rebuild required"
          version = base64.b64decode(api(f"contents/VERSION?ref={sha}")["content"]).decode().strip()
          current = base64.b64decode(api("contents/VERSION?ref=main")["content"]).decode().strip()
          assert tag == "v" + version and current == version
          artifacts = api(f"actions/runs/{run_id}/artifacts?per_page=100")["artifacts"]
          matches = [a for a in artifacts if not a["expired"] and re.fullmatch(re.escape("xu-release-bundle-" + tag) + r"-\d+", a["name"])]
          assert matches, "verified release bundle is missing"
          artifact = max(matches, key=lambda a: a["id"])
          assert artifact["workflow_run"]["id"] == int(run_id) and artifact["workflow_run"]["head_sha"] == sha
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"artifact_id={artifact['id']}\nsource_sha={sha}\ntag={tag}\nversion={version}\n")
          PYTHON
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: verified
      - name: Verify frozen receipt and every asset without executing the SDK
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.source_sha }}
          EXPECTED_TAG: ${{ steps.source.outputs.tag }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path("verified/release")
          receipt = json.loads(pathlib.Path("verified/validation.json").read_text())
          assert receipt["source_commit"] == os.environ["EXPECTED_SHA"]
          assert receipt["tag"] == os.environ["EXPECTED_TAG"] == "v" + receipt["version"]
          assert len(receipt["assets"]) == 30 and {p.name for p in root.iterdir()} == set(receipt["assets"])
          for name, expected in receipt["assets"].items():
              assert re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*", name)
              path = root / name
              assert path.is_file() and not path.is_symlink()
              with path.open("rb") as source:
                  assert hashlib.file_digest(source, "sha256").hexdigest() == expected["sha256"], name
              assert path.stat().st_size == expected["size"], name
          print("Frozen CI bundle: source, successful build, complete receipt and all 30 hashes PASS")
          PYTHON

  build-release:
    name: Build and validate release SDKs
    needs: [release-policy, runtime-validation]
    if: needs.release-policy.outputs.published == 'false' && inputs.artifact_run_id == ''
    runs-on: macos-15-intel
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version and tag
        id: identity
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          EXPECTED_TAG="v$(cat VERSION)"
          TAG="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != tag && -z "$REQUESTED_TAG" ]]; then
            TAG="$EXPECTED_TAG"
          fi
          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $TAG does not match VERSION ($EXPECTED_TAG)" >&2
            exit 1
          fi
          python3 scripts/module_versions.py --check-release
          # A manual release must use accepted main; tags must point into main.
          if [[ "${{ inputs.build_only }}" != true ]]; then
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Checkout companion examples
        uses: actions/checkout@v4
        with:
          repository: xulang-org/examples
          ref: 9bb00a880e262b37bd7624d8789264900e9cdf59
          path: .ci/examples
          persist-credentials: false

      - name: Checkout companion packages
        uses: actions/checkout@v4
        with:
          repository: xulang-org/packages
          ref: c16af7ca38dc31c289ca83670edf153f1f85f5f2
          path: .ci/packages
          persist-credentials: false

      - name: Checkout companion vscode
        uses: actions/checkout@v4
        with:
          repository: xulang-org/vscode
          ref: 251e66b5d67030b6375a4bfad93945cb34e5eb9c
          path: .ci/vscode
          persist-credentials: false

      - name: Setup Node for the bundled editor extension
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build the bundled VS Code extension
        working-directory: .ci/vscode
        run: |
          npm ci
          npm run package

      - name: Set companion environment
        run: |
          echo "XU_EXAMPLES_ROOT=$GITHUB_WORKSPACE/.ci/examples" >> "$GITHUB_ENV"
          echo "XU_PACKAGES_ROOT=$GITHUB_WORKSPACE/.ci/packages" >> "$GITHUB_ENV"
          echo "XU_VSCODE_ROOT=$GITHUB_WORKSPACE/.ci/vscode" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native Windows draw packaging dependencies
        run: |
          brew install mingw-w64
          python3 -m pip install Pillow

      - name: Restore hosted seed cache
        id: seed-cache
        uses: actions/cache/restore@v4
        with:
          path: bin/xu
          key: hosted-seed-macos-x64-${{ hashFiles('VERSION') }}
          restore-keys: |
            hosted-seed-macos-x64-

      - name: Restore seed from a published product SDK
        if: steps.seed-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          XU_SDK_SEED_VERSION: ${{ vars.XU_SDK_SEED_VERSION || '0.10.12-rc.1' }}
        run: python3 scripts/restore_product_seed.py --target macos-x64 --destination bin/xu --replace-existing

      - name: Build hosted compiler chain
        run: |
          chmod +x bin/xu
          echo "XU_CI_LANE=product seed present: $(./bin/xu --version | head -n 2 | tail -n 1)" | tee -a "$GITHUB_STEP_SUMMARY"
          XU_SKIP_CROSS=1 ./scripts/build_hosted_chain.sh bin/xu bin/xu
          python3 scripts/check_release_identity.py --require-cli
          make tools

      - name: Verify source & boundary contract
        run: python3 scripts/check_bootstrap_xu_boundary.py --strict-freeze

      - name: Package all platform release SDKs
        run: |
          mkdir -p dist/release
          python3 scripts/pack_release_bundle.py --all --out-dir dist/release

      - name: Test installed host SDK and native setup installer
        run: |
          VERSION=$(cat VERSION)
          python3 scripts/test_installed_sdk.py --archive "dist/release/xu-v$VERSION-macos-x64.tar.gz" --native-setup
          python3 scripts/check_sdk_reinstall.py --archive "dist/release/xu-v$VERSION-macos-x64.tar.gz"
          if [ -f "dist/release/xu-setup-macos-x64" ]; then
            python3 scripts/test_installed_sdk.py --installer "dist/release/xu-setup-macos-x64"
          fi

      - name: Verify graphical macOS package fresh install and reinstall
        run: |
          PKG="dist/release/xu-v$(cat VERSION)-macos-x64.pkg"
          sudo installer -pkg "$PKG" -target /
          sudo touch /usr/local/xu/src/obsolete-install-probe.xu
          sudo chmod 555 /usr/local/xu/src
          sudo installer -pkg "$PKG" -target /
          test ! -e /usr/local/xu/src/obsolete-install-probe.xu
          python3 - <<'PYTHON'
          import hashlib, json, pathlib
          root = pathlib.Path("/usr/local/xu")
          metadata = json.loads((root / "bundle.json").read_text())
          for name, expected in metadata["files"].items():
              with (root / name).open("rb") as source:
                  assert hashlib.file_digest(source, "sha256").hexdigest() == expected, name
          print("macOS PKG fresh install and readonly reinstall: full inventory PASS")
          PYTHON

      - name: Generate structured release notes
        id: notes
        env:
          CUSTOM_NOTES: ${{ inputs.custom_notes }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          TAG="${{ steps.identity.outputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          NOTE_ARGS=()
          if [ -n "$PREVIOUS_TAG" ]; then
            NOTE_ARGS+=(--prev-tag "$PREVIOUS_TAG")
          fi

          if [ -n "$CUSTOM_NOTES" ]; then
            NOTES_FILE="$RUNNER_TEMP/xu-release-highlights.md"
            printf '%s\n' "$CUSTOM_NOTES" > "$NOTES_FILE"
            python3 scripts/generate_release_notes.py \
              --tag "$TAG" \
              "${NOTE_ARGS[@]}" \
              --manifest dist/release/RELEASE_MANIFEST.md \
              --custom-notes "$NOTES_FILE" \
              --output dist/release/RELEASE_NOTES.md
          else
            python3 scripts/generate_release_notes.py \
              --tag "$TAG" \
              "${NOTE_ARGS[@]}" \
              --manifest dist/release/RELEASE_MANIFEST.md \
              --output dist/release/RELEASE_NOTES.md
          fi

          echo "=== RELEASE NOTES PREVIEW ==="
          head -n 50 dist/release/RELEASE_NOTES.md
          cat dist/release/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify all archives and record publishable asset hashes
        run: python3 scripts/verify_release_bundle.py --root dist/release --receipt dist/validation.json

      - name: Upload verified release bundle
        id: bundle
        uses: actions/upload-artifact@v4
        with:
          name: xu-release-bundle-${{ steps.identity.outputs.tag }}-${{ github.run_attempt }}
          path: |
            dist/release/
            dist/validation.json
          if-no-files-found: error

  publish-release:
    name: Publish verified CI artifacts
    needs: [build-release, reuse-release]
    if: always() && inputs.build_only != true && (needs.build-release.result == 'success' || needs.reuse-release.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      # This job never checks out or executes the product or its dependencies.
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-release.outputs.artifact_id || needs.reuse-release.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: verified

      - name: Check artifact receipt and publish without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ needs.reuse-release.outputs.source_sha || github.sha }}
          EXPECTED_TAG: ${{ needs.build-release.outputs.tag || needs.reuse-release.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.build-release.outputs.version || needs.reuse-release.outputs.version }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease || 'auto' }}
          RELEASE_DRAFT: ${{ inputs.draft }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path("verified/release")
          receipt = json.loads(pathlib.Path("verified/validation.json").read_text())
          tag, version, sha = (os.environ[k] for k in ("EXPECTED_TAG", "EXPECTED_VERSION", "EXPECTED_SHA"))
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?", tag)
          assert receipt["tag"] == tag == "v" + version
          assert receipt["version"] == version and receipt["source_commit"] == sha
          assets = receipt["assets"]
          assert len(assets) == 30
          assert {p.name for p in root.iterdir()} == set(assets)
          for name, record in assets.items():
              assert re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*", name)
              path = root / name
              assert path.is_file() and not path.is_symlink()
              with path.open("rb") as source:
                  digest = hashlib.file_digest(source, "sha256").hexdigest()
              assert digest == record["sha256"] and path.stat().st_size == record["size"], name
          def gh(*args):
              return subprocess.check_output(["gh", *args], text=True)
          def api(path, method="GET", data=None):
              command = ["gh", "api", "--method", method, path]
              if data is not None:
                  command += ["--input", "-"]
              return json.loads(subprocess.check_output(command, input=json.dumps(data) if data is not None else None, text=True))
          repo = os.environ["GH_REPO"]
          # The by-tag endpoint only returns published releases. Resolve drafts
          # from the authenticated list and retain the ID returned by creation.
          release, page = None, 1
          while release is None:
              batch = api(f"repos/{repo}/releases?per_page=100&page={page}")
              release = next((r for r in batch if r["tag_name"] == tag), None)
              if len(batch) < 100:
                  break
              page += 1
          prerelease = os.environ["RELEASE_PRERELEASE"]
          is_prerelease = prerelease == "true" or (prerelease == "auto" and bool(re.search(r"-(dev|rc|alpha|beta)", tag)))
          if release is None:
              release = api(f"repos/{repo}/releases", "POST", {
                  "tag_name": tag, "target_commitish": sha, "name": "Xu " + tag,
                  "body": (root / "RELEASE_NOTES.md").read_text(), "draft": True,
                  "prerelease": is_prerelease})
          release_id = release["id"]
          assert release["target_commitish"] == sha, "existing release targets a different commit"
          published = {asset["name"]: asset for asset in release["assets"]}
          assert set(published) <= set(assets), "draft has unexpected assets"
          for name, asset in published.items():
              assert asset["size"] == assets[name]["size"]
              assert asset.get("digest") == "sha256:" + assets[name]["sha256"], name
          if not release["draft"]:
              assert set(published) == set(assets), "published release differs from the verified bundle"
              print(f"{tag} is already published; preserving its tag and assets")
              raise SystemExit(0)
          for name in sorted(set(assets) - set(published)):
              uploaded = json.loads(gh("api", "--method", "POST",
                  f"https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?name={name}",
                  "--header", "Content-Type: application/octet-stream", "--input", str(root / name)))
              assert uploaded["size"] == assets[name]["size"]
              assert uploaded["digest"] == "sha256:" + assets[name]["sha256"], name
          uploaded_release = api(f"repos/{repo}/releases/{release_id}")
          assert len(uploaded_release["assets"]) == 30
          assert all(a["digest"] == "sha256:" + assets[a["name"]]["sha256"] for a in uploaded_release["assets"])
          final = api(f"repos/{repo}/releases/{release_id}", "PATCH", {
              "body": (root / "RELEASE_NOTES.md").read_text(), "prerelease": is_prerelease,
              "draft": os.environ["RELEASE_DRAFT"] == "true"})
          assert len(final["assets"]) == 30
          print("Published verified CI bundle: " + final["html_url"])
          PYTHON
