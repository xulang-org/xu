name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.8.9). Default: v + VERSION"
        required: false
        type: string
      custom_notes:
        description: "Optional custom notes or announcement highlights (Markdown)"
        required: false
        type: string
      previous_tag:
        description: "Previous release tag for the changelog (e.g. v0.8.12)"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release (auto: true if tag contains -dev/-rc/-alpha/-beta)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - true
          - false
      draft:
        description: "Create as draft"
        required: false
        default: false
        type: boolean
      build_only:
        description: "Build and validate artifacts without creating a tag or GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  XU_CI_LANE: product
  XU_BOUNDARY_CI: "1"

jobs:
  release-policy:
    name: Check release publication state
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      published: ${{ steps.policy.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - name: Check requested tag and existing publication
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          EXPECTED_TAG="v$(cat VERSION)"
          TAG="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != tag && -z "$REQUESTED_TAG" ]]; then
            TAG="$EXPECTED_TAG"
          fi
          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $TAG does not match VERSION ($EXPECTED_TAG)" >&2
            exit 1
          fi
          ERROR_FILE="$RUNNER_TEMP/release-publication-error.txt"
          if PUBLISHED=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq '.draft == false and .published_at != null' 2>"$ERROR_FILE"); then
            case "$PUBLISHED" in
              true|false) ;;
              *) echo "Invalid release publication response" >&2; exit 1 ;;
            esac
          elif grep -q 'HTTP 404' "$ERROR_FILE"; then
            PUBLISHED=false
          else
            cat "$ERROR_FILE" >&2
            exit 1
          fi
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISHED" == true ]]; then
            echo "Release $TAG is already published; leaving its tag and assets intact."
          fi

  publish-release:
    name: Build release SDKs
    needs: release-policy
    if: needs.release-policy.outputs.published == 'false'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version and tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          EXPECTED_TAG="v$(cat VERSION)"
          TAG="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != tag && -z "$REQUESTED_TAG" ]]; then
            TAG="$EXPECTED_TAG"
          fi
          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $TAG does not match VERSION ($EXPECTED_TAG)" >&2
            exit 1
          fi
          python3 scripts/module_versions.py --check-release

      - name: Checkout companion examples
        uses: actions/checkout@v4
        with:
          repository: xulang-org/examples
          ref: 854c7c3d617c7e28af9e62b9d4e6bf53e23dfdba
          path: .ci/examples
          persist-credentials: false

      - name: Checkout companion packages
        uses: actions/checkout@v4
        with:
          repository: xulang-org/packages
          ref: 96693e6cce8d51eba45e4f68dc12ce06f7a2336b
          path: .ci/packages
          persist-credentials: false

      - name: Checkout companion vscode
        uses: actions/checkout@v4
        with:
          repository: xulang-org/vscode
          ref: 251e66b5d67030b6375a4bfad93945cb34e5eb9c
          path: .ci/vscode
          persist-credentials: false

      - name: Setup Node for the bundled editor extension
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build the bundled VS Code extension
        working-directory: .ci/vscode
        run: |
          npm ci
          npm run package

      - name: Set companion environment
        run: |
          echo "XU_EXAMPLES_ROOT=$GITHUB_WORKSPACE/.ci/examples" >> "$GITHUB_ENV"
          echo "XU_PACKAGES_ROOT=$GITHUB_WORKSPACE/.ci/packages" >> "$GITHUB_ENV"
          echo "XU_VSCODE_ROOT=$GITHUB_WORKSPACE/.ci/vscode" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native Windows draw packaging dependencies
        run: |
          brew install mingw-w64
          python3 -m pip install Pillow

      - name: Restore hosted seed cache
        id: seed-cache
        uses: actions/cache/restore@v4
        with:
          path: bin/xu
          key: hosted-seed-macos-arm64-${{ hashFiles('VERSION') }}
          restore-keys: |
            hosted-seed-macos-arm64-

      - name: Restore seed from a published product SDK
        if: steps.seed-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          XU_SDK_SEED_VERSION: ${{ vars.XU_SDK_SEED_VERSION }}
        run: python3 scripts/restore_product_seed.py --target macos-arm64 --destination bin/xu --replace-existing

      - name: Build hosted compiler chain
        run: |
          chmod +x bin/xu
          echo "XU_CI_LANE=product seed present: $(./bin/xu --version | head -n 2 | tail -n 1)" | tee -a "$GITHUB_STEP_SUMMARY"
          XU_SKIP_CROSS=1 ./scripts/build_hosted_chain.sh bin/xu bin/xu
          python3 scripts/check_release_identity.py --require-cli
          make tools

      - name: Verify source & boundary contract
        run: python3 scripts/check_bootstrap_xu_boundary.py --strict-freeze

      - name: Package all platform release SDKs
        run: |
          mkdir -p dist/release
          python3 scripts/pack_release_bundle.py --all --out-dir dist/release

      - name: Test installed host SDK and native setup installer
        run: |
          VERSION=$(cat VERSION)
          python3 scripts/test_installed_sdk.py --archive "dist/release/xu-v$VERSION-macos-arm64.tar.gz" --native-setup
          if [ -f "dist/release/xu-setup-macos-arm64" ]; then
            python3 scripts/test_installed_sdk.py --installer "dist/release/xu-setup-macos-arm64"
          fi

      - name: Generate structured release notes
        id: notes
        env:
          CUSTOM_NOTES: ${{ inputs.custom_notes }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ "$TAG" != v* ]]; then
            TAG="v$(cat VERSION)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          NOTE_ARGS=()
          if [ -n "$PREVIOUS_TAG" ]; then
            NOTE_ARGS+=(--prev-tag "$PREVIOUS_TAG")
          fi

          if [ -n "$CUSTOM_NOTES" ]; then
            NOTES_FILE="$RUNNER_TEMP/xu-release-highlights.md"
            printf '%s\n' "$CUSTOM_NOTES" > "$NOTES_FILE"
            python3 scripts/generate_release_notes.py \
              --tag "$TAG" \
              "${NOTE_ARGS[@]}" \
              --manifest dist/release/RELEASE_MANIFEST.md \
              --custom-notes "$NOTES_FILE" \
              --output dist/release/RELEASE_NOTES.md
          else
            python3 scripts/generate_release_notes.py \
              --tag "$TAG" \
              "${NOTE_ARGS[@]}" \
              --manifest dist/release/RELEASE_MANIFEST.md \
              --output dist/release/RELEASE_NOTES.md
          fi

          echo "=== RELEASE NOTES PREVIEW ==="
          head -n 50 dist/release/RELEASE_NOTES.md
          cat dist/release/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Determine release flags
        id: flags
        run: |
          TAG="${{ steps.notes.outputs.tag }}"
          FLAGS=()
          PRERELEASE="${{ inputs.prerelease || 'auto' }}"
          if [ "$PRERELEASE" = "true" ] || ([ "$PRERELEASE" = "auto" ] && [[ "$TAG" =~ -(dev|rc|alpha|beta) ]]); then
            FLAGS+=(--prerelease)
          fi
          if [ "${{ inputs.draft }}" = "true" ]; then
            FLAGS+=(--draft)
          fi
          echo "flags=${FLAGS[*]}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: inputs.build_only != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.notes.outputs.tag }}"
          FLAGS=(${{ steps.flags.outputs.flags }})

          echo "Publishing Release: $TAG (flags: ${FLAGS[*]})"

          if IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$IS_DRAFT" != true ]]; then
              echo "Release $TAG was published while building; leaving its tag and assets intact."
              exit 0
            fi
            echo "Release $TAG is a draft, updating its unpublished assets..."
            gh release upload "$TAG" dist/release/* --clobber
            gh release edit "$TAG" --notes-file dist/release/RELEASE_NOTES.md "${FLAGS[@]}"
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" dist/release/* \
              --target "${{ github.sha }}" \
              --title "Xu $TAG" \
              --notes-file dist/release/RELEASE_NOTES.md \
              "${FLAGS[@]}"
          fi

          echo "Release successfully published: $(gh release view "$TAG" --json url -q .url)"

      - name: Upload validated release bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xu-release-bundle-${{ steps.notes.outputs.tag }}
          path: dist/release/
          if-no-files-found: warn
