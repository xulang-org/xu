name: 缺陷报告 / Bug report
description: 报告可复现的错误，附实际版本、环境与复现步骤。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue，并阅读本仓库 CONTRIBUTING.md。
        只提供脱敏内容；敏感漏洞请使用仓库已公布的私密渠道，未公布时先联系维护者确认报告方式。
  - type: input
    id: version
    attributes:
      label: 实际版本或完整提交
      description: 提供实际工具版本、所选 Xu SDK 或完整源码 SHA，不只填写 latest 或 main。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、架构及相关浏览器、编辑器、服务或工具链版本。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现
      description: 给出执行目录、前置条件、最小源码或输入及逐步运行命令。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 错误信息、退出状态、影响范围；性能问题补充比较基线和采样方式。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充证据或临时解决方法
      description: 可选；仅提供已脱敏的相关日志、截图或公开复现链接。
