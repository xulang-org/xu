name: 功能或文档建议 / Proposal
description: 提议功能、文档、兼容性或维护改进，并明确验收目标。
title: "[Proposal] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有讨论，并阅读本仓库 CONTRIBUTING.md。
        用具体使用场景说明问题；简单修复也可以直接提交 PR。
  - type: dropdown
    id: category
    attributes:
      label: 建议类型
      options:
        - 功能或接口
        - 文档或示例
        - 重构或维护
        - 性能或开发体验
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用者、具体场景、当前限制和预期收益。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 建议方案与范围
      description: 哪些行为需要改变，哪些工作不属于本次建议；可附替代方案。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 如何用明确的操作、示例或结果判断问题已解决。
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与跨仓库影响
      description: 可选；受影响的 API、SDK、平台、迁移方式及依赖仓库。
