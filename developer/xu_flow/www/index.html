<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="xu://app/brand/xu_classic.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<title>Xu Flow</title>
</head>
<body>
<header>
  <img src="xu://app/brand/xu_classic.svg" alt="Xu" width="36" height="36">
  <div class="titles">
    <h1>Xu Flow</h1>
    <p id="root">loading…</p>
  </div>
  <div class="actions">
    <button type="button" id="btn_sim">simulate</button>
    <button type="button" class="secondary" id="btn_open">全开</button>
    <button type="button" class="secondary" id="btn_close">全收</button>
    <button type="button" class="secondary" id="btn_fit">fit</button>
  </div>
</header>
<aside id="side">
  <div id="tree"></div>
  <div id="binds"></div>
</aside>
<main>
  <svg id="cv" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
      </marker>
      <marker id="arr-lit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#4ade80"/>
      </marker>
      <marker id="arr-call" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
      </marker>
      <marker id="arr-call-lit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#c4b5fd"/>
      </marker>
    </defs>
    <g id="world"></g>
  </svg>
</main>
<div id="hint">左侧函数树挂节点与注释 · 点树或图互相对应 · 拖拽平移</div>
<div id="dlg" hidden>
  <div class="card">
    <label id="dlg_lab" for="dlg_in"></label>
    <input id="dlg_in" autocomplete="off">
    <div class="row">
      <button type="button" id="dlg_ok">确定</button>
      <button type="button" class="secondary" id="dlg_cancel">取消</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
