<!doctype html>
<html lang="zh-CN">
<head>

  <link rel="icon" href="/xu_classic.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>

    <main class="main">
      <div class="top">
        <h2 id="title">收件箱</h2>
        <div id="actions"></div>
      </div>
      <div id="flash" hidden></div>
      <div id="view"></div>
    </main>

  <script src="/app.js"></script>

</html>
