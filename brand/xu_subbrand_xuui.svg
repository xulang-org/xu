<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <!-- XuUI 官方图形与桌面子品牌 Logo (黑红双色标准版 Black & Red Dual-Color) -->
  <defs>
    <linearGradient id="uiRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="uiShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(20, 0) scale(0.34)" filter="url(#uiShadow)">
    <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#uiRedGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#uiRedGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#uiRedGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 右下角视窗画板符号 -->
    <rect x="340" y="340" width="84" height="64" rx="10" fill="#0284C7"/>
    <circle cx="355" cy="355" r="4" fill="#FFFFFF"/>
    <circle cx="370" cy="355" r="4" fill="#FFFFFF"/>
  </g>

  <!-- 右侧黑红双色排印 (Xu: 碳黑 / UI: 海蓝/朱砂红) -->
  <g transform="translate(200, 0)">
    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="58" fill="#111827" letter-spacing="-1">
      Xu<tspan fill="#0284C7">UI</tspan>
    </text>
    <text x="2" y="128" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="13" fill="#4B5563" letter-spacing="3">
      NATIVE DESKTOP &amp; DRAW
    </text>
  </g>
</svg>
