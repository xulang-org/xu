<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <!-- XUFLOW 官方代码审查与质量评审系统 (Light Edition · 浅色背景专用版) -->
  <defs>
    <linearGradient id="flowRedLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="flowShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#BE123C" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 左侧纯粹甲骨文图腾 -->
  <g transform="translate(20, 0) scale(0.34)" filter="url(#flowShadowLight)">
    <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#flowRedLight)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#flowRedLight)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#flowRedLight)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 右侧黑红双色字标 (XU: 碳黑 / FLOW: 朱砂红) -->
  <g transform="translate(200, 0)">
    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="58" fill="#111827" letter-spacing="-1">
      XU<tspan fill="url(#flowRedLight)">FLOW</tspan>
    </text>
    <text x="2" y="128" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="13" fill="#4B5563" letter-spacing="3">
      CODE REVIEW &amp; AUDIT
    </text>
  </g>
</svg>
