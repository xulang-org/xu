<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- “XU” 甲骨文图腾 旗舰级 APP ICON (512x512 iOS/macOS/Android 标准规格) -->
  <defs>
    <!-- 深邃黑曜石/钛金属底座渐变 -->
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="40%" stop-color="#0f0e13" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- 赛博朱砂·日落金霓虹光效渐变 -->
    <linearGradient id="appGlyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 霓虹微光呼吸滤镜 -->
    <filter id="appGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 内部投影质感 -->
    <filter id="appDepthShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#E11D48" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 1. Apple 标准 Squircle 超椭圆圆角底座 (512x512, r=108) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#appBgGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>

  <!-- 2. 底座中心氛围光晕 -->
  <circle cx="256" cy="256" r="140" fill="#E11D48" opacity="0.12" filter="blur(42px)"/>

  <!-- 3. 核心甲骨文 XU 图腾（U 在外扁平器皿，内部 >< 悬空居中上移） -->
  <g filter="url(#appGlow)">
    <!-- 外部扁平 U 框 -->
    <path d="M 120 145
             L 105 290
             L 256 365
             L 407 290
             L 392 145"
          fill="none"
          stroke="url(#appGlyphGrad)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- 内部左折笔（> 符号，上移留白） -->
    <path d="M 175 160
             L 236 220
             L 175 280"
          fill="none"
          stroke="url(#appGlyphGrad)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- 内部右折笔（< 符号，留出 40px 通透间距） -->
    <path d="M 337 160
             L 276 220
             L 337 280"
          fill="none"
          stroke="url(#appGlyphGrad)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- 4. 拟物化玻璃折射微高光 (左上斜角轻透弧面) -->
  <path d="M 16 124 C 16 65 65 16 124 16 L 256 16 C 124 16 16 124 16 256 Z" fill="#FFFFFF" opacity="0.04"/>
</svg>
