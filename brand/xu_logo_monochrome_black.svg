<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Xu 标志：纯黑单色标准规范 (Monochrome Solid Black) -->
  <rect width="100%" height="100%" fill="transparent" />
  <g>
    <!-- 1. 外部扁平 U 字形甲骨器皿外框 -->
    <path d="M 105 140
             L 90 295
             L 250 370
             L 410 295
             L 395 140"
          fill="none"
          stroke="#000000"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- 2. 内部左折笔（> 符号，交折于 y=218） -->
    <path d="M 165 155
             L 230 218
             L 165 280"
          fill="none"
          stroke="#000000"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- 3. 内部右折笔（< 符号，留出 40px 黄金气隙） -->
    <path d="M 335 155
             L 270 218
             L 335 280"
          fill="none"
          stroke="#000000"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
