<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <!-- Xu 技术大会参会胸牌与挂绳矢量设计图 (Conference Badge & Lanyard) -->
  <defs>
    <linearGradient id="badgePaperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141218" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="lanyardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BE123C"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="#0A090D"/>

  <!-- 1. 顶部挂绳 -->
  <g transform="translate(240, 0)">
    <rect x="0" y="0" width="120" height="180" fill="url(#lanyardGrad)"/>
    <text x="60" y="90" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="16" fill="#FFF" transform="rotate(90 60 90)">XU CONF 2026</text>
    <!-- 金属挂钩扣 -->
    <rect x="40" y="160" width="40" height="30" rx="6" fill="#64748B"/>
    <circle cx="60" cy="180" r="8" fill="#050508"/>
  </g>

  <!-- 2. 胸牌卡体 (100x140mm 比例) -->
  <g transform="translate(100, 190)">
    <!-- 卡身 -->
    <rect x="0" y="0" width="400" height="580" rx="28" fill="url(#badgePaperGrad)" stroke="rgba(225, 29, 72, 0.35)" stroke-width="2"/>
    <!-- 顶部打孔 -->
    <rect x="160" y="14" width="80" height="12" rx="6" fill="#0A090D"/>

    <!-- 标志与大会名称 -->
    <g transform="translate(135, 60) scale(0.26)">
      <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="#E11D48" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="#E11D48" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="#E11D48" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="200" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="28" fill="#FFF">XU SYSTEMS CONF</text>
    <text x="200" y="225" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8" letter-spacing="3">ANNUAL DEVELOPER SUMMIT</text>

    <line x1="40" y1="260" x2="360" y2="260" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- 参会者姓名与身份 -->
    <text x="200" y="330" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="36" fill="#FFF">ALICE CHEN</text>
    <text x="200" y="370" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#E2E8F0">CORE COMPILER ENGINEER</text>

    <!-- 身份胶囊 -->
    <rect x="130" y="400" width="140" height="38" rx="19" fill="#E11D48"/>
    <text x="200" y="425" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="14" fill="#FFF" letter-spacing="2">SPEAKER</text>

    <!-- 底部条形码 -->
    <g transform="translate(100, 480)">
      <rect x="0" y="0" width="200" height="40" fill="#FFF" rx="4"/>
      <line x1="20" y1="8" x2="20" y2="32" stroke="#000" stroke-width="3"/>
      <line x1="30" y1="8" x2="30" y2="32" stroke="#000" stroke-width="5"/>
      <line x1="45" y1="8" x2="45" y2="32" stroke="#000" stroke-width="2"/>
      <line x1="55" y1="8" x2="55" y2="32" stroke="#000" stroke-width="4"/>
      <line x1="70" y1="8" x2="70" y2="32" stroke="#000" stroke-width="6"/>
      <line x1="90" y1="8" x2="90" y2="32" stroke="#000" stroke-width="2"/>
      <line x1="110" y1="8" x2="110" y2="32" stroke="#000" stroke-width="5"/>
      <line x1="130" y1="8" x2="130" y2="32" stroke="#000" stroke-width="3"/>
      <line x1="150" y1="8" x2="150" y2="32" stroke="#000" stroke-width="4"/>
      <line x1="170" y1="8" x2="170" y2="32" stroke="#000" stroke-width="2"/>
      <text x="100" y="60" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">XU-2026-SPK-0842</text>
    </g>
  </g>
</svg>
