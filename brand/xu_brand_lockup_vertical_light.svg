<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <!-- Xu 品牌纵向标准组合 (白色/浅色背景专用版 Light Edition) -->
  <defs>
    <linearGradient id="lockupRedLightV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="60%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <filter id="lockupShadowLightV" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#BE123C" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- 顶部甲骨文图腾 -->
  <g transform="translate(100, 20) scale(0.4)" filter="url(#lockupShadowLightV)">
    <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140"
          fill="none" stroke="url(#lockupRedLightV)" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 165 155 L 230 218 L 165 280"
          fill="none" stroke="url(#lockupRedLightV)" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 335 155 L 270 218 L 335 280"
          fill="none" stroke="url(#lockupRedLightV)" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 分割线 -->
  <line x1="120" y1="215" x2="280" y2="215" stroke="rgba(0, 0, 0, 0.12)" stroke-width="2" stroke-linecap="round"/>

  <!-- 下方字标 (X: 碳黑 / u: 朱砂红) -->
  <g transform="translate(200, 310)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="92" fill="#111827" letter-spacing="-2">
      X<tspan fill="url(#lockupRedLightV)">u</tspan>
    </text>
    <text x="0" y="44" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="13" fill="#4B5563" letter-spacing="3">
      SYSTEMS LANGUAGE
    </text>
  </g>
</svg>
