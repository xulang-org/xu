      justify-content: center;
      vertical-align: 0;
      letter-spacing: normal;
      text-rendering: auto;
    }

    .xi-spin {
      animation: xi-spin-kf 1s infinite linear;
    }
    @keyframes xi-spin-kf {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    :root {
      --xu-brand: #E64A19;
      --xu-brand-glow: rgba(230, 74, 25, 0.15);
      --xu-bg: #0A0A0F;
      --xu-surface: #14141E;
      --xu-surface-hover: #1E1E2C;
      --xu-border: #262638;
      --xu-border-highlight: #3D3D56;
      --xu-text: #F8FAFC;
      --xu-text-sec: #94A3B8;
      --xu-radius: 12px;
      --xu-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    [data-theme="light"] {
      --xu-brand: #BE123C;
      --xu-brand-glow: rgba(190, 18, 60, 0.08);
      --xu-bg: #F8F9FA;
      --xu-surface: #FFFFFF;
      --xu-surface-hover: #F1F3F5;
      --xu-border: #E2E8F0;
      --xu-border-highlight: #CBD5E1;
      --xu-text: #0F172A;
      --xu-text-sec: #64748B;
      --xu-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--xu-bg);
      color: var(--xu-text);
      padding: 0 0 60px 0;
      transition: background 0.2s, color 0.2s;
      min-height: 100vh;
    }

    /* Top Nav Bar */
    .top-nav {
      background: var(--xu-surface);
      border-bottom: 1px solid var(--xu-border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      background: var(--xu-bg);
      border: 1px solid var(--xu-border);
      color: var(--xu-text-sec);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s;
    }
    .back-btn:hover {
      color: var(--xu-text);
      border-color: var(--xu-brand);
    }
    .brand-title {
      font-size: 18px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-title span.badge {
      font-size: 11px;
      background: var(--xu-brand-glow);
      color: var(--xu-brand);
      border: 1px solid var(--xu-brand);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 800;
    }

    /* Hero Banner */
    .hero {
      max-width: 1400px;
      margin: 32px auto 24px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
    }
    .hero-text h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .hero-text p {
      color: var(--xu-text-sec);
      font-size: 15px;
      margin-top: 6px;
    }

    /* Action Controls Toolbar */
    .toolbar {
      max-width: 1400px;
      margin: 0 auto 24px;
      padding: 0 24px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 280px;
      max-width: 480px;
    }
    .search-wrap input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 1px solid var(--xu-border);
      border-radius: var(--xu-radius);
      background: var(--xu-surface);
      color: var(--xu-text);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .search-wrap input:focus {
      border-color: var(--xu-brand);
      box-shadow: 0 0 0 3px var(--xu-brand-glow);
    }
    .search-wrap i.search-ico {
      position: absolute;
      left: 14px;
      top: 13px;
      color: var(--xu-text-sec);
      font-size: 16px;
    }
    .tools-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .slider-ctrl {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--xu-surface);
      border: 1px solid var(--xu-border);
      padding: 6px 14px;
      border-radius: var(--xu-radius);
      font-size: 12px;
      color: var(--xu-text-sec);
      font-weight: 700;
    }
    .slider-ctrl input[type="range"] {
      width: 100px;
      cursor: pointer;
      accent-color: var(--xu-brand);
    }
    .color-picker-group {
      display: flex;
      gap: 6px;
      background: var(--xu-surface);
      border: 1px solid var(--xu-border);
      padding: 6px 10px;
      border-radius: var(--xu-radius);
    }
    .color-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s, border-color 0.2s;
    }
    .color-dot:hover, .color-dot.active {
      transform: scale(1.15);
      border-color: var(--xu-text);
    }
    .theme-btn {
      padding: 10px 16px;
      border-radius: var(--xu-radius);
      border: 1px solid var(--xu-border);
      background: var(--xu-surface);
      color: var(--xu-text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Categories Tabs */
    .cats-container {
      max-width: 1400px;
      margin: 0 auto 24px;
      padding: 0 24px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .cat-pill {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--xu-border);
      background: var(--xu-surface);
      color: var(--xu-text-sec);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-pill.active, .cat-pill:hover {
      background: var(--xu-brand);
      color: #FFF;
      border-color: var(--xu-brand);
      box-shadow: 0 2px 10px var(--xu-brand-glow);
    }

    /* Icons Grid */
    .icons-grid {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }
    .icon-card {
      background: var(--xu-surface);
      border: 1px solid var(--xu-border);
      border-radius: var(--xu-radius);
      padding: 24px 16px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      user-select: none;
    }
    .icon-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--xu-shadow);
      border-color: var(--xu-brand);
      background: var(--xu-surface-hover);
    }
    .icon-box {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      line-height: 0;
      text-align: center;
    }
    .icon-box i.xi {
      font-size: var(--icon-scale, 38px);
      transition: transform 0.2s;
    }
    .icon-card:hover .icon-box i.xi {
      transform: scale(1.18);
    }
    .card-name {
      font-size: 13px;
      font-weight: 800;
      color: var(--xu-text);
      text-align: center;
      word-break: break-all;
    }
    .card-label {
      font-size: 11px;
      color: var(--xu-text-sec);
      margin-top: 4px;
      text-align: center;
      line-height: 1.3;
    }
    .card-code {
      font-size: 11px;
      color: var(--xu-brand);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      margin-top: 6px;
      font-weight: 700;
    }
    .card-tip {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 10px;
      color: var(--xu-text-sec);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .icon-card:hover .card-tip {
      opacity: 1;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #181824;
      border: 1px solid var(--xu-brand);
      color: #FFF;
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

    // Setup categories dynamically
    const catCounts = {};
    ICONS_DATA.forEach(i => {
      catCounts[i.category] = (catCounts[i.category] || 0) + 1;
    });

    const catsPills = document.getElementById('cats-pills');
    Object.keys(catCounts).forEach(cat => {
      const pill = document.createElement('button');
      pill.className = 'cat-pill';
      pill.innerText = `${cat} (${catCounts[cat]})`;
      pill.onclick = () => filterCat(cat);
      catsPills.appendChild(pill);
    });

    let selectedCat = 'all';
    let searchQuery = '';
    let currentColor = 'default';

    function renderGrid() {
      const grid = document.getElementById('icons-grid');
      grid.innerHTML = '';

      const filtered = ICONS_DATA.filter(ic => {
        const catMatch = selectedCat === 'all' || ic.category === selectedCat;
        const q = searchQuery.toLowerCase().trim();
        const qMatch = !q ||
          ic.name.toLowerCase().includes(q) ||
          ic.label.toLowerCase().includes(q) ||
          ic.category.toLowerCase().includes(q) ||
          ic.code.toString(16).includes(q);
        return catMatch && qMatch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--xu-text-sec);">
            <i class="xi xi-search" style="font-size:48px; opacity:0.3; margin-bottom:12px;"></i>
            <p style="font-size:16px; font-weight:700;">未找到匹配 "${searchQuery}" 的图标</p>
          </div>
        `;
        return;
      }

      filtered.forEach(ic => {
        const card = document.createElement('div');
        card.className = 'icon-card';
        const colorStyle = currentColor !== 'default' ? `style="color:${currentColor}"` : '';
        card.innerHTML = `
          <span class="card-tip">点击复制</span>
          <div class="icon-box">
            <i class="xi xi-${ic.name}" ${colorStyle}></i>
          </div>
          <div class="card-name">${ic.name}</div>
          <div class="card-label">${ic.label}</div>
          <div class="card-code">0x${ic.code.toString(16).toUpperCase()}</div>
        `;
        card.onclick = () => copyCode(ic.name);
        grid.appendChild(card);
      });
    }

    function filterCat(cat) {
      selectedCat = cat;
      document.querySelectorAll('.cat-pill').forEach(p => {
        p.classList.toggle('active', p.innerText.startsWith(cat === 'all' ? '全部分类' : cat));
      });
      renderGrid();
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderGrid();
    });

    const sizeRange = document.getElementById('size-range');
    const sizeVal = document.getElementById('size-val');
    sizeRange.addEventListener('input', (e) => {
      const s = e.target.value + 'px';
      sizeVal.innerText = s;
      document.documentElement.style.setProperty('--icon-scale', s);
    });

    function setColor(color, dotElem) {
      currentColor = color;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      dotElem.classList.add('active');
      renderGrid();
    }

    function copyCode(name) {
      const snippet = `<i class="xi xi-${name}"></i>`;
      navigator.clipboard.writeText(snippet).then(() => {
        const toast = document.getElementById('toast-msg');
        document.getElementById('toast-text').innerText = `已复制: ${snippet}`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      });
    }

    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
    }

    renderGrid();
  </script>
