<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <!-- Xu 社交媒体分享卡片 (OpenGraph Card 1280x640) -->
  <defs>
    <!-- 背景渐变 -->
    <radialGradient id="ogBgGlow" cx="75%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#3B0716" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#150810" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>

    <!-- 图腾发光渐变 -->
    <linearGradient id="ogRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="40%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="ogBigGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 赛博能量网格模式 -->
    <pattern id="ogGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(225, 29, 72, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 1. 暗黑底座与网格 -->
  <rect width="1280" height="640" fill="url(#ogBgGlow)"/>
  <rect width="1280" height="640" fill="url(#ogGrid)"/>

  <!-- 2. 左侧品牌标识与文案 -->
  <g transform="translate(100, 150)">
    <!-- 顶部状态标签 -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="rgba(225, 29, 72, 0.12)" stroke="rgba(225, 29, 72, 0.35)" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#10B981"/>
    <text x="32" y="21" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="700" fill="#E2E8F0" letter-spacing="1">NEXT-GEN SYSTEMS LANG</text>

    <!-- 主标题字标 -->
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="84" fill="#FFFFFF" letter-spacing="-2">The <tspan fill="url(#ogRedGrad)">XU</tspan> Language</text>

    <!-- 副标题 -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="400" font-size="24" fill="#94A3B8" letter-spacing="0.5">
      Rock-solid Ownership · Zero GC · Supersonic Compilation
    </text>

    <!-- 特性徽章矩阵 -->
    <g transform="translate(0, 220)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#141218" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="20" y="26" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="600" font-size="14" fill="#F8FAFC">⚡ Fast AOT</text>

      <!-- Badge 2 -->
      <rect x="175" y="0" width="160" height="42" rx="8" fill="#141218" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="195" y="26" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="600" font-size="14" fill="#F8FAFC">🛡️ No-GC Safe</text>

      <!-- Badge 3 -->
      <rect x="350" y="0" width="160" height="42" rx="8" fill="#141218" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="370" y="26" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="600" font-size="14" fill="#F8FAFC">🌿 Clean Syntax</text>
    </g>
  </g>

  <!-- 3. 右侧巨幅立体发光甲骨文图腾 -->
  <g transform="translate(780, 80) scale(0.95)" filter="url(#ogBigGlow)">
    <!-- 外部扁平 U 框 -->
    <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140"
          fill="none" stroke="url(#ogRedGrad)" stroke-width="26"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 内部左折笔 -->
    <path d="M 165 155 L 230 218 L 165 280"
          fill="none" stroke="url(#ogRedGrad)" stroke-width="26"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 内部右折笔 -->
    <path d="M 335 155 L 270 218 L 335 280"
          fill="none" stroke="url(#ogRedGrad)" stroke-width="26"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 底部微光边线 -->
  <line x1="0" y1="638" x2="1280" y2="638" stroke="url(#ogRedGrad)" stroke-width="3"/>
</svg>
