<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Xu 超级符号：赛博能量脉冲网格 (Cyber Oracle Pulse Grid) -->
  <defs>
    <radialGradient id="gridRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#BE123C" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <pattern id="patternGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(225, 29, 72, 0.12)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1.5" fill="rgba(245, 158, 11, 0.4)"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#patternGrid)"/>
  <circle cx="400" cy="400" r="380" fill="url(#gridRadial)"/>
</svg>
