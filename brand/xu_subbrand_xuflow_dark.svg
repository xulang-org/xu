<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <!-- XuFlow 官方 IDE 子品牌 Logo (黑色/深色背景专用版 Dark Edition) -->
  <defs>
    <linearGradient id="flowRedDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="flowGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#FF385C" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 左侧纯粹甲骨文图腾 (发光微光) -->
  <g transform="translate(20, 0) scale(0.34)" filter="url(#flowGlowDark)">
    <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#flowRedDark)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#flowRedDark)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#flowRedDark)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 右侧暗夜反色字标 (Xu: 钛白 / Flow: 霓虹朱砂红) -->
  <g transform="translate(200, 0)">
    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="58" fill="#F8FAFC" letter-spacing="-1">
      Xu<tspan fill="url(#flowRedDark)">Flow</tspan>
    </text>
    <text x="2" y="128" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="600" font-size="13" fill="#94A3B8" letter-spacing="3">
      NEXT-GEN DEVSTUDIO
    </text>
  </g>
</svg>
