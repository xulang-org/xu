<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <!-- Xu 官方演讲幻灯片封面模板 (Keynote / PPT Title Slide 1920x1080) -->
  <defs>
    <radialGradient id="pptGlow" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4C0519" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#1A0710" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <linearGradient id="pptRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <pattern id="pptGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(225, 29, 72, 0.06)" stroke-width="1"/>
    </pattern>
    <filter id="pptBigGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur2"/>
      <feGaussianBlur stdDeviation="10" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#pptGlow)"/>
  <rect width="1920" height="1080" fill="url(#pptGrid)"/>

  <!-- 左侧文案与标题 -->
  <g transform="translate(160, 320)">
    <!-- 顶部状态胶囊 -->
    <rect x="0" y="0" width="280" height="42" rx="21" fill="rgba(225, 29, 72, 0.15)" stroke="rgba(225, 29, 72, 0.4)" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="5" fill="#10B981"/>
    <text x="44" y="27" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="700" fill="#F8FAFC" letter-spacing="2">KEYNOTE PRESENTATION</text>

    <!-- 演讲主标题 -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="108" fill="#FFFFFF" letter-spacing="-3">
      The <tspan fill="url(#pptRed)">XU</tspan> Architecture
    </text>

    <!-- 演讲副标题 -->
    <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="400" font-size="32" fill="#94A3B8" letter-spacing="1">
      Rock-solid Ownership · Zero GC · Supersonic Compilation
    </text>

    <!-- 演讲者与日期信息 -->
    <g transform="translate(0, 340)">
      <text x="0" y="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" fill="#E2E8F0" font-weight="600">SPEAKER: Xu Core Development Team</text>
      <text x="0" y="32" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#64748B">ANNUAL SYSTEMS PROGRAMMING SUMMIT · 2026</text>
    </g>
  </g>

  <!-- 右侧巨幅发光甲骨文图腾 -->
  <g transform="translate(1200, 180) scale(1.4)" filter="url(#pptBigGlow)">
    <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#pptRed)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#pptRed)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#pptRed)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 底部微光边框 -->
  <line x1="0" y1="1076" x2="1920" y2="1076" stroke="url(#pptRed)" stroke-width="4"/>
</svg>
