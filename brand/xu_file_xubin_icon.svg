  <path d="M 176 16 L 176 68 L 228 68 Z" fill="url(#binCornerGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>

  <!-- 中心闪电机器码图标 -->
  <g transform="translate(100, 110)">
    <path d="M 38 0 L 0 54 L 28 54 L 14 100 L 62 36 L 32 36 Z" fill="url(#boltGrad)"/>
  </g>

  <!-- 底部标签 -->
  <rect x="64" y="242" width="128" height="34" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
  <text x="128" y="265" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="800" font-size="14" fill="#34D399" letter-spacing="2">.XUBIN</text>
</svg>
