<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" width="100%" height="100%">
  <!-- .xubin 二进制产物格式图标 -->
  <defs>
    <linearGradient id="binPaperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E1C" />
      <stop offset="100%" stop-color="#0A100E" />
    </linearGradient>
    <linearGradient id="binCornerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20332F" />
      <stop offset="100%" stop-color="#141E1C" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <path d="M 28 16 L 176 16 L 228 68 L 228 292 C 228 298 224 304 216 304 L 28 304 C 20 304 16 298 16 292 L 16 28 C 16 20 20 16 28 16 Z"
