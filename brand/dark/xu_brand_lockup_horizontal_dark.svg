<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="100%" height="100%">
  <!-- Xu 品牌横向标准组合 (黑色/深色背景专用版 Dark Edition) -->
  <defs>
    <linearGradient id="lockupRedDarkH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="60%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <filter id="lockupGlowDarkH" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#FF385C" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 左侧甲骨文图腾 -->
  <g transform="translate(20, 10) scale(0.36)" filter="url(#lockupGlowDarkH)">
    <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140"
          fill="none" stroke="url(#lockupRedDarkH)" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 165 155 L 230 218 L 165 280"
          fill="none" stroke="url(#lockupRedDarkH)" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 335 155 L 270 218 L 335 280"
          fill="none" stroke="url(#lockupRedDarkH)" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 分割线 (浅白) -->
  <line x1="210" y1="45" x2="210" y2="155" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" stroke-linecap="round"/>

  <!-- 右侧暗夜字标 (X: 钛白 / u: 霓虹朱砂红) -->
  <g transform="translate(245, 0)">
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="102" fill="#F8FAFC" letter-spacing="-2">
      X<tspan fill="url(#lockupRedDarkH)">U</tspan>
    </text>
    <text x="5" y="160" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="600" font-size="14" fill="#94A3B8" letter-spacing="4">
      ROCK-SOLID · ZERO GC · SUPERTURBO
    </text>
  </g>
</svg>
