<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%">
  <!-- Xu 中英文双语官方组合 (黑色/深色背景专用版 Dark Edition) -->
  <defs>
    <linearGradient id="zhRedDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="60%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <filter id="zhGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#FF385C" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 左侧甲骨文图腾 -->
  <g transform="translate(20, 0) scale(0.34)" filter="url(#zhGlowDark)">
    <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140"
          fill="none" stroke="url(#zhRedDark)" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 165 155 L 230 218 L 165 280"
          fill="none" stroke="url(#zhRedDark)" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 335 155 L 270 218 L 335 280"
          fill="none" stroke="url(#zhRedDark)" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 右侧暗夜字标 (Xu: 钛白 / 编程语言: 霓虹朱砂红) -->
  <g transform="translate(220, 0)">
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#F8FAFC" letter-spacing="-1">
      XU <tspan font-weight="700" fill="url(#zhRedDark)">编程语言</tspan>
    </text>
    <text x="0" y="130" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="600" font-size="13" fill="#94A3B8" letter-spacing="3">
      零 GC · 所有权内存安全 · 极速构建
    </text>
  </g>
</svg>
