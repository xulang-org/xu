<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <!-- Xu 品牌纵向标准组合 (Vertical Brand Lockup) -->
  <defs>
    <!-- 朱砂金石渐变 -->
    <linearGradient id="lockupRedGradV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="60%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <!-- 金石立体微阴影 -->
    <filter id="lockupGlowV" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#E11D48" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. 顶部甲骨文图腾 -->
  <g transform="translate(60, 20) scale(0.56)" filter="url(#lockupGlowV)">
    <!-- 外部扁平 U 框 -->
    <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140"
          fill="none" stroke="url(#lockupRedGradV)" stroke-width="26"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 内部左折笔 -->
    <path d="M 165 155 L 230 218 L 165 280"
          fill="none" stroke="url(#lockupRedGradV)" stroke-width="26"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 内部右折笔 -->
    <path d="M 335 155 L 270 218 L 335 280"
          fill="none" stroke="url(#lockupRedGradV)" stroke-width="26"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 2. 下部品牌字标与标语 -->
  <text x="200" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="96" fill="#FFFFFF" letter-spacing="-2">X<tspan fill="url(#lockupRedGradV)">U</tspan></text>

  <text x="200" y="420" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="600" font-size="13" fill="#94A3B8" letter-spacing="4">SYSTEMS PROGRAMMING</text>
  <text x="200" y="445" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" font-size="11" fill="#64748B" letter-spacing="3">ZERO GC · MEMORY SAFE · FAST</text>
</svg>
