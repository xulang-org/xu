<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="100%" height="100%">
  <!-- Xu 官方标准商务名片 - 宣纸白底版 (Business Card Light 90x54mm) -->
  <defs>
    <linearGradient id="bcRedLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="60%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- 背景画板 (展示双面: 左侧正面 400x240, 右侧背面 400x240) -->
  <rect width="900" height="540" fill="#F3F4F6" />

  <!-- 1. 正面 (Front Side) -->
  <g transform="translate(40, 150)" filter="url(#cardShadow)">
    <rect width="380" height="228" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" />

    <!-- 顶部状态小图腾 -->
    <g transform="translate(32, 36) scale(0.24)">
      <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#bcRedLight)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#bcRedLight)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#bcRedLight)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="78" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="20" fill="#111827">XU <tspan fill="url(#bcRedLight)">LANGUAGE</tspan></text>

    <!-- 姓名与职位 -->
    <text x="32" y="125" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#111827">陈 墨 <tspan font-size="12" font-weight="600" fill="#4B5563">/ Alex Chen</tspan></text>
    <text x="32" y="148" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#BE123C" letter-spacing="1">CHIEF COMPILER ARCHITECT</text>

    <!-- 底部联络信息 -->
    <text x="32" y="186" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6B7280">E: alex@xu-lang.dev</text>
    <text x="32" y="202" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6B7280">W: https://xu-lang.dev · #net #ui #sync</text>

    <!-- 右下角极简切角朱砂标 -->
    <path d="M 360 228 L 380 208 L 380 228 Z" fill="#E11D48" />
  </g>

  <!-- 2. 背面 (Back Side) -->
  <g transform="translate(480, 150)" filter="url(#cardShadow)">
    <rect width="380" height="228" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" />

    <!-- 居中大幅甲骨金石主图腾与品牌标语 -->
    <g transform="translate(135, 38) scale(0.28)">
      <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#bcRedLight)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#bcRedLight)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#bcRedLight)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="190" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="24" fill="#111827" letter-spacing="-1">
      X<tspan fill="url(#bcRedLight)">U</tspan>
    </text>
    <text x="190" y="196" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#4B5563" letter-spacing="3">
      ROCK-SOLID · ZERO GC · SUPERSONIC
    </text>
  </g>

  <!-- 标题说明 -->
  <text x="40" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="24" fill="#111827">XU 官方标准商务名片（宣纸白底版 · 90×54mm）</text>
  <text x="40" y="90" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6B7280">350g 特种棉质白卡 · 局部烫朱砂红 · 正面信息架构 / 背面超级符号</text>
</svg>
