<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <!-- XU 官方商务名片 · 宣纸白底背面 (Light Edition - Back · 双轴 X/Y 绝对中心对齐) -->
  <defs>
    <linearGradient id="bcGradLightB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="lightDeboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#BE123C" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 350g 特种纯白棉卡底板 -->
  <rect width="500" height="300" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- 双轴 X/Y 绝对中心对齐组 (水平中轴 X=250.0 · 垂直包围盒 y:[70, 230] 垂直中心 Y=150.0) -->
  <g id="dual-axis-centered-lockup" filter="url(#lightDeboss)">
    <!-- 甲骨金石图腾 (以 (250, 100) 为绝对几何中心 · 缩放 0.26) -->
    <g transform="translate(250, 100) scale(0.26)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#bcGradLightB)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#bcGradLightB)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#bcGradLightB)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- VI 标准字标 (水平中点严格锁定于 X=250.0 · 基线 y = 174) -->
    <text x="250" y="174" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="34" fill="#111827" letter-spacing="-2">
      X<tspan fill="url(#bcGradLightB)">U</tspan>
    </text>

    <!-- VI 官方定位副标 (水平中点 X=250.0 · 基线 y = 204) -->
    <text x="250" y="204" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#4B5563" letter-spacing="3.5">
      ROCK-SOLID · ZERO GC · SUPERSONIC
    </text>

    <!-- VI 官方系统定位 (水平中点 X=250.0 · 基线 y = 230) -->
    <text x="250" y="230" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#9CA3AF" letter-spacing="2">
      SYSTEMS PROGRAMMING LANGUAGE
    </text>
  </g>
</svg>
