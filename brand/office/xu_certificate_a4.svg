<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 842 595" width="100%" height="100%">
  <!-- XU 官方开源贡献与系统架构师认证证书 (A4 横版 · 297×210mm · 极简瑞士网格与烫金火印) -->
  <defs>
    <linearGradient id="certGoldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="certRedG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="certSealShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#D97706" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 300g 浅米金特种棉纸底板 -->
  <rect width="842" height="595" fill="#FAF9F6"/>

  <!-- 外部双重极细防伪几何边框 (安全留白 36px) -->
  <rect x="36" y="36" width="770" height="523" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="42" y="42" width="758" height="511" fill="none" stroke="url(#certGoldG)" stroke-width="0.75" opacity="0.6"/>

  <!-- 四角装饰折角标 -->
  <path d="M 36 56 L 56 36 M 806 36 L 806 56 M 36 539 L 56 559 M 806 539 L 786 559" stroke="url(#certGoldG)" stroke-width="1.5"/>

  <!-- 背景 2% 超低透光居中防伪水印 -->
  <g transform="translate(421, 297) scale(0.65)" opacity="0.025">
    <g transform="translate(-250, -255)">
      <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="#000000" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="#000000" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="#000000" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- 1. 顶部 Header (以 X=421.0 为中轴绝对居中) -->
  <g transform="translate(421, 100)">
    <!-- 顶部居中金石微标 (缩放 0.18) -->
    <g transform="translate(0, 0) scale(0.18)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#certRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#certRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#certRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- 证书主标题 (中英双语) -->
    <text y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="24" fill="#111827" letter-spacing="4">
      CERTIFICATE OF CONTRIBUTION
    </text>
    <text y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-weight="800" font-size="13" fill="#BE123C" letter-spacing="6">
      XU 编程语言内核开源贡献与系统认证
    </text>
  </g>

  <!-- 2. 正文受聘 / 获奖人与贡献说明 (居中瑞士排印) -->
  <g transform="translate(421, 235)" text-anchor="middle">
    <text y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#6B7280" letter-spacing="2">
      THIS CERTIFICATE IS PROUDLY PRESENTED TO
    </text>

    <!-- 获得者姓名 (加大字号) -->
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Inter', sans-serif" font-weight="900" font-size="32" fill="#111827" letter-spacing="2">
      林 语 堂 <tspan font-size="18" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#64748B">(Alex Lin)</tspan>
    </text>

    <!-- 贡献声明文字 -->
    <text y="80" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" fill="#374151" letter-spacing="0.5">
      鉴于您在 <tspan font-weight="800" fill="#BE123C">XU 系统内核与异步运行时架构</tspan> 的杰出开源代码贡献与工程实践，
    </text>
    <text y="102" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" fill="#374151" letter-spacing="0.5">
      特授予 <tspan font-weight="800" fill="#111827">XU 官方认证核心系统架构师 (Certified Core System Architect)</tspan> 荣誉资质。
    </text>

    <!-- 证书编号与防伪哈希 -->
    <text y="142" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9CA3AF" letter-spacing="1.5">
      CERT ID: XU-CCA-2026-08892 // HASH: 8f4a2c910b7e31d4
    </text>
  </g>

  <!-- 3. 底部签章区 (左侧委员会签名 · 中间烫金钢印 · 右侧基金会理事长) -->
  <g transform="translate(421, 470)">
    <!-- 左侧: 技术委员会代表 -->
    <g transform="translate(-240, 0)" text-anchor="center">
      <line x1="-80" y1="0" x2="80" y2="0" stroke="#9CA3AF" stroke-width="1"/>
      <text y="-8" text-anchor="middle" font-family="'Brush Script MT', 'Dancing Script', cursive, sans-serif" font-size="22" fill="#1E293B">David M. Xu</text>
      <text y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#4B5563">TECHNICAL COMMITTEE</text>
      <text y="28" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#9CA3AF">LEAD ARCHITECT</text>
    </g>

    <!-- 中间: 烫金官方印章 (Golden Seal · 完美同心圆与弧形文字) -->
    <g transform="translate(0, -10)" filter="url(#certSealShadow)">
      <circle cx="0" cy="0" r="42" fill="#FFFFFF" stroke="url(#certGoldG)" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="38" fill="#FFFDF8" stroke="url(#certGoldG)" stroke-width="0.8" stroke-dasharray="3 2"/>
      <circle cx="0" cy="0" r="26" fill="none" stroke="url(#certGoldG)" stroke-width="0.6" opacity="0.6"/>

      <!-- 钢印内部图腾 (居中绝对质心) -->
      <g transform="translate(0, 0) scale(0.072)">
        <g transform="translate(-250, -255)">
          <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#certGoldG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#certGoldG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#certGoldG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- 顶部弧形文字 (OFFICIAL SEAL) -->
      <path id="certSealArcTop" d="M -32 0 A 32 32 0 1 1 32 0" fill="none" stroke="none"/>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="6.2" fill="#92400E" letter-spacing="1.8">
        <textPath href="#certSealArcTop" startOffset="50%" text-anchor="middle">
          OFFICIAL SEAL
        </textPath>
      </text>

      <!-- 底部弧形文字 (★ 2026 VALIDATED ★) -->
      <path id="certSealArcBottom" d="M 32 0 A 32 32 0 0 1 -32 0" fill="none" stroke="none"/>
      <text font-family="'JetBrains Mono', monospace" font-weight="800" font-size="4.8" fill="#B45309" letter-spacing="1.2">
        <textPath href="#certSealArcBottom" startOffset="50%" text-anchor="middle">
          ★ 2026 VALIDATED ★
        </textPath>
      </text>
    </g>

    <!-- 右侧: 开源基金会理事长 -->
    <g transform="translate(240, 0)" text-anchor="center">
      <line x1="-80" y1="0" x2="80" y2="0" stroke="#9CA3AF" stroke-width="1"/>
      <text y="-8" text-anchor="middle" font-family="'Brush Script MT', 'Dancing Script', cursive, sans-serif" font-size="22" fill="#1E293B">Grace H. Turing</text>
      <text y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#4B5563">OPEN SOURCE FOUNDATION</text>
      <text y="28" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#9CA3AF">EXECUTIVE DIRECTOR</text>
    </g>
  </g>
</svg>
