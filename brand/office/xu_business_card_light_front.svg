<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <!-- XU 官方商务名片 · 宣纸白底正面 (Light Edition - Front · 90×54mm · 瑞士网格严密排印) -->
  <defs>
    <linearGradient id="bcGradLightF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="totemShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#BE123C" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 350g 特种纯白棉卡底板 -->
  <rect width="500" height="300" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- 1. 右上角: 纯粹甲骨金石图腾 LOGO (严格几何质心定位 X=440.0, Y=56.0) -->
  <g transform="translate(440, 56) scale(0.18)" filter="url(#totemShadowLight)">
    <g transform="translate(-250, -255)">
      <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#bcGradLightF)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#bcGradLightF)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#bcGradLightF)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- 2. 左上方核心身份区 (网格左边距 38px) -->
  <g transform="translate(38, 44)">
    <!-- 姓名 -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif" font-weight="900" font-size="26" fill="#111827" letter-spacing="1.5">
      陈 墨 <tspan font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#6B7280" letter-spacing="0.5">/ ALEX CHEN</tspan>
    </text>
    <!-- 职务 -->
    <text x="0" y="52" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="700" fill="#BE123C" letter-spacing="1.5">
      CHIEF SYSTEMS ARCHITECT
    </text>
    <!-- 所属机构 -->
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9.5" font-weight="600" fill="#9CA3AF" letter-spacing="0.5">
      XU 编程语言系统与开源基金会 · 技术委员会
    </text>
  </g>

  <!-- 中部水平分割线 (左留白 38px, 右留白 38px) -->
  <line x1="38" y1="158" x2="462" y2="158" stroke="#F3F4F6" stroke-width="1.5"/>

  <!-- 3. 左下方联络信息区 (标准双列 Key-Value 排印) -->
  <g transform="translate(38, 190)" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" font-weight="500">
    <text x="0" y="0" fill="#9CA3AF" font-weight="700">TEL</text>
    <text x="56" y="0" fill="#374151">+86 (10) 8888 2026</text>

    <text x="0" y="22" fill="#9CA3AF" font-weight="700">MAIL</text>
    <text x="56" y="22" fill="#374151">alex@xu-lang.dev</text>

    <text x="0" y="44" fill="#9CA3AF" font-weight="700">SITE</text>
    <text x="56" y="44" fill="#374151">https://xu-lang.dev</text>

    <text x="0" y="66" fill="#9CA3AF" font-weight="700">ADDR</text>
    <text x="56" y="66" fill="#6B7280">Building 8, Global Architecture Center, Beijing</text>
  </g>

  <!-- 右下角极简切角朱砂标 (18×18mm) -->
  <path d="M 478 300 L 500 278 L 500 300 Z" fill="#E11D48"/>
</svg>
