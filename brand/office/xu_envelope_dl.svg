<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- XU 官方标准商业信封 (DL Envelope · 220×110mm 1:1 实际物理尺寸 · 瑞士网格排印) -->
  <defs>
    <linearGradient id="envRedS2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- 1. 左上角寄件人邮政编码方格 (6 位国标红框 · 严格等距) -->
  <g transform="translate(44, 38)">
    <rect x="0" y="0" width="28" height="36" fill="none" stroke="#E11D48" stroke-width="1.5"/>
    <rect x="34" y="0" width="28" height="36" fill="none" stroke="#E11D48" stroke-width="1.5"/>
    <rect x="68" y="0" width="28" height="36" fill="none" stroke="#E11D48" stroke-width="1.5"/>
    <rect x="102" y="0" width="28" height="36" fill="none" stroke="#E11D48" stroke-width="1.5"/>
    <rect x="136" y="0" width="28" height="36" fill="none" stroke="#E11D48" stroke-width="1.5"/>
    <rect x="170" y="0" width="28" height="36" fill="none" stroke="#E11D48" stroke-width="1.5"/>
  </g>

  <!-- 2. 寄件方品牌与机构标识 (置入 VI 官方横向标准组合 · 缩放 0.18) -->
  <g transform="translate(44, 95)">
    <g transform="translate(0, 0) scale(0.18)">
      <!-- 左侧甲骨文图腾 -->
      <g transform="translate(20, 10) scale(0.36)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#envRedS2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#envRedS2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#envRedS2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- 分割线 -->
      <line x1="210" y1="45" x2="210" y2="155" stroke="rgba(0, 0, 0, 0.15)" stroke-width="2" stroke-linecap="round"/>
      <!-- 字标与副标 -->
      <g transform="translate(245, 0)">
        <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="102" fill="#111827" letter-spacing="-2">
          X<tspan fill="url(#envRedS2)">U</tspan>
        </text>
        <text x="5" y="160" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="14" fill="#4B5563" letter-spacing="4">
          ROCK-SOLID · ZERO GC · SUPERSONIC
        </text>
      </g>
    </g>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9" font-weight="600" fill="#6B7280">
      XU 编程语言系统与开源基金会 · 北京市海淀区中关村全球架构中心 8 号楼
    </text>
  </g>

  <!-- 3. 右上角标准邮资贴位 (Postage Stamp Zone) -->
  <g transform="translate(700, 38)">
    <rect width="56" height="70" rx="4" fill="#FAFAF9" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="28" y="36" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#94A3B8">POSTAGE</text>
    <text x="28" y="48" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#9CA3AF">STAMP</text>
  </g>

  <!-- 4. 收件人信息书写区 (三条等距水平虚线 · 严格对齐) -->
  <g transform="translate(280, 185)">
    <line x1="0" y1="0" x2="476" y2="0" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="6 4"/>
    <line x1="0" y1="46" x2="476" y2="46" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="6 4"/>
    <line x1="0" y1="92" x2="476" y2="92" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>

  <!-- 5. 右下角收件人邮政编码方格 (6 位深灰框) -->
  <g transform="translate(552, 330)">
    <rect x="0" y="0" width="28" height="36" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <rect x="34" y="0" width="28" height="36" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <rect x="68" y="0" width="28" height="36" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <rect x="102" y="0" width="28" height="36" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <rect x="136" y="0" width="28" height="36" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <rect x="170" y="0" width="28" height="36" fill="none" stroke="#64748B" stroke-width="1.5"/>
  </g>

  <!-- 6. 底部 3px 朱砂金石红饰边 -->
  <line x1="0" y1="397" x2="800" y2="397" stroke="#E11D48" stroke-width="3"/>
</svg>
