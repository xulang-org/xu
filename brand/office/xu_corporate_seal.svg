<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Xu 官方行政与技术认证红印章 (Official Corporate Seal · 40.0mm) -->
  <defs>
    <!-- 朱砂印泥物理噪点与边缘渗透滤镜 -->
    <filter id="sealInkRealistic" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="#FAFAF9"/>

  <!-- 印章主体 (朱砂印泥红 #BE123C) -->
  <g transform="translate(250, 250)" filter="url(#sealInkRealistic)" stroke="#BE123C" fill="none">
    <!-- 外双环 (厚外环 7px + 细内环 2px，标准间距 8px) -->
    <circle cx="0" cy="0" r="212" stroke-width="7"/>
    <circle cx="0" cy="0" r="198" stroke-width="2"/>

    <!-- 顶部弧形文字 (XU 编程语言技术委员会 · 官方认证) -->
    <path id="textArcTopSeal" d="M -160 0 A 160 160 0 1 1 160 0" fill="none" stroke="none"/>
    <text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#BE123C" letter-spacing="4" stroke="none">
      <textPath href="#textArcTopSeal" startOffset="50%" text-anchor="middle">
        XU 编程语言技术委员会 · 官方认证
      </textPath>
    </text>

    <!-- 中心正统甲骨金石图腾 (双轴居中绝对坐标) -->
    <g transform="scale(0.3)" stroke="#BE123C" fill="none">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- 底部弧形文字 (★ OFFICIAL SEAL · 2026 ★) -->
    <path id="textArcBottomSeal" d="M 160 0 A 160 160 0 0 1 -160 0" fill="none" stroke="none"/>
    <text font-family="'JetBrains Mono', monospace" font-weight="800" font-size="13.5" fill="#BE123C" letter-spacing="3.5" stroke="none">
      <textPath href="#textArcBottomSeal" startOffset="50%" text-anchor="middle">
        ★ OFFICIAL SEAL · 2026 ★
      </textPath>
    </text>
  </g>
</svg>
