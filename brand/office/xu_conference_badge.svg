<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <!-- XU 全球开发者大会参会胸卡与极客挂绳 (XU CON 2026 Developer Badge & Lanyard) -->
  <defs>
    <linearGradient id="badgeRedG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="lanyardRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E0D14"/>
      <stop offset="50%" stop-color="#1A1824"/>
      <stop offset="100%" stop-color="#0E0D14"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 1. 25mm 织带挂绳 (Lanyard Straps) -->
  <g transform="translate(300, 0)">
    <!-- 左侧挂绳 -->
    <path d="M -70 0 L -25 140 L -2 140" fill="none" stroke="url(#lanyardRibbon)" stroke-width="24" stroke-linecap="round"/>
    <path d="M 70 0 L 25 140 L 2 140" fill="none" stroke="url(#lanyardRibbon)" stroke-width="24" stroke-linecap="round"/>
    <!-- 挂绳提花字标 (白字 + 红标) -->
    <text x="-48" y="70" transform="rotate(72 -48 70)" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="900" fill="#FFFFFF" letter-spacing="2">
      XU CON 2026
    </text>
    <text x="48" y="70" transform="rotate(-72 48 70)" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="900" fill="#E11D48" letter-spacing="2">
      SUPERSONIC
    </text>

    <!-- 金属合金快拆鹰嘴扣 (Zinc Alloy Carabiner Clasp) -->
    <rect x="-18" y="130" width="36" height="20" rx="4" fill="#374151" stroke="#4B5563" stroke-width="1.5"/>
    <path d="M -10 150 C -10 175 10 175 10 150 Z" fill="#1F2937" stroke="#4B5563" stroke-width="2"/>
    <circle cx="0" cy="162" r="3" fill="#E11D48"/>
  </g>

  <!-- 2. 胸卡主体 (Badge · 100×150mm · 曜石黑哑光磨砂压克力) -->
  <g transform="translate(150, 180)" filter="url(#badgeShadow)">
    <rect width="300" height="470" rx="16" fill="#121018" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

    <!-- 顶部挂孔 -->
    <rect x="120" y="14" width="60" height="8" rx="4" fill="#060508"/>

    <!-- 顶部大会品牌横幅 (以 X=150.0 居中) -->
    <g transform="translate(150, 60)">
      <!-- 官方微标 -->
      <g transform="translate(0, 0) scale(0.12)">
        <g transform="translate(-250, -255)">
          <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#badgeRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#badgeRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#badgeRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
      <text y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="1">
        XU <tspan fill="url(#badgeRedG)">CON</tspan> 2026
      </text>
      <text y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#94A3B8" letter-spacing="2">
        GLOBAL DEVELOPER SUMMIT
      </text>
    </g>

    <!-- 参会者身份标签 (KEYNOTE SPEAKER / 朱砂红渐变卡条) -->
    <rect x="24" y="130" width="252" height="34" rx="8" fill="url(#badgeRedG)"/>
    <text x="150" y="152" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#FFFFFF" letter-spacing="2">
      ★ KEYNOTE SPEAKER ★
    </text>

    <!-- 参会者姓名与所属机构 (居中) -->
    <g transform="translate(150, 215)" text-anchor="middle">
      <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Inter', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF">
        林 语 堂
      </text>
      <text y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FF385C">
        ALEX LIN
      </text>
      <text y="48" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#94A3B8">
        XU Core Architecture Team
      </text>
    </g>

    <!-- 二维码通行区 (QR Code + NFC) -->
    <g transform="translate(150, 340)">
      <rect x="-42" y="-42" width="84" height="84" rx="8" fill="#FFFFFF"/>
      <!-- 二维码图案 -->
      <rect x="-34" y="-34" width="24" height="24" fill="#121018"/>
      <rect x="-30" y="-30" width="16" height="16" fill="#FFFFFF"/>
      <rect x="-26" y="-26" width="8" height="8" fill="#121018"/>

      <rect x="10" y="-34" width="24" height="24" fill="#121018"/>
      <rect x="14" y="-30" width="16" height="16" fill="#FFFFFF"/>
      <rect x="18" y="-26" width="8" height="8" fill="#121018"/>

      <rect x="-34" y="10" width="24" height="24" fill="#121018"/>
      <rect x="-30" y="14" width="16" height="16" fill="#FFFFFF"/>
      <rect x="-26" y="18" width="8" height="8" fill="#121018"/>

      <!-- 中心点微标 -->
      <circle cx="0" cy="0" r="8" fill="#E11D48"/>

      <text y="62" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#10B981">
        ● ALL-ACCESS PASS // NFC ACTIVE
      </text>
    </g>

    <!-- 底部时间地点 -->
    <text x="150" y="446" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B" letter-spacing="1">
      OCT 24-26 · BEIJING NATIONAL CONVENTION
    </text>
  </g>
</svg>
