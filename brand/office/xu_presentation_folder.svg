<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="100%" height="100%">
  <!-- XU 官方标准文件档案夹 / 文件夹 (双轴 X/Y 绝对中心对齐 X=650.0, Y=215.0) -->
  <defs>
    <linearGradient id="folderRedVC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
  </defs>

  <!-- 1. 左页 (Inside Left · 曜石黑沉浸内封 · 420×560 · 中心 X=210.0, Y=280.0) -->
  <rect x="0" y="0" width="420" height="560" rx="14" fill="#121118"/>

  <!-- 左页暗纹图腾 (双轴居中于 (210.0, 280.0)) -->
  <g transform="translate(210, 260) scale(0.38)" opacity="0.05">
    <g transform="translate(-250, -255)">
      <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="210" y="470" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#64748B" letter-spacing="3">
    XU ARCHITECTURE &amp; SPECIFICATION
  </text>
  <text x="210" y="492" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#475569" letter-spacing="1.5">
    CONFIDENTIAL · SYSTEM ENGINEERING
  </text>

  <!-- 2. 中间 20mm 书脊 (Spine 420~440) -->
  <rect x="420" y="0" width="20" height="560" fill="#0A090D"/>
  <line x1="420" y1="0" x2="420" y2="560" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="440" y1="0" x2="440" y2="560" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- 3. 右页 (Front Cover · 封面展示区中心 X=650.0, Y=215.0) -->
  <rect x="440" y="0" width="420" height="560" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- 封面双轴绝对中心对齐组 (水平中点 X=650.0 · 垂直中心 Y=215.0) -->
  <g id="folder-cover-lockup">
    <!-- 居中图腾 (几何中心 (650, 160) · 缩放 0.38) -->
    <g transform="translate(650, 160) scale(0.38)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#folderRedVC)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#folderRedVC)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#folderRedVC)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- VI 标准字标 (中点 X=650.0 · 基线 y = 265) -->
    <text x="650" y="265" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="52" fill="#111827" letter-spacing="-2">
      X<tspan fill="url(#folderRedVC)">U</tspan>
    </text>

    <!-- VI 官方定位副标 (中点 X=650.0 · 基线 y = 300) -->
    <text x="650" y="300" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="11.5" fill="#4B5563" letter-spacing="3.5">
      SYSTEMS PROGRAMMING LANGUAGE
    </text>
  </g>

  <!-- 4. 底部内折插袋与名片槽 -->
  <path d="M 440 430 L 860 430 L 860 560 L 440 560 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="575" y1="505" x2="725" y2="505" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="590" y1="525" x2="710" y2="525" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 封底朱砂红切边 -->
  <path d="M 836 560 L 860 536 L 860 560 Z" fill="#E11D48"/>
</svg>
