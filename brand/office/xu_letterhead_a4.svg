<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="100%" height="100%">
  <!-- XU 官方标准公文信纸 (A4 Letterhead · 100% 严格遵循 VI 横向标准组合) -->
  <defs>
    <linearGradient id="lhRedV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
  </defs>

  <!-- 80g 纯木浆道林白底纸 -->
  <rect width="595" height="842" fill="#FFFFFF"/>

  <!-- 1. 顶部 Header (置入 VI 官方横向标准组合) -->
  <g transform="translate(48, 44)">
    <!-- 官方横向标准组合 (缩放比 0.22) -->
    <g transform="translate(0, 0) scale(0.22)">
      <!-- 左侧甲骨文图腾 -->
      <g transform="translate(20, 10) scale(0.36)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#lhRedV)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#lhRedV)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#lhRedV)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- 分割线 -->
      <line x1="210" y1="45" x2="210" y2="155" stroke="rgba(0, 0, 0, 0.15)" stroke-width="2" stroke-linecap="round"/>
      <!-- 右侧标准字标与副标 -->
      <g transform="translate(245, 0)">
        <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="102" fill="#111827" letter-spacing="-2">
          X<tspan fill="url(#lhRedV)">U</tspan>
        </text>
        <text x="5" y="160" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="13" fill="#4B5563" letter-spacing="4">
          ROCK-SOLID · ZERO GC · SUPERSONIC
        </text>
      </g>
    </g>

    <!-- 右侧公文编号与日期 (严格基线对齐) -->
    <g transform="translate(499, 10)" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace">
      <text y="14" font-size="9" font-weight="700" fill="#374151">REF: <tspan fill="#BE123C">XU-CORP-2026</tspan></text>
      <text y="28" font-size="8" fill="#9CA3AF">DATE: 2026-08-27</text>
    </g>

    <!-- 顶部贯穿线 (带 3px 朱砂金石红加固标) -->
    <line x1="0" y1="52" x2="499" y2="52" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="0" y1="52" x2="64" y2="52" stroke="#E11D48" stroke-width="2.5"/>
  </g>

  <!-- 2. 正文居中防伪水印 (2.5% 超低透明度金石图腾) -->
  <g transform="translate(197, 310) scale(0.4)" opacity="0.025">
    <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="#000000" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="#000000" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="#000000" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 3. 底部 Footer -->
  <g transform="translate(48, 788)">
    <line x1="0" y1="0" x2="499" y2="0" stroke="#E5E7EB" stroke-width="1"/>
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="8.5" fill="#6B7280">XU 编程语言系统与开源基金会 · 技术委员会官方公文</text>
    <text x="499" y="16" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="8" fill="#9CA3AF">PAGE 1 OF 1 · HTTPS://XU-LANG.DEV</text>
  </g>
</svg>
