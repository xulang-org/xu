<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="100%" height="100%">
  <!-- XU 官方精装办公笔记本与便签套件 (双轴 X/Y 绝对中心对齐) -->
  <defs>
    <linearGradient id="minRedNbVC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="minShadowNbVC" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 1. A5 硬皮精装笔记本 (Left · 280×400 · 中心坐标 X=140.0, Y=200.0) -->
  <g transform="translate(60, 30)" filter="url(#minShadowNbVC)">
    <rect width="280" height="400" rx="14" fill="#121018" stroke="#23202E" stroke-width="1.5"/>
    <line x1="22" y1="0" x2="22" y2="400" stroke="#08070C" stroke-width="2"/>
    <path d="M 200 0 L 200 415 L 210 405 L 220 415 L 220 0 Z" fill="#E11D48"/>

    <!-- 封面双轴绝对中心对齐组 (中心 X=140.0, Y=200.0) -->
    <g id="notebook-centered-lockup">
      <!-- 居中图腾 (几何中心 (140, 167) · 缩放 0.22) -->
      <g transform="translate(140, 167) scale(0.22)">
        <g transform="translate(-250, -255)">
          <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#minRedNbVC)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#minRedNbVC)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#minRedNbVC)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- VI 标准字标 (中点 X=140.0 · 基线 y = 233) -->
      <text x="140" y="233" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="-1">
        X<tspan fill="url(#minRedNbVC)">U</tspan>
      </text>

      <!-- VI 官方副标 (中点 X=140.0 · 基线 y = 258) -->
      <text x="140" y="258" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="8.5" fill="#64748B" letter-spacing="2.5">
        SYSTEMS LANGUAGE
      </text>
    </g>
  </g>

  <!-- 2. 极简便签本 (Right · 220×220) -->
  <g transform="translate(410, 120)" filter="url(#minShadowNbVC)">
    <rect width="220" height="220" rx="8" fill="#FAFAF9" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="18" rx="2" fill="#E11D48"/>

    <!-- 5mm 点阵网格 -->
    <g fill="#CBD5E1">
      <circle cx="35" cy="50" r="1.2"/><circle cx="75" cy="50" r="1.2"/><circle cx="115" cy="50" r="1.2"/><circle cx="155" cy="50" r="1.2"/><circle cx="185" cy="50" r="1.2"/>
      <circle cx="35" cy="90" r="1.2"/><circle cx="75" cy="90" r="1.2"/><circle cx="115" cy="90" r="1.2"/><circle cx="155" cy="90" r="1.2"/><circle cx="185" cy="90" r="1.2"/>
      <circle cx="35" cy="130" r="1.2"/><circle cx="75" cy="130" r="1.2"/><circle cx="115" cy="130" r="1.2"/><circle cx="155" cy="130" r="1.2"/><circle cx="185" cy="130" r="1.2"/>
      <circle cx="35" cy="170" r="1.2"/><circle cx="75" cy="170" r="1.2"/><circle cx="115" cy="170" r="1.2"/><circle cx="155" cy="170" r="1.2"/><circle cx="185" cy="170" r="1.2"/>
    </g>

    <text x="200" y="208" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#94A3B8">XU-LANG.DEV</text>
  </g>
</svg>
