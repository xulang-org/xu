<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- XU 官方 Keynote / PPT 16:9 技术演讲母版 (1920×1080 16:9 宽屏极简发布会模板) -->
  <defs>
    <linearGradient id="slideRedG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="slideBgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0D14"/>
      <stop offset="100%" stop-color="#07060A"/>
    </linearGradient>
    <pattern id="slideGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 16:9 曜石暗夜背景 -->
  <rect width="960" height="540" fill="url(#slideBgG)"/>
  <rect width="960" height="540" fill="url(#slideGrid)"/>

  <!-- 顶部官方微标与会场标识 (y: 36) -->
  <g transform="translate(60, 36)">
    <!-- 左侧微标 -->
    <g transform="translate(0, 0) scale(0.12)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#slideRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#slideRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#slideRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <text x="24" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">
      X<tspan fill="url(#slideRedG)">U</tspan> KEYNOTE
    </text>

    <!-- 右侧分类 -->
    <text x="840" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#64748B" letter-spacing="2">
      ARCHITECTURE // 2026 RELEASE
    </text>
    <line x1="0" y1="20" x2="840" y2="20" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </g>

  <!-- 居中核心演讲标题 (以 X=480.0 居中) -->
  <g transform="translate(480, 210)" text-anchor="middle">
    <!-- 朱砂红胶囊标签 -->
    <rect x="-80" y="-56" width="160" height="26" rx="13" fill="rgba(225, 29, 72, 0.15)" stroke="#E11D48" stroke-width="1"/>
    <text y="-39" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#FF385C" letter-spacing="2">
      NEXT-GEN RUNTIME
    </text>

    <!-- 主标题 (大字号) -->
    <text y="20" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="44" fill="#F8FAFC" letter-spacing="-1.5">
      Supersonic Speed. Zero GC.
    </text>

    <!-- 副标题 -->
    <text y="60" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-weight="600" font-size="16" fill="#94A3B8" letter-spacing="0.5">
      面向下一代百万级高并发系统的原生内存安全编程语言
    </text>
  </g>

  <!-- 下方 3 项核心技术指标矩阵卡片 -->
  <g transform="translate(480, 360)">
    <!-- 指标 1 -->
    <g transform="translate(-270, 0)">
      <rect x="-110" y="0" width="220" height="90" rx="10" fill="#121018" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="28" fill="#FF385C">0 ms</text>
      <text y="66" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#94A3B8">GC PAUSE TIME</text>
    </g>

    <!-- 指标 2 -->
    <g transform="translate(0, 0)">
      <rect x="-110" y="0" width="220" height="90" rx="10" fill="#121018" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="28" fill="#38BDF8">42 ns</text>
      <text y="66" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#94A3B8">CHANNEL LATENCY</text>
    </g>

    <!-- 指标 3 -->
    <g transform="translate(270, 0)">
      <rect x="-110" y="0" width="220" height="90" rx="10" fill="#121018" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="28" fill="#10B981">1.2 MB</text>
      <text y="66" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#94A3B8">STATIC BINARY SIZE</text>
    </g>
  </g>

  <!-- 底部页脚 -->
  <g transform="translate(60, 500)">
    <text y="0" font-family="'JetBrains Mono', monospace" font-size="8" fill="#475569">SPEAKER: ALEX LIN // PRINCIPAL ARCHITECT</text>
    <text x="840" y="0" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="8" fill="#475569">SLIDE 01 / 48</text>
  </g>
</svg>
