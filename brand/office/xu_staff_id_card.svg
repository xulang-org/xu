<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" height="100%">
  <!-- XU 官方员工工牌与通行卡 (双轴 X/Y 绝对中心对齐 · CR80 85.6×54mm) -->
  <defs>
    <linearGradient id="minRedId2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="minShadowId2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 1. 竖版员工工牌 (Left · 240×380 · 宽度中轴 X=120.0) -->
  <g transform="translate(60, 30)" filter="url(#minShadowId2)">
    <rect width="240" height="380" rx="14" fill="#121018" stroke="rgba(255,255,255,0.1)" stroke-width="1.2"/>

    <!-- 顶部挂绳孔 -->
    <rect x="90" y="12" width="60" height="6" rx="3" fill="#060508"/>

    <!-- 顶部居中极简图腾 (中心 (120.0, 52.0) · 缩放 0.12) -->
    <g transform="translate(120, 52) scale(0.12)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#minRedId2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#minRedId2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#minRedId2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- 员工头像框 (圆形直径 64px · 中心 (120.0, 136.0)) -->
    <circle cx="120" cy="136" r="32" fill="#1C1A24" stroke="url(#minRedId2)" stroke-width="1.5"/>
    <circle cx="120" cy="128" r="12" fill="#4B5563"/>
    <path d="M 100 162 C 100 148 110 144 120 144 C 130 144 140 148 140 162 Z" fill="#4B5563"/>

    <!-- 员工信息 (全部对齐于 X=120.0) -->
    <text x="120" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">林 语 堂</text>
    <text x="120" y="214" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#FF385C">RUNTIME ARCHITECT</text>
    <text x="120" y="232" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">ID: XU-8088</text>

    <!-- 底部 NFC 标识 -->
    <text x="120" y="340" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#10B981">
      ● NFC LEVEL 4
    </text>

    <!-- 底部极简红切边 -->
    <path d="M 0 372 L 240 372 L 240 380 L 0 380 Z" fill="#E11D48"/>
  </g>

  <!-- 2. 横版访客通行卡 (Right · 280×180 · 宽度中轴 X=140.0) -->
  <g transform="translate(350, 130)" filter="url(#minShadowId2)">
    <rect width="280" height="180" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- 顶部红标头 -->
    <path d="M 0 12 C 0 5 5 0 12 0 L 268 0 C 275 0 280 5 280 12 L 280 34 L 0 34 Z" fill="#BE123C"/>
    <text x="140" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#FFFFFF" letter-spacing="2">
      VISITOR PASS
    </text>

    <!-- 访客图腾与机构 -->
    <g transform="translate(42, 65) scale(0.1)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#minRedId2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#minRedId2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#minRedId2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <text x="64" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="14" fill="#111827">XU Architecture Lab</text>

    <!-- 编号 -->
    <text x="24" y="118" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#BE123C">PASS-2026</text>
    <text x="24" y="136" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">SINGLE ENTRY · 2026-08-27</text>
  </g>
</svg>
