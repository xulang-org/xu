<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <!-- XuFlow 官方 IDE 子品牌 Logo (黑红双色标准版 Black & Red Dual-Color) -->
  <defs>
    <linearGradient id="flowRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="flowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#BE123C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 左侧标志 (朱砂红图腾 + 闪电) -->
  <g transform="translate(20, 0) scale(0.34)" filter="url(#flowShadow)">
    <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#flowRedGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#flowRedGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#flowRedGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 380 340 L 330 420 L 370 420 L 340 490 L 420 400 L 380 400 Z" fill="#F59E0B"/>
  </g>

  <!-- 右侧黑红双色 (Xu: 碳黑 / Flow: 朱砂红) -->
  <g transform="translate(200, 0)">
    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="58" fill="#111827" letter-spacing="-1">
      Xu<tspan fill="url(#flowRedGrad)">Flow</tspan>
    </text>
    <text x="2" y="128" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="13" fill="#4B5563" letter-spacing="3">
      NEXT-GEN DEVSTUDIO
    </text>
  </g>
</svg>
