<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" width="100%" height="100%">
  <!-- .xumod 包模块配置文件格式图标 -->
  <defs>
    <linearGradient id="modPaperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24141A" />
      <stop offset="100%" stop-color="#120A0E" />
    </linearGradient>
    <linearGradient id="modCornerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D1E2B" />
      <stop offset="100%" stop-color="#24141A" />
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <path d="M 28 16 L 176 16 L 228 68 L 228 292 C 228 298 224 304 216 304 L 28 304 C 20 304 16 298 16 292 L 16 28 C 16 20 20 16 28 16 Z"
        fill="url(#modPaperGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
  <path d="M 176 16 L 176 68 L 228 68 Z" fill="url(#modCornerGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>

  <!-- 中心齿轮与模块图标 -->
  <g transform="translate(128, 160)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="url(#gearGrad)" stroke-width="12" stroke-dasharray="14 10"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#gearGrad)" stroke-width="6"/>
  </g>

  <!-- 底部标签 -->
  <rect x="64" y="242" width="128" height="34" rx="8" fill="rgba(225, 29, 72, 0.15)" stroke="rgba(225, 29, 72, 0.4)" stroke-width="1"/>
  <text x="128" y="265" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="800" font-size="14" fill="#FF385C" letter-spacing="2">.XUMOD</text>
</svg>
