<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" width="100%" height="100%">
  <!-- Xu 代码源文件专用格式图标 (.xu File Icon) -->
  <defs>
    <!-- 暗夜钛金纸张底座 -->
    <linearGradient id="filePaperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1C24" />
      <stop offset="100%" stop-color="#0E0D12" />
    </linearGradient>

    <!-- 折角阴影与折角渐变 -->
    <linearGradient id="cornerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2A38" />
      <stop offset="100%" stop-color="#1A1822" />
    </linearGradient>

    <!-- 朱砂金石渐变 -->
    <linearGradient id="fileIconRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="fileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#E11D48" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. 文件主轮廓（含右上角折角） -->
  <path d="M 28 16
           L 176 16
           L 228 68
           L 228 292
           C 228 298 224 304 216 304
           L 28 304
           C 20 304 16 298 16 292
           L 16 28
           C 16 20 20 16 28 16 Z"
        fill="url(#filePaperGrad)"
        stroke="rgba(255, 255, 255, 0.12)"
        stroke-width="2"/>

  <!-- 2. 右上角折角部分 -->
  <path d="M 176 16 L 176 68 L 228 68 Z"
        fill="url(#cornerGrad)"
        stroke="rgba(255, 255, 255, 0.15)"
        stroke-width="1.5"/>

  <!-- 3. 中心 Xu 甲骨文标志 (缩放居中) -->
  <g transform="translate(48, 80) scale(0.32)" filter="url(#fileGlow)">
    <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140"
          fill="none" stroke="url(#fileIconRed)" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 165 155 L 230 218 L 165 280"
          fill="none" stroke="url(#fileIconRed)" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 335 155 L 270 218 L 335 280"
          fill="none" stroke="url(#fileIconRed)" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 4. 底部 "XU" 标识标签 -->
  <rect x="74" y="242" width="108" height="34" rx="8" fill="rgba(225, 29, 72, 0.15)" stroke="rgba(225, 29, 72, 0.4)" stroke-width="1"/>
  <text x="128" y="265" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="800" font-size="16" fill="#FF385C" letter-spacing="3">.XU</text>
</svg>
