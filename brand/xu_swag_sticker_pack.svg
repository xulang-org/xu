<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <!-- Xu 官方周边贴纸套件 (Sticker Pack Design Sheet) -->
  <defs>
    <linearGradient id="stkRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <radialGradient id="holoGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FF6492"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="600" fill="#0A090D" rx="20"/>
  <text x="50" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="28" fill="#FFF">XU Official Sticker Pack · 官方贴纸套件</text>
  <text x="50" y="90" font-family="'JetBrains Mono', monospace" font-size="14" fill="#94A3B8">Die-cut vinyl, holographic laser &amp; matte obsidian stickers</text>

  <!-- 贴纸 1: 圆形哑光金石红贴 -->
  <g transform="translate(100, 150)">
    <circle cx="100" cy="100" r="95" fill="#141218" stroke="#FFF" stroke-width="4" stroke-dasharray="8 6"/>
    <circle cx="100" cy="100" r="88" fill="#141218"/>
    <g transform="translate(30, 30) scale(0.28)">
      <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#stkRed)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#stkRed)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#stkRed)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="100" y="225" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8" font-weight="700">MATTE OBSIDIAN (80mm)</text>
  </g>

  <!-- 贴纸 2: 全息激光镭射异形贴 -->
  <g transform="translate(380, 150)">
    <rect x="5" y="5" width="230" height="190" rx="24" fill="#141218" stroke="#FFF" stroke-width="4" stroke-dasharray="8 6"/>
    <rect x="12" y="12" width="216" height="176" rx="20" fill="url(#holoGrad)" opacity="0.9"/>
    <g transform="translate(45, 25) scale(0.3)">
      <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="#050508" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="#050508" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="#050508" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="120" y="225" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8" font-weight="700">HOLOGRAPHIC LASER (90x75mm)</text>
  </g>

  <!-- 贴纸 3: 语法长条贴纸 -->
  <g transform="translate(700, 160)">
    <rect x="0" y="0" width="240" height="60" rx="12" fill="#141218" stroke="#FFF" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="120" y="38" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="18" fill="#FF385C">&gt;&gt; errors.new()</text>

    <rect x="0" y="80" width="240" height="60" rx="12" fill="#141218" stroke="#FFF" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="120" y="118" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="18" fill="#10B981">&lt;&lt; zero_cost</text>

    <text x="120" y="170" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8" font-weight="700">SYNTAX BARS (95x25mm)</text>
  </g>
</svg>
