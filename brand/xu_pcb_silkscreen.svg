<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Xu 芯片丝印与微缩硬件载体规范 (PCB Silkscreen Marking 3.0mm Scale) -->
  <defs>
    <radialGradient id="chipBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C1B22"/>
      <stop offset="100%" stop-color="#0E0D12"/>
    </radialGradient>
  </defs>

  <!-- 1. 芯片 QFN/BGA 封装本体 (400x400) -->
  <rect width="500" height="500" fill="#0A090D"/>
  <rect x="50" y="50" width="400" height="400" rx="16" fill="url(#chipBg)" stroke="#333" stroke-width="2"/>

  <!-- 引脚金手指 (Pins) -->
  <g fill="#D97706">
    <!-- Top Pins -->
    <rect x="100" y="20" width="12" height="30" rx="2"/>
    <rect x="140" y="20" width="12" height="30" rx="2"/>
    <rect x="180" y="20" width="12" height="30" rx="2"/>
    <rect x="220" y="20" width="12" height="30" rx="2"/>
    <rect x="260" y="20" width="12" height="30" rx="2"/>
    <rect x="300" y="20" width="12" height="30" rx="2"/>
    <rect x="340" y="20" width="12" height="30" rx="2"/>
    <rect x="380" y="20" width="12" height="30" rx="2"/>
    <!-- Bottom Pins -->
    <rect x="100" y="450" width="12" height="30" rx="2"/>
    <rect x="140" y="450" width="12" height="30" rx="2"/>
    <rect x="180" y="450" width="12" height="30" rx="2"/>
    <rect x="220" y="450" width="12" height="30" rx="2"/>
    <rect x="260" y="450" width="12" height="30" rx="2"/>
    <rect x="300" y="450" width="12" height="30" rx="2"/>
    <rect x="340" y="450" width="12" height="30" rx="2"/>
    <rect x="380" y="450" width="12" height="30" rx="2"/>
  </g>

  <!-- Pin 1 标记点 -->
  <circle cx="85" cy="85" r="8" fill="#FFF"/>

  <!-- 芯片激光微雕丝印 (Laser Etched White Marking) -->
  <g transform="translate(160, 100) scale(0.36)">
    <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="#E2E8F0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="#E2E8F0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="#E2E8F0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="250" y="270" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="28" fill="#E2E8F0" letter-spacing="4">XU-CORE-M1</text>
  <text x="250" y="305" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#94A3B8" letter-spacing="2">64-BIT RISC-V AOT</text>
  <text x="250" y="335" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">LOT: 2026-XU-FAB1 · 3.0mm SILK</text>
</svg>
