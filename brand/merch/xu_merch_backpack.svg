<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 600" width="100%" height="100%">
  <!-- XU 官方极客通勤双肩包 / 战术防水电脑包 (Geek Commuter Tech Backpack · 22L) -->
  <defs>
    <linearGradient id="packRedG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="packShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(70, 30)" filter="url(#packShadow)">
    <!-- 顶部提手 (Reinforced Top Handle) -->
    <path d="M 150 50 C 150 15 250 15 250 50" fill="none" stroke="#252230" stroke-width="16" stroke-linecap="round"/>
    <path d="M 150 50 C 150 15 250 15 250 50" fill="none" stroke="#121018" stroke-width="10" stroke-linecap="round"/>

    <!-- 包身主体轮廓 (400×480mm · 1680D 哑光防水弹道尼龙 · #121018) -->
    <rect x="30" y="45" width="340" height="490" rx="36" fill="#121018" stroke="#23202E" stroke-width="2"/>

    <!-- 顶部卷口 / 防水主仓压胶拉链 (YKK Aquaguard) -->
    <path d="M 50 110 L 350 110" stroke="#050508" stroke-width="6" stroke-linecap="round"/>
    <path d="M 50 110 L 350 110" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="8 6"/>

    <!-- 前幅收纳立体袋 (Front Pocket) -->
    <rect x="55" y="150" width="290" height="340" rx="20" fill="#161420" stroke="#252232" stroke-width="1.5"/>

    <!-- 磁吸快拆搭扣织带 (Fidlock Magnetic Buckle Strap) -->
    <line x1="200" y1="150" x2="200" y2="340" stroke="#221F2C" stroke-width="12"/>
    <rect x="186" y="240" width="28" height="36" rx="4" fill="#0A090D" stroke="#374151" stroke-width="1.5"/>
    <circle cx="200" cy="258" r="4" fill="#E11D48"/>

    <!-- 居中阳极氧化金属朱砂红图腾铭牌 (双轴居中于 (200.0, 390.0)) -->
    <g transform="translate(200, 390)">
      <!-- 金属铭牌底板 -->
      <rect x="-38" y="-22" width="76" height="44" rx="6" fill="#0A090D" stroke="#2A2638" stroke-width="1"/>

      <!-- 居中图腾 (缩放 0.1) -->
      <g transform="translate(0, -3) scale(0.1)">
        <g transform="translate(-250, -255)">
          <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#packRedG)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#packRedG)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#packRedG)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
      <text y="14" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
        XU ARCH
      </text>
    </g>

    <!-- 侧边隐形水壶/伞兜与朱砂红夹标 -->
    <rect x="366" y="320" width="8" height="26" rx="2" fill="#E11D48"/>
  </g>
</svg>
