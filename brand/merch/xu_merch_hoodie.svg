<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <!-- XU 官方极客连帽卫衣 (双轴 X/Y 绝对中心对齐) -->
  <defs>
    <linearGradient id="minRedHV2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="minShadowHV2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 1. 正面卫衣 (Front · 前胸中央绝对居中 X=180.0, Y=135.0) -->
  <g transform="translate(40, 20)" filter="url(#minShadowHV2)">
    <path d="M 120 65 C 145 70 215 70 240 65 L 320 110 L 290 180 L 250 155 L 250 410 C 250 420 110 420 110 410 L 110 155 L 70 180 L 40 110 Z" fill="#121018" stroke="#23202E" stroke-width="1.5"/>

    <!-- 连帽结构 -->
    <path d="M 115 65 C 105 10 255 10 245 65 C 220 50 140 50 115 65 Z" fill="#181520" stroke="#2E2A3C" stroke-width="1.5"/>
    <path d="M 135 55 C 160 30 200 30 225 55" fill="none" stroke="#0A090D" stroke-width="2.5"/>

    <!-- 红色金属抽绳封头 -->
    <line x1="155" y1="60" x2="150" y2="115" stroke="#374151" stroke-width="2"/>
    <rect x="147" y="115" width="6" height="10" rx="2" fill="#E11D48"/>
    <line x1="205" y1="60" x2="210" y2="115" stroke="#374151" stroke-width="2"/>
    <rect x="207" y="115" width="6" height="10" rx="2" fill="#E11D48"/>

    <!-- 前胸微标 (双轴居中于 (180.0, 135.0)) -->
    <g transform="translate(180, 135) scale(0.12)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#minRedHV2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#minRedHV2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#minRedHV2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- 袋鼠兜 -->
    <path d="M 130 260 L 230 260 L 250 350 L 110 350 Z" fill="#181522" stroke="#262332" stroke-width="1.5"/>
  </g>

  <!-- 2. 后背卫衣 (Back · 双轴绝对居中 X=180.0, Y=160.0) -->
  <g transform="translate(440, 20)" filter="url(#minShadowHV2)">
    <path d="M 120 65 C 145 70 215 70 240 65 L 320 110 L 290 180 L 250 155 L 250 410 C 250 420 110 420 110 410 L 110 155 L 70 180 L 40 110 Z" fill="#121018" stroke="#23202E" stroke-width="1.5"/>
    <path d="M 115 65 C 115 120 245 120 245 65 C 220 55 140 55 115 65 Z" fill="#181520" stroke="#2E2A3C" stroke-width="1.5"/>

    <!-- 上背中央置入双轴绝对居中 VI 纵向组合 (中心 (180.0, 160.0)) -->
    <g id="hoodie-back-lockup">
      <!-- 居中图腾 (中心 (180, 135) · 缩放 0.16) -->
      <g transform="translate(180, 135) scale(0.16)">
        <g transform="translate(-250, -255)">
          <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#minRedHV2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#minRedHV2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#minRedHV2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
      <!-- 字标 (中点 X=180.0 · 基线 y = 178) -->
      <text x="180" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="20" fill="#F8FAFC" letter-spacing="-1">
        X<tspan fill="url(#minRedHV2)">U</tspan>
      </text>
      <!-- 副标 (中点 X=180.0 · 基线 y = 198) -->
      <text x="180" y="198" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="600" font-size="6.5" fill="#94A3B8" letter-spacing="2">
        SYSTEMS LANGUAGE
      </text>
    </g>
  </g>
</svg>
