<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%">
  <!-- XU 官方周边极客硬件飞机盒 / 环保包装箱 (Aircraft Unboxing & Shipping Box) -->
  <defs>
    <linearGradient id="boxRedG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 3D 轴测等轴瓦楞纸包装盒 (320×240×80mm) -->
  <g transform="translate(80, 50)" filter="url(#boxShadow)">
    <!-- 顶面 (Top Lid · 曜石黑 #121018) -->
    <polygon points="120,40 480,40 600,160 240,160" fill="#14121A" stroke="#252230" stroke-width="1.5"/>

    <!-- 顶面中央双轴居中标准组合 -->
    <g transform="translate(360, 100)">
      <!-- 居中图腾 (缩放 0.18) -->
      <g transform="translate(0, -12) scale(0.18)">
        <g transform="translate(-250, -255)">
          <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#boxRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#boxRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#boxRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
      <text y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="-1">
        X<tspan fill="url(#boxRedG)">U</tspan> HARDWARE
      </text>
    </g>

    <!-- 前侧面 (Front Face · #0C0B10) -->
    <polygon points="240,160 600,160 600,340 240,340" fill="#0E0D14" stroke="#252230" stroke-width="1.5"/>

    <!-- 前侧面红色快撕拉链条 (Easy-Open Pull Strip) -->
    <rect x="250" y="235" width="340" height="26" rx="6" fill="#E11D48"/>
    <text x="420" y="252" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#FFFFFF" letter-spacing="3">
      ► PULL TO UNBOX XU EXPERIENCE ►
    </text>

    <!-- 前侧面条形码与规格 -->
    <g transform="translate(260, 290)">
      <!-- 简易条形码 -->
      <line x1="0" y1="0" x2="0" y2="28" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="6" y1="0" x2="6" y2="28" stroke="#FFFFFF" stroke-width="1"/>
      <line x1="10" y1="0" x2="10" y2="28" stroke="#FFFFFF" stroke-width="3"/>
      <line x1="16" y1="0" x2="16" y2="28" stroke="#FFFFFF" stroke-width="1"/>
      <line x1="22" y1="0" x2="22" y2="28" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="28" y1="0" x2="28" y2="28" stroke="#FFFFFF" stroke-width="4"/>
      <line x1="36" y1="0" x2="36" y2="28" stroke="#FFFFFF" stroke-width="1"/>
      <line x1="42" y1="0" x2="42" y2="28" stroke="#FFFFFF" stroke-width="2"/>
      <text x="54" y="16" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#94A3B8">
        SN: XU-HW-2026-X8
      </text>
    </g>

    <!-- 左侧面 (Left Face · #07060A) -->
    <polygon points="120,40 240,160 240,340 120,220" fill="#08070C" stroke="#1A1824" stroke-width="1.5"/>

    <!-- 左侧面环保防潮标志 -->
    <g transform="translate(160, 180) rotate(-45)" font-family="'JetBrains Mono', monospace" font-size="7" fill="#4B5563">
      <text x="0" y="0">FRAGILE // HANDLE WITH CARE</text>
    </g>
  </g>
</svg>
