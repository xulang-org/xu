<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="100%">
  <!-- XU 官方机械键盘极客定制键帽 (双轴 X/Y 绝对中心对齐) -->
  <defs>
    <linearGradient id="capRedSV2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <radialGradient id="capGlowSV2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF385C" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#BE123C" stop-opacity="0"/>
    </radialGradient>
    <filter id="capShadowSV2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 1. 阳极氧化铝合金朱砂红键帽 (Left · 顶面中心点 X=118.0, Y=36.0) -->
  <g transform="translate(60, 60)" filter="url(#capShadowSV2)">
    <path d="M 30 240 L 0 50 L 200 50 L 230 240 Z" fill="#9F1239"/>
    <path d="M 0 50 L 28 15 L 228 15 L 200 50 Z" fill="#E11D48"/>
    <path d="M 200 50 L 228 15 L 258 205 L 230 240 Z" fill="#881337"/>

    <!-- 键帽接触面 (Top Face) -->
    <path d="M 32 50 L 50 22 L 205 22 L 188 50 Z" fill="#BE123C"/>

    <!-- 激光雕刻透光图腾 (绝对几何中心对齐于 (118.0, 36.0)) -->
    <g transform="translate(118, 36) scale(0.12)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- 2. 曜石黑半透树脂 RGB 键帽 (Right · 顶面中心点 X=118.0, Y=36.0) -->
  <g transform="translate(370, 60)" filter="url(#capShadowSV2)">
    <path d="M 30 240 L 0 50 L 200 50 L 230 240 Z" fill="#0C0B10"/>
    <path d="M 0 50 L 28 15 L 228 15 L 200 50 Z" fill="#1E1B28"/>
    <path d="M 200 50 L 228 15 L 258 205 L 230 240 Z" fill="#050508"/>

    <path d="M 32 50 L 50 22 L 205 22 L 188 50 Z" fill="#14121C"/>

    <!-- 内部发光霓虹红色图腾 (绝对几何中心对齐于 (118.0, 36.0)) -->
    <circle cx="118" cy="36" r="32" fill="url(#capGlowSV2)"/>
    <g transform="translate(118, 36) scale(0.12)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="#FF385C" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="#FF385C" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="#FF385C" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
