<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%">
  <!-- XU 官方金属保温杯与极客咖啡杯 (双轴 X/Y 绝对中心对齐) -->
  <defs>
    <linearGradient id="mugRedDarkVC2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="mugRedLightVC2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="minShadowMugVC2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- 1. 316 哑光黑随行保温杯 (Left · 杯身几何中心 X=105.0, Y=230.0) -->
  <g transform="translate(80, 40)" filter="url(#minShadowMugVC2)">
    <rect x="30" y="70" width="150" height="320" rx="18" fill="#121018" stroke="#23202E" stroke-width="2"/>
    <rect x="25" y="32" width="160" height="38" rx="8" fill="#1A1822" stroke="#2B2738" stroke-width="1.5"/>
    <rect x="65" y="14" width="80" height="18" rx="6" fill="#0A090D"/>
    <rect x="90" y="18" width="30" height="10" rx="3" fill="#E11D48"/>

    <!-- 杯身印花双轴绝对几何居中组 (中心 X=105.0, Y=230.0) -->
    <g id="tumbler-centered-lockup">
      <!-- 居中图腾 (中心 (105, 195) · 缩放 0.17) -->
      <g transform="translate(105, 195) scale(0.17)">
        <g transform="translate(-250, -255)">
          <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#mugRedDarkVC2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#mugRedDarkVC2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#mugRedDarkVC2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
      <!-- 字标 (中点 X=105.0 · 基线 y = 250) -->
      <text x="105" y="250" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="22" fill="#F8FAFC" letter-spacing="-1">
        X<tspan fill="url(#mugRedDarkVC2)">U</tspan>
      </text>
      <!-- 副标 (中点 X=105.0 · 基线 y = 272) -->
      <text x="105" y="272" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="600" font-size="7.5" fill="#94A3B8" letter-spacing="2">
        SYSTEMS LANGUAGE
      </text>
    </g>
  </g>

  <!-- 2. 极客哑光陶瓷马克杯 (Right · 杯身几何中心 X=120.0, Y=130.0) -->
  <g transform="translate(400, 110)" filter="url(#minShadowMugVC2)">
    <path d="M 210 60 C 285 60 285 190 210 190" fill="none" stroke="#181622" stroke-width="24" stroke-linecap="round"/>
    <path d="M 210 60 C 285 60 285 190 210 190" fill="none" stroke="#252230" stroke-width="16" stroke-linecap="round"/>

    <rect x="20" y="25" width="200" height="210" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <ellipse cx="120" cy="25" rx="100" ry="10" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- 杯腹印花双轴绝对几何居中组 (中心 X=120.0, Y=130.0) -->
    <g id="mug-centered-lockup">
      <!-- 居中图腾 (中心 (120, 100) · 缩放 0.17) -->
      <g transform="translate(120, 100) scale(0.17)">
        <g transform="translate(-250, -255)">
          <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#mugRedLightVC2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#mugRedLightVC2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#mugRedLightVC2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
      <!-- 字标 (中点 X=120.0 · 基线 y = 152) -->
      <text x="120" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="22" fill="#111827" letter-spacing="-1">
        X<tspan fill="url(#mugRedLightVC2)">U</tspan>
      </text>
      <!-- 副标 (中点 X=120.0 · 基线 y = 174) -->
      <text x="120" y="174" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="7.5" fill="#4B5563" letter-spacing="2">
        SYSTEMS LANGUAGE
      </text>
    </g>
  </g>
</svg>
