<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <!-- XU 官方原色帆布托特包 (双轴 X/Y 绝对中心对齐 X=200.0, Y=350.0) -->
  <defs>
    <linearGradient id="toteRedVC2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="toteShadowVC2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <g transform="translate(50, 20)" filter="url(#toteShadowVC2)">
    <!-- 帆布肩带 (严格对称) -->
    <path d="M 90 190 C 90 30 170 30 170 190" fill="none" stroke="#DCD6CD" stroke-width="24" stroke-linecap="round"/>
    <path d="M 230 190 C 230 30 310 30 310 190" fill="none" stroke="#DCD6CD" stroke-width="24" stroke-linecap="round"/>
    <path d="M 90 190 C 90 30 170 30 170 190" fill="none" stroke="#ECE7DE" stroke-width="18" stroke-linecap="round"/>
    <path d="M 230 190 C 230 30 310 30 310 190" fill="none" stroke="#ECE7DE" stroke-width="18" stroke-linecap="round"/>

    <!-- 帆布包体 (高度 180~520 · 中心点 X=200.0, Y=350.0) -->
    <rect x="0" y="180" width="400" height="340" rx="14" fill="#F4EFE6" stroke="#D9D2C5" stroke-width="2"/>
    <line x1="10" y1="510" x2="390" y2="510" stroke="#D0C8BA" stroke-width="2"/>

    <!-- 正面中央双轴绝对几何居中组 (中心锁定于 (200.0, 350.0)) -->
    <g id="tote-centered-lockup">
      <!-- 居中图腾 (以 (200, 310) 为几何中心 · 缩放 0.28) -->
      <g transform="translate(200, 310) scale(0.28)">
        <g transform="translate(-250, -255)">
          <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#toteRedVC2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#toteRedVC2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#toteRedVC2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- VI 标准字标 (水平中点 X=200.0 · 基线 y = 385) -->
      <text x="200" y="385" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="44" fill="#111827" letter-spacing="-2">
        X<tspan fill="url(#toteRedVC2)">U</tspan>
      </text>

      <!-- VI 官方定位副标 (水平中点 X=200.0 · 基线 y = 416) -->
      <text x="200" y="416" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="9" fill="#4B5563" letter-spacing="3">
        SYSTEMS LANGUAGE
      </text>
    </g>

    <!-- 侧边微型朱砂红织唛 -->
    <rect x="396" y="338" width="10" height="24" rx="2" fill="#E11D48"/>
  </g>
</svg>
