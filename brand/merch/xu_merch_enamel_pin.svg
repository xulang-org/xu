<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="100%" height="100%">
  <!-- XU 官方锌合金珐琅金属胸针徽章 (双轴 X/Y 绝对中心对齐) -->
  <defs>
    <linearGradient id="goldRimSV2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="silverRimSV2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="enamelRedSV2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="pinShadowSV2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 1. 枪黑磨砂 + 填真朱砂红软珐琅徽章 (Left · 几何中心 X=130.0, Y=130.0) -->
  <g transform="translate(80, 50)" filter="url(#pinShadowSV2)">
    <path d="M 90 20 L 170 20 L 240 90 L 240 170 L 170 240 L 90 240 L 20 170 L 20 90 Z" fill="#14121A" stroke="#2D293A" stroke-width="6"/>
    <path d="M 92 26 L 168 26 L 234 92 L 234 168 L 168 234 L 92 234 L 26 168 L 26 92 Z" fill="#0C0B10" stroke="url(#goldRimSV2)" stroke-width="2.5"/>

    <!-- 填油真朱砂红图腾 (绝对几何中心对齐于 (130.0, 130.0) · 缩放 0.28) -->
    <g transform="translate(130, 130) scale(0.28)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#goldRimSV2)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#enamelRedSV2)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#goldRimSV2)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#enamelRedSV2)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#goldRimSV2)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#enamelRedSV2)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- 2. 亮银金属冲压纪念徽章 (Right · 几何中心 X=130.0, Y=130.0) -->
  <g transform="translate(380, 50)" filter="url(#pinShadowSV2)">
    <circle cx="130" cy="130" r="110" fill="#FFFFFF" stroke="url(#silverRimSV2)" stroke-width="6"/>
    <circle cx="130" cy="130" r="98" fill="#F8FAFC" stroke="url(#silverRimSV2)" stroke-width="1.5"/>

    <!-- 居中纯粹甲骨图腾 (绝对几何中心对齐于 (130.0, 130.0) · 缩放 0.28) -->
    <g transform="translate(130, 130) scale(0.28)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#silverRimSV2)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#enamelRedSV2)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#silverRimSV2)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#enamelRedSV2)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#silverRimSV2)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#enamelRedSV2)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
