<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <!-- XU 官方极客文化衫 · 曜石黑版 (双轴 X/Y 绝对中心对齐) -->
  <defs>
    <linearGradient id="minRedDV2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="minShadowDV2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- 1. 正面 T恤 (Front · 左胸微标) -->
  <g transform="translate(40, 20)" filter="url(#minShadowDV2)">
    <path d="M 120 40 C 145 55 215 55 240 40 L 320 90 L 285 155 L 250 135 L 250 410 C 250 420 110 420 110 410 L 110 135 L 75 155 L 40 90 Z" fill="#121018" stroke="#23202E" stroke-width="1.5"/>
    <path d="M 120 40 C 145 75 215 75 240 40" fill="none" stroke="#252230" stroke-width="5"/>
    <path d="M 120 40 C 145 78 215 78 240 40" fill="none" stroke="#08070C" stroke-width="1.5"/>

    <!-- 左胸口：仅保留一枚精致的纯粹金石小标 (24mm) -->
    <g transform="translate(220, 135) scale(0.1)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#minRedDV2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#minRedDV2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#minRedDV2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <rect x="238" y="388" width="12" height="18" rx="2" fill="#E11D48"/>
  </g>

  <!-- 2. 后背 T恤 (Back · 双轴 X/Y 绝对中心对齐 X=180.0, Y=150.0) -->
  <g transform="translate(440, 20)" filter="url(#minShadowDV2)">
    <path d="M 120 40 C 145 50 215 50 240 40 L 320 90 L 285 155 L 250 135 L 250 410 C 250 420 110 420 110 410 L 110 135 L 75 155 L 40 90 Z" fill="#121018" stroke="#23202E" stroke-width="1.5"/>
    <path d="M 120 40 C 145 52 215 52 240 40" fill="none" stroke="#252230" stroke-width="5"/>

    <!-- 上背中央置入双轴绝对居中 VI 纵向组合 (中心 (180.0, 150.0)) -->
    <g id="tshirt-back-lockup">
      <!-- 居中图腾 (中心 (180, 125) · 缩放 0.16) -->
      <g transform="translate(180, 125) scale(0.16)">
        <g transform="translate(-250, -255)">
          <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#minRedDV2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#minRedDV2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#minRedDV2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
      <!-- 字标 (中点 X=180.0 · 基线 y = 168) -->
      <text x="180" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="20" fill="#F8FAFC" letter-spacing="-1">
        X<tspan fill="url(#minRedDV2)">U</tspan>
      </text>
      <!-- 副标 (中点 X=180.0 · 基线 y = 188) -->
      <text x="180" y="188" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="600" font-size="6.5" fill="#94A3B8" letter-spacing="2">
        SYSTEMS LANGUAGE
      </text>
    </g>
  </g>
</svg>
