<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <!-- XU 官方全套 6 款极客笔记本贴纸 (2×3 严格数学网格 · 双轴 X/Y 绝对中心对齐) -->
  <defs>
    <!-- 朱砂红官方渐变 -->
    <linearGradient id="stkRedG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <!-- 模切阴影 -->
    <filter id="dieCutShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- ================= ROW 1 (CY = 140) ================= -->

  <!-- 贴纸 1: 【曜石黑圆标 · 官方原典】(中心点 X=170.0, Y=140.0 · 直径 150px) -->
  <g id="sticker-1" filter="url(#dieCutShadow)">
    <circle cx="170" cy="140" r="75" fill="#121018" stroke="#FFFFFF" stroke-width="4"/>
    <!-- 内部双轴居中纵向组合 (以 (170, 140) 为绝对几何中心) -->
    <g transform="translate(170, 114) scale(0.18)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#stkRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#stkRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#stkRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <text x="170" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="22" fill="#F8FAFC" letter-spacing="-1">
      X<tspan fill="url(#stkRedG)">U</tspan>
    </text>
    <text x="170" y="176" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7" font-weight="700" fill="#94A3B8" letter-spacing="1.5">
      SYSTEMS LANGUAGE
    </text>
  </g>

  <!-- 贴纸 2: 【极客六角盾 · 中英双语标】(中心点 X=450.0, Y=140.0 · 宽高 150×150px) -->
  <g id="sticker-2" filter="url(#dieCutShadow)">
    <polygon points="450,65 520,105 520,175 450,215 380,175 380,105" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <!-- 内部双轴居中中英组合 (以 (450, 140) 为绝对几何中心) -->
    <g transform="translate(450, 114) scale(0.18)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#stkRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#stkRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#stkRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <text x="450" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif" font-weight="900" font-size="14" fill="#111827">
      XU <tspan fill="url(#stkRedG)">编程语言</tspan>
    </text>
    <text x="450" y="176" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7" font-weight="700" fill="#6B7280" letter-spacing="1">
      ZERO GC · NATIVE
    </text>
  </g>

  <!-- 贴纸 3: 【胶囊横幅 · XUFLOW 代码审查评审系统】(中心点 X=730.0, Y=140.0 · 宽高 230×70px) -->
  <g id="sticker-3" filter="url(#dieCutShadow)">
    <rect x="615" y="105" width="230" height="70" rx="35" fill="#14121A" stroke="#FFFFFF" stroke-width="3.5"/>
    <!-- 内部双轴居中 XUFLOW 子品牌组合 -->
    <g transform="translate(642, 140) scale(0.09)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#stkRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#stkRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#stkRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <text x="666" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="21" fill="#FFFFFF" letter-spacing="-1">
      XU<tspan fill="url(#stkRedG)">FLOW</tspan>
    </text>
    <!-- REVIEW 徽章 (代码审查与质量评审系统) -->
    <rect x="768" y="128" width="60" height="24" rx="6" fill="#10B981"/>
    <text x="798" y="144" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="8.5" fill="#FFFFFF" letter-spacing="1">REVIEW</text>
  </g>

  <!-- ================= ROW 2 (CY = 380) ================= -->

  <!-- 贴纸 4: 【胶囊横幅 · XUPKG 包管理器】(中心点 X=170.0, Y=380.0 · 宽高 230×70px) -->
  <g id="sticker-4" filter="url(#dieCutShadow)">
    <rect x="55" y="345" width="230" height="70" rx="35" fill="#14121A" stroke="#FFFFFF" stroke-width="3.5"/>
    <!-- 内部双轴居中 XUPKG 子品牌组合 -->
    <g transform="translate(85, 380) scale(0.09)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#stkRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#stkRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#stkRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <text x="110" y="387" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="-1">
      XU<tspan fill="url(#stkRedG)">PKG</tspan>
    </text>
    <!-- PKG 徽章 -->
    <rect x="222" y="368" width="42" height="24" rx="6" fill="#0284C7"/>
    <text x="243" y="384" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="9.5" fill="#FFFFFF">PKG</text>
  </g>

  <!-- 贴纸 5: 【朱砂红纯粹标 · SUPERSONIC】(中心点 X=450.0, Y=380.0 · 宽高 200×70px) -->
  <g id="sticker-5" filter="url(#dieCutShadow)">
    <rect x="350" y="345" width="200" height="70" rx="12" fill="#E11D48" stroke="#FFFFFF" stroke-width="3.5"/>
    <text x="450" y="382" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" letter-spacing="-1">
      XU
    </text>
    <text x="450" y="398" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#FFE4E6" letter-spacing="2">
      SUPERSONIC
    </text>
  </g>

  <!-- 贴纸 6: 【宣纸白极简横标 · 官方横向组合】(中心点 X=730.0, Y=380.0 · 宽高 230×70px) -->
  <g id="sticker-6" filter="url(#dieCutShadow)">
    <rect x="615" y="345" width="230" height="70" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <!-- 内部双轴居中横向标准组合 (以 (730, 380) 为中心) -->
    <g transform="translate(642, 380) scale(0.1)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#stkRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#stkRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#stkRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <text x="670" y="387" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="20" fill="#111827" letter-spacing="-1">
      X<tspan fill="url(#stkRedG)">U</tspan> <tspan font-size="11" font-weight="700" fill="#6B7280">LANGUAGE</tspan>
    </text>
  </g>
</svg>
