<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <!-- XU 官方 900×400mm 极客速查桌垫 (1:1 实际物理尺寸 · 瑞士网格严密排印 · 100% 官方语法高亮) -->
  <defs>
    <!-- 朱砂红官方渐变 -->
    <linearGradient id="matRedLockup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <!-- 30mm 极客点阵微网格 -->
    <pattern id="matGridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.75" fill="rgba(255, 255, 255, 0.05)"/>
    </pattern>
  </defs>

  <!-- 1. 桌垫底板 (900×400mm · 4mm 曜石黑触感天然橡胶 · 3mm 红色精密锁边) -->
  <rect width="900" height="400" rx="14" fill="#0B0A0F" stroke="#E11D48" stroke-width="2.5"/>
  <rect width="900" height="400" rx="14" fill="url(#matGridPattern)"/>

  <!-- 2. 顶部官方页眉 Header Bar (y: 20 ~ 70 · 严格双端对齐) -->
  <g transform="translate(31, 24)">
    <!-- 左侧: 官方横向暗夜标准组合 (缩放 0.24) -->
    <g transform="translate(0, 0) scale(0.24)">
      <!-- 甲骨金石图腾 -->
      <g transform="translate(20, 10) scale(0.36)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#matRedLockup)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#matRedLockup)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#matRedLockup)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- 细分割线 -->
      <line x1="210" y1="45" x2="210" y2="155" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" stroke-linecap="round"/>
      <!-- 字标与副标 -->
      <g transform="translate(245, 0)">
        <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="102" fill="#F8FAFC" letter-spacing="-2">
          X<tspan fill="url(#matRedLockup)">U</tspan>
        </text>
        <text x="5" y="160" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="14" fill="#94A3B8" letter-spacing="4">
          ROCK-SOLID · ZERO GC · SUPERSONIC
        </text>
      </g>
    </g>

    <!-- 右侧: 官方规格与技术坐标 (基线对齐) -->
    <g transform="translate(838, 12)" text-anchor="end" font-family="'JetBrains Mono', monospace">
      <text y="14" font-size="9.5" font-weight="700" fill="#E2E8F0" letter-spacing="1">
        SPEC: 900×400×4.0mm <tspan fill="#E11D48">//</tspan> DESK MAT
      </text>
      <text y="28" font-size="8" fill="#64748B" letter-spacing="1.5">
        OFFICIAL DEVELOPER EDITION · HTTPS://XU-LANG.DEV
      </text>
    </g>

    <!-- 贯穿线 -->
    <line x1="0" y1="48" x2="838" y2="48" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <line x1="0" y1="48" x2="100" y2="48" stroke="#E11D48" stroke-width="2"/>
  </g>

  <!-- 3. 下方三列极客速查卡片 (三列等宽 266px · 间距 20px · 左右留白 31px) -->

  <!-- 模块 01: 所有权与内存安全速查 (严格官方语法高亮) -->
  <g transform="translate(31, 86)">
    <!-- 卡片底板 -->
    <rect width="266" height="284" rx="8" fill="#110F17" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1"/>
    <!-- 卡片标题栏 -->
    <rect width="266" height="32" rx="6" fill="#181522"/>
    <rect x="12" y="8" width="8" height="16" rx="2" fill="#E11D48"/>
    <text x="26" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#FF385C" letter-spacing="1">
      01 // OWNERSHIP &amp; MEMORY
    </text>

    <!-- 代码语法速查行 -->
    <g transform="translate(14, 48)" font-family="'JetBrains Mono', monospace" font-size="9" fill="#E2E8F0">
      <text y="14"><tspan fill="#FF385C">mut</tspan> val := <tspan fill="#A855F7">acquire_resource</tspan>()</text>
      <text y="32" font-size="7.5" fill="#64748B">// 独占所有权 (Unique Owner)</text>

      <text y="56">r := <tspan fill="#EC4899">&amp;</tspan>val</text>
      <text y="74" font-size="7.5" fill="#64748B">// 不可变只读借用 (Shared Borrow)</text>

      <text y="98">w := <tspan fill="#EC4899">mut &amp;</tspan>val</text>
      <text y="116" font-size="7.5" fill="#64748B">// 排他性可变借用 (Exclusive Borrow)</text>

      <text y="140"><tspan fill="#FF385C">affine</tspan>(t) <tspan fill="#64748B">// 仿射类型保证零泄漏</tspan></text>
      <text y="164"><tspan fill="#F59E0B">&lt;&lt;</tspan> <tspan fill="#FBBF24">0</tspan> <tspan fill="#64748B">// 零成本寄存器返回 (Move)</tspan></text>
      <text y="188"><tspan fill="#FF385C">defer</tspan> val.<tspan fill="#A855F7">release</tspan>() <tspan fill="#64748B">// 确定性析构</tspan></text>
      <text y="212"><tspan fill="#FF385C">#</tspan><tspan fill="#38BDF8">safety</tspan>(pure) <tspan fill="#64748B">// 内存安全静态证明</tspan></text>
    </g>
  </g>

  <!-- 模块 02: 并发模型与 CSP 通道速查 -->
  <g transform="translate(317, 86)">
    <rect width="266" height="284" rx="8" fill="#110F17" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1"/>
    <rect width="266" height="32" rx="6" fill="#181522"/>
    <rect x="12" y="8" width="8" height="16" rx="2" fill="#38BDF8"/>
    <text x="26" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#38BDF8" letter-spacing="1">
      02 // CONCURRENCY &amp; CSP
    </text>

    <g transform="translate(14, 48)" font-family="'JetBrains Mono', monospace" font-size="9" fill="#E2E8F0">
      <text y="14"><tspan fill="#FF385C">#</tspan><tspan fill="#38BDF8">std/sync</tspan> <tspan fill="#64748B">// 导入并发与信道库</tspan></text>

      <text y="42">ch := sync.<tspan fill="#A855F7">new_chan</tspan>&lt;<tspan fill="#38BDF8">T</tspan>&gt;(<tspan fill="#FBBF24">16</tspan>)</text>
      <text y="60" font-size="7.5" fill="#64748B">// 创建有界零拷贝 CSP 信道</text>

      <text y="84"><tspan fill="#FF385C">xu</tspan> { ch.<tspan fill="#A855F7">send</tspan>(payload) }</text>
      <text y="102" font-size="7.5" fill="#64748B">// 启动轻量级协作式协程</text>

      <text y="126">msg := ch.<tspan fill="#A855F7">recv</tspan>()</text>
      <text y="144" font-size="7.5" fill="#64748B">// 安全非阻塞同步消费</text>

      <text y="168">sync.<tspan fill="#A855F7">select</tspan>(c1, c2, timeout)</text>
      <text y="186" font-size="7.5" fill="#64748B">// 多通道原子事件轮询</text>

      <text y="210">ch.<tspan fill="#A855F7">close</tspan>() <tspan fill="#64748B">// 优雅广播并销毁通道</tspan></text>
    </g>
  </g>

  <!-- 模块 03: 极速编译器与工程构建速查 -->
  <g transform="translate(603, 86)">
    <rect width="266" height="284" rx="8" fill="#110F17" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1"/>
    <rect width="266" height="32" rx="6" fill="#181522"/>
    <rect x="12" y="8" width="8" height="16" rx="2" fill="#10B981"/>
    <text x="26" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#10B981" letter-spacing="1">
      03 // CLI &amp; TOOLCHAIN
    </text>

    <g transform="translate(14, 48)" font-family="'JetBrains Mono', monospace" font-size="9" fill="#E2E8F0">
      <text y="14">$ <tspan fill="#10B981">xu</tspan> build main.xu <tspan fill="#F59E0B">-O3 -o bin/app</tspan></text>
      <text y="32" font-size="7.5" fill="#64748B">// 全优化极速原生机器码编译</text>

      <text y="56">$ <tspan fill="#10B981">xu</tspan> run server.xu <tspan fill="#64748B">-- --port 8088</tspan></text>
      <text y="74" font-size="7.5" fill="#64748B">// 即时 AOT 调试运行</text>

      <text y="98">$ <tspan fill="#10B981">xu</tspan> test <tspan fill="#F59E0B">--benchmark</tspan></text>
      <text y="116" font-size="7.5" fill="#64748B">// 纳秒级单元测试与性能基准</text>

      <text y="140">$ <tspan fill="#10B981">xu</tspan> pkg add <tspan fill="#FF385C">#</tspan><tspan fill="#38BDF8">net/http</tspan></text>
      <text y="164" font-size="7.5" fill="#64748B">// 依赖包引入与校验</text>

      <text y="188">$ <tspan fill="#10B981">xu</tspan> fmt <tspan fill="#F59E0B">--check</tspan> src/</text>
      <text y="212">$ <tspan fill="#10B981">xu</tspan> doc <tspan fill="#F59E0B">--serve</tspan> 6060</text>
    </g>
  </g>
</svg>
