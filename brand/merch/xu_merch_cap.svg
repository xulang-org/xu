<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="100%" height="100%">
  <!-- XU 官方极简低顶 6-Panel 刺绣棒球帽 / 鸭舌帽 (双轴 X/Y 绝对中心对齐) -->
  <defs>
    <linearGradient id="capRedG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="capShadowD" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 1. 曜石黑纯棉款棒球帽 (Left · 黑色斜纹纯棉) -->
  <g transform="translate(60, 40)" filter="url(#capShadowD)">
    <!-- 帽冠 (Crown · 6-Panel 结构) -->
    <path d="M 30 250 C 30 90 250 90 250 250 Z" fill="#121018" stroke="#23202E" stroke-width="1.5"/>
    <path d="M 140 100 L 140 250" stroke="#1F1C28" stroke-width="1.5"/>
    <!-- 顶部纽扣 (Top Button) -->
    <circle cx="140" cy="100" r="7" fill="#08070C"/>

    <!-- 弧形帽檐 (Curved Visor · 曜石黑) -->
    <path d="M 10 250 C 30 290 250 290 270 250 C 230 235 50 235 10 250 Z" fill="#0A090D" stroke="#1F1C28" stroke-width="1.5"/>
    <path d="M 25 258 C 50 282 230 282 255 258" fill="none" stroke="#23202E" stroke-width="1.2"/>

    <!-- 正面中央 3D 立体朱砂红刺绣图腾 (双轴居中于 (140, 185)) -->
    <g transform="translate(140, 185) scale(0.18)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#capRedG)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#capRedG)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#capRedG)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- 侧边透气孔 -->
    <circle cx="85" cy="165" r="2.5" fill="#2A2638"/>
    <circle cx="195" cy="165" r="2.5" fill="#2A2638"/>
  </g>

  <!-- 2. 宣纸白纯棉款棒球帽 (Right · 白色斜纹纯棉) -->
  <g transform="translate(380, 40)" filter="url(#capShadowD)">
    <path d="M 30 250 C 30 90 250 90 250 250 Z" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <path d="M 140 100 L 140 250" stroke="#F3F4F6" stroke-width="1.5"/>
    <circle cx="140" cy="100" r="7" fill="#E5E7EB"/>

    <!-- 弧形帽檐 -->
    <path d="M 10 250 C 30 290 250 290 270 250 C 230 235 50 235 10 250 Z" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5"/>
    <path d="M 25 258 C 50 282 230 282 255 258" fill="none" stroke="#E2E8F0" stroke-width="1.2"/>

    <!-- 正面中央 3D 立体朱砂红刺绣图腾 -->
    <g transform="translate(140, 185) scale(0.18)">
      <g transform="translate(-250, -255)">
        <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#capRedG)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#capRedG)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#capRedG)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- 侧边透气孔 -->
    <circle cx="85" cy="165" r="2.5" fill="#E5E7EB"/>
    <circle cx="195" cy="165" r="2.5" fill="#E5E7EB"/>
  </g>
</svg>
