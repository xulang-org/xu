<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 600" width="100%" height="100%">
  <!-- XU 官方高阶哑光黑礼品手提纸袋 (Luxury Matte Paper Gift Bag) -->
  <defs>
    <linearGradient id="bagRedG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="bagShadowD" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g transform="translate(70, 30)" filter="url(#bagShadowD)">
    <!-- 纯棉罗纹手提带 (Woven Cotton Ribbon Handles · 对称中轴) -->
    <path d="M 120 160 C 120 15 180 15 180 160" fill="none" stroke="#252230" stroke-width="16" stroke-linecap="round"/>
    <path d="M 220 160 C 220 15 280 15 280 160" fill="none" stroke="#252230" stroke-width="16" stroke-linecap="round"/>
    <circle cx="120" cy="160" r="5" fill="#E11D48"/>
    <circle cx="180" cy="160" r="5" fill="#E11D48"/>
    <circle cx="220" cy="160" r="5" fill="#E11D48"/>
    <circle cx="280" cy="160" r="5" fill="#E11D48"/>

    <!-- 纸袋主体 (350g 触感哑光黑卡纸 · 360×440mm · 中心 X=200.0, Y=350.0) -->
    <polygon points="20,130 380,130 380,530 20,530" fill="#121018" stroke="#23202E" stroke-width="2"/>

    <!-- 侧边立体风琴琴褶折痕 (Gusset Fold) -->
    <polygon points="380,130 400,100 400,500 380,530" fill="#0A090D" stroke="#1C1A24" stroke-width="1"/>
    <polygon points="20,130 40,100 400,100 380,130" fill="#1A1822" stroke="#2B2738" stroke-width="1"/>

    <!-- 正面中央双轴绝对居中 VI 纵向标准组合 (中心 (200.0, 330.0)) -->
    <g id="gift-bag-centered-lockup">
      <!-- 居中图腾 (中心 (200, 290) · 缩放 0.3) -->
      <g transform="translate(200, 290) scale(0.3)">
        <g transform="translate(-250, -255)">
          <path d="M 105 140 L 90 295 L 250 370 L 410 295 L 395 140" fill="none" stroke="url(#bagRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 165 155 L 230 218 L 165 280" fill="none" stroke="url(#bagRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 335 155 L 270 218 L 335 280" fill="none" stroke="url(#bagRedG)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- VI 标准字标 (中点 X=200.0 · 基线 y = 370) -->
      <text x="200" y="370" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="-2">
        X<tspan fill="url(#bagRedG)">U</tspan>
      </text>

      <!-- VI 官方副标 (中点 X=200.0 · 基线 y = 402) -->
      <text x="200" y="402" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="9" fill="#94A3B8" letter-spacing="3">
        SYSTEMS PROGRAMMING LANGUAGE
      </text>
    </g>

    <!-- 底部吊牌朱砂红封边 -->
    <line x1="20" y1="526" x2="380" y2="526" stroke="#E11D48" stroke-width="2.5"/>
  </g>
</svg>
